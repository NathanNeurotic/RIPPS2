  HINT_NARGS_LOGO: Visar PS2-loggan före spelet (en andra omstart av IOP, som vissa iLink-enheter behöver). Av här följer RIPPS2 Spelstart > PS2-logga och skickar den aldrig för MMCE- eller nätverksspel.
  HINT_NARGS_CWD: 'Mappen som spelet ser som sin egen. Tom: Neutrinos standard.'
  HINT_NARGS_CFG: 'En egen Neutrino-konfigurationsfil (-cfg). Tom: Neutrinos.'
  HINT_NARGS_ELF: 'Startar den här ELF:en i stället för startfilen som skivan anger. Tom: spelets egen.'
  HINT_NARGS_ATA0: En HDD-avbild som Neutrino monterar som konsolens interna HDD, för spel som använder HDD:n (-ata0).
  HINT_NARGS_ATA0ID: ID-filen som hör till den HDD-avbilden (-ata0id).
  HINT_NARGS_ATA1: En andra HDD-avbild (-ata1).
  RIPPS2_LAST_USED: Senast använd
  RIPPS2_PAGE_BUTTONS: Sidknappar
  HINT_RIPPS2_PAGE_BUTTONS: 'Vilka axelknappar som bläddrar sidorna i spellistan. L2 / R2: de bläddrar sidorna och L1 / R1 byter kategori. L1 / R1: de bläddrar sidorna och L2 / R2 byter kategori. Tema: temat bestämmer; utan tema går L2 till början och R2 till slutet. L2 + R2 samtidigt väljer alltid ett slumpmässigt spel.'
  RIPPS2_IGR_MENU: Meny i spelet
  HINT_RIPPS2_IGR_MENU: 'Experimentellt. På: L1+L2+R1+R2+SELECT+START pausar ett spel med Fortsätt, Prestationer och Avsluta spelet; i vissa spel hackar ljudet eller spelet stannar om det pausas under en mellansekvens. Av (standard): kombinationen lämnar spelet direkt, OPL:s pålitliga IGR.'
  RIPPS2_BOOT_LOADER: Startladdare
  HINT_RIPPS2_BOOT_LOADER: Visar vad varje minneskort startar vid start och installerar BIBLE (PS2BBL inställt för RIPPS2). Kortets gamla startfiler sparas.
  RIPPS2_MANAGE: Hantera
  RIPPS2_ACHIEVEMENTS: Prestationer
  RIPPS2_NBD_SERVER: NBD-server
  HINT_RIPPS2_NBD_SERVER: Delar hårddisken med en PC över nätverket. En statusskärm visas medan den körs.
  RIPPS2_START: Starta
  RIPPS2_COVER_ART: Omslag
  HINT_RIPPS2_COVER_ART: Laddar ner ett omslag för varje PS2-spel utan omslag i dina startade listor, till den enhetens ART-mapp, från xlenores ps2-covers på GitHub. Kräver nätverkskabeln och internet.
  RIPPS2_DOWNLOAD: Ladda ner
  RIPPS2_GLYPHS: Styrkorssymboler
  HINT_RIPPS2_GLYPHS: 'Styrkorssymboler bredvid enhets- och formationsnamn. Tona in visar dem när du byter; Tona ut visar dem när en sida öppnas. Tema: temat bestämmer.'
  RIPPS2_COLOR_THEME: Färgtema
  HINT_RIPPS2_COLOR_THEME: 'En färg för tornen, kloten, glaset, CD-spelaren och filbläddraren, på alla tre flikarna. Tema: temat bestämmer (RIPPS2-blått där det inte gör det).'
  RIPPS2_HINTS: Knapptips
  HINT_RIPPS2_HINTS: 'Knapptipsen längst ner. Tona vid inaktivitet döljer dem tills du trycker på en knapp. Tema: temat bestämmer.'
  RIPPS2_CATEGORY_BAR: Kategorifält
  HINT_RIPPS2_CATEGORY_BAR: 'STARTA SKIVA, LAGRING och MINNESFILER högst upp. Tona vid inaktivitet döljer dem tills du trycker på en knapp. Tema: temat bestämmer.'
  RIPPS2_SOURCE_NAME: Källnamn
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Källa
  HINT_RIPPS2_SOURCE_NAME: 'Källans namn ovanför spelen (ALLA SPEL, HDD-SPEL och så vidare). Tona vid inaktivitet tonar ut det med kategorifältet; Poppa in visar det i stället stort mitt på sidan, så som L3 namnger listan, vid första listan efter start och varje gång källan byts, och tonar sedan ut. Teman kan göra Poppa in till sitt Visas. Tema: temat bestämmer.'
  RIPPS2_RECENTS: Visa senaste
  HINT_RIPPS2_RECENTS: Upp till så många av dina senast startade spel högst upp i Stjärnmärkta spel, nyaste först. 0 stänger av.
  RIPPS2_CATEGORY_ORDER: Kategoriordning
  HINT_RIPPS2_CATEGORY_ORDER: 'Minnesfiler först och Starta skiva sist. Gjort för RIPFLOW (Gränssnitt > Tema). Tema: temat bestämmer.'
  RIPPS2_MUSIC: Musik
  HINT_RIPPS2_MUSIC: Spelar bgm-filerna i AUDIO-mappen bredvid RIPPS2 och i OPL:s AUDIO-mapp på varje startad enhet (Ogg utan taggar, eller 16-bitars WAV); en som heter Menu spelas först. Ett temas egen musik spelas i stället.
  RIPPS2_BIOS_SOUNDS: BIOS-ljud
  HINT_RIPPS2_BIOS_SOUNDS: 'Skriver den här konsolens egna menyljud från dess BIOS till AUDIO-mappen som RIPPS2:s ljud (under 1 MB). Menymusiken är en egen rippning: BIOS-musik.'
  RIPPS2_RIP: Rippa
  RIPPS2_HINTS_GLYPHS: Tips och symboler
  HINT_RIPPS2_HINTS_GLYPHS: Hur knapptipsen och symbolerna ser ut. Varje rad börjar på Tema, det temat valde; varje annat val är ditt och går före varje tema.
  RIPPS2_HINT_LAYOUT: Tipslayout
  HINT_RIPPS2_HINT_LAYOUT: 'Rad: tipsen på en rad. Kolumn: ett tips per rad, en lista längs sidan, som börjar där temat lägger sina tips.'
  RIPPS2_HINT_LABELS: Tipsetiketter
  HINT_RIPPS2_HINT_LABELS: Endast symbol ritar bara knapparna, för symboler med egna ord. Märken lägger varje tips symbol och titel tillsammans på ett märke.
  RIPPS2_HINT_MENU: Menytips (START)
  RIPPS2_HINT_REFRESH: Uppdateringstips (SELECT)
  RIPPS2_HINT_STAR: Stjärntips (R3)
  RIPPS2_HINT_VIEW: Vytips (L3)
  HINT_RIPPS2_HINT_SHOW: Visar eller döljer det här tipset. Dess knapp fungerar i båda fallen.
  RIPPS2_GLYPH_SET: Symboluppsättning
  HINT_RIPPS2_GLYPH_SET: 'Knappsymbolerna på varje sida: temats egna, RIPPS2:s, Standard (mörka knappar, färgade tecken) eller Vit (helvit).'
  RIPPS2_HINT_ORDER: Tipsordning
  HINT_RIPPS2_HINT_ORDER: Ordnar tipsen. Tema behåller temats ordning; Din ordning är den som ställs in här.
  RIPPS2_HINT_ORDER_FOLLOW: Ordning
  RIPPS2_GRID_LAYOUT: Rutnätslayout
  HINT_RIPPS2_GRID_LAYOUT: Hur många omslag en rutnätssida rymmer, med RIPPS2:s avstånd. Tema behåller temats eget.
  RIPPS2_LAUNCH_DISC: Skiva vid start
  HINT_RIPPS2_LAUNCH_DISC: Ett spels skiva kommer in när det startar. Poppa in landar och tonar ut; Snurra snurrar allt snabbare tills spelet börjar.
  RIPPS2_TRANSITION: Sidövergång
  HINT_RIPPS2_TRANSITION: 'Hur en ny sida kommer in när du går till en annan kategori: ur temats bakgrundsfärg, eller ur en blixt. Tema behåller temats val.'
  HINT_RIPPS2_VIGNETTE: Gör kanterna på varje omslag utom det valda mörkare, så att det valda sticker ut. Svag är hälften av Full.
  RIPPS2_GRID_WIDE: Rutnätslayout för bredbild
  HINT_RIPPS2_GRID_WIDE: Rutnätets sida bara för en 16:9-bild (bredbild, 720p, 1080i), där omslagen ritas smalare och fler får plats bredvid varandra. Tema använder temats egen; Samma följer rutnätslayouten.
