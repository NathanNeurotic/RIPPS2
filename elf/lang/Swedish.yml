  HINT_COLORS_TEXT: Färgen på spellistans text. Teman anger sin egen; det här ändrar den för de inbyggda temana.
  HINT_COLORS_SELECTED: Färgen på det valda spelet och den valda raden på inställningssidor.
  HINT_COLORS_DIALOG: Färgen på inställningssidorna och meddelanderutorna.
  HINT_COLORS_TITLE: Färgen på ett spels namn på dess informationssida.
  HINT_COLORS_BACKGROUND: Färgen bakom allt när inga bilder eller torn ritas.
  HINT_COLORS_PLASMA: Färgen som den gamla OPL-plasmabakgrunden blandas mot (temat <OPL>).
  HINT_COLORS_RESET: Återställer de sex färgerna ovan till temats egna.
  HINT_COVERFLOW_COUNT: Hur många omslag RIPFLOW visar på varje sida om det valda.
  HINT_COVERFLOW_SCALE: Hur stort RIPFLOW ritar det valda omslaget jämfört med de andra.
  HINT_COVERFLOW_ANIM: Hur snabbt omslagen glider när du rör dig längs flödet.
  HINT_NARGS_QB: 'Quick Boot: hoppar över Neutrinos egen startskärm. På här skickas den för varje spel; av skickar RIPPS2 den ändå själv för USB-, iLink- och nätverksspel, där den behövs.'
