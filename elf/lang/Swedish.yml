  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLERA BIBLE PÅ DEN INTERNA HDD:N

    - RIPPS2 kopieras till %s.

    - HDD:ns startprogram som nu ligger i __mbr läses ut och sparas i %s/RIPPS2 (ÅTERSTÄLL lägger tillbaka det).

    - PS2BBL 1.2.0:s HDD-bygge skrivs på dess plats, och konsolen ställs in att starta det vid start.

    - Dess konfiguration (%s) startar RIPPS2 först från %s%s%s, BOOT LOCK på.

    Detta kräver en konsol som startar från sin HDD (en tjock PS2 med nätverksadaptern). Låt den vara på tills det står klart.'
