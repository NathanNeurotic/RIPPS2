  : 'INSTALAR O BIBLE NO DISCO RÍGIDO INTERNO

    - O RIPPS2 é copiado para %s.

    - O programa de arranque do disco rígido que está agora em __mbr é lido e guardado em %s/RIPPS2 (RESTAURAR o devolve).

    - A versão para disco rígido do PS2BBL 1.2.0 é gravada no lugar dele, e a consola é ajustado para iniciá-la ao ligar.

    - A configuração dele (%s) inicia o RIPPS2 de %s primeiro%s%s, com o BOOT LOCK ativado.

