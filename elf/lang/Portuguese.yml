  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- A consola vincula o PS2BBL 1.2.0 a este cartão e o grava como %s/%s.

    - A configuração dele, mc%d:/PS2BBL/CONFIG.INI, inicia o RIPPS2 de %s, com o BOOT LOCK ativado.

    O processador de E/S reinicia para isso; a música e as unidades voltam depois. Deixe o cartão no lugar e a consola ligado até aparecer que terminou.'
