    - その設定 mc%d:/PS2BBL/CONFIG.INI が %s から RIPPS2 を起動し、BOOT LOCK はオン。

    このため I/O プロセッサーが再起動し、音楽とドライブは後で戻ります。完了と表示されるまで、カードを挿したまま本体の電源を入れておいてください。'
  ? '- RIPPS2 is copied to %s.

