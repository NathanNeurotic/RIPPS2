  'Delete %s from %s? Goes: %s.': '%s を %s から削除しますか？消えるもの：%s。'
  'Delete %s from %s? Goes: %s. Kept: %s.': '%s を %s から削除しますか？消えるもの：%s。残るもの：%s。'
  Delete its saves and RIPSHOT pictures too? No keeps them.: セーブと RIPSHOT の写真も削除しますか？いいえで残します。
  HIDDEN GAMES: 非表示のゲーム
  'HIDDEN: %s': 非表示：%s
  Hide %s? It leaves every list, All Games and Starred Games too. Settings > Game Sources > Hidden Games shows it again.: '%s を非表示にしますか？すべてのリストから、すべてのゲームとお気に入りからも外れます。設定 > ゲームの読み込み元 > 非表示のゲーム で再表示できます。'
  Last check. %s is deleted for good, and nothing can bring it back. Press START to delete it.: 最終確認。%s は完全に削除され、元に戻せません。削除するには START を押してください。
  None. Hide Game, in a game's options, puts one here.: ありません。ゲームのオプションの「ゲームを非表示」でここに入ります。
  ? 'Nothing was deleted: this drive''s partition table does not fit this disk (%s). It may have been written from an image of a disk of another size. Repair it on a PC first.'
  : 何も削除していません：このドライブのパーティションテーブルがこのディスクに合いません（%s）。別の容量のディスクのイメージから書き込まれた可能性があります。先に PC で修復してください。
  RIPPS2 cannot delete a game from this page.: RIPPS2 はこのページからゲームを削除できません。
  RIPPS2 could not find this game's files on its drive.: RIPPS2 はこのゲームのファイルをそのドライブで見つけられませんでした。
  Reading the hidden lists: 非表示リストを読み込み中
  SHOW AGAIN OR DELETE: 再表示または削除
  SHOW IT AGAIN: 再表示する
  That game is not on its drive any more.: そのゲームはもうドライブにありません。
  The hidden list could not be written to the game's drive. Is it write-protected, or are Write Operations off?: 非表示リストをゲームのドライブに書き込めませんでした。書き込み禁止になっているか、書き込み操作がオフになっていませんか？
  The partition could not be removed (%d). Nothing was deleted.: パーティションを削除できませんでした（%d）。何も削除していません。
  This drive cannot keep a hidden list (a network catalogue).: このドライブは非表示リストを保存できません（ネットワークカタログ）。
  This game's drive has not answered yet. Wait for it, then try again.: このゲームのドライブがまだ応答していません。待ってから、もう一度お試しください。
  This game's partition is one RIPPS2 does not remove (a system partition, or the one its settings are on).: このゲームのパーティションは RIPPS2 が削除しないもの（システムパーティション、または設定のあるパーティション）です。
  'a partition is larger than this disk allows: the table was made for a disk of another size': パーティションがこのディスクの許す大きさを超えています：テーブルは別の容量のディスク用に作られています
  'a partition runs past the end of this disk (sector %u of %u): the table was made for a bigger disk': パーティションがこのディスクの終端を越えています（セクター %u / %u）：テーブルはもっと大きなディスク用に作られています
  its RIPSHOT pictures: RIPSHOT の写真
  its drive: そのドライブ
  its saves: セーブ
  sector %u holds no partition header: セクター %u にパーティションヘッダーがありません
  the chain does not close at __mbr: チェーンが __mbr で閉じていません
  the chain skips from sector %u: チェーンがセクター %u から飛んでいます
  the chain's links disagree at sector %u: チェーンのリンクがセクター %u で食い違っています
  the drive's size could not be read: ドライブの容量を読み取れませんでした
  the game (%s): ゲーム本体（%s）
  the game's folder and everything in it (%s): ゲームのフォルダーとその中身すべて（%s）
  the header at sector %u could not be read: セクター %u のヘッダーを読み取れませんでした
  the header at sector %u fails its checksum: セクター %u のヘッダーがチェックサムに合いません
  the partition at sector %u is not where or as large as APA puts one: セクター %u のパーティションが、APA が置く位置や大きさと違います
  the settings and art another copy of it uses: 別のコピーが使っている設定とアート
  '%d FOLDERS': '%d 個のフォルダー'
  '%s could not be copied to %s. Is the drive full or write-protected?': '%s を %s にコピーできませんでした。ドライブがいっぱいか、書き込み禁止になっていませんか？'
  ? '%s is not where RIPPS2 looks. Search the drives RIPPS2 has started for it? Where it is found is remembered for every launch after.'
  : '%s が RIPPS2 の探す場所にありません。RIPPS2 が開始したドライブで探しますか？見つかった場所は以後の起動のたびに使われます。'
  ? 'Ember is not in %s, beside the games, and it has to be. RIPPS2 found it at %s: START copies it there (%d KB) and starts the game.'
  : Ember がゲームの隣の %s にありませんが、そこに必要です。RIPPS2 が %s で見つけました。START でそこへコピーし（%d KB）、ゲームを起動します。
  Ember's BIOS: Ember の BIOS
  ? 'Ember''s BIOS (bios.bin) is not in %s, beside Ember. RIPPS2 found one at %s: START copies it there (%d KB) and starts the game.'
  : Ember の BIOS（bios.bin）が Ember の隣の %s にありません。RIPPS2 が %s で見つけました。START でそこへコピーし（%d KB）、ゲームを起動します。
  LOOKING FOR YOUR LAUNCHERS: ランチャーを探しています
  The POPS files: POPS ファイル
  '%s  MMCE card': '%s  MMCE カード'
  INSTALL RIPPS2'S NEUTRINO: RIPPS2 の NEUTRINO をインストール
  'Internal HDD (APA): %s free of %s': 内蔵 HDD（APA）：空き %s / %s
  LAUNCHERS: ランチャー
  LOOK FOR THEM: 探す
  'Memory card %d: %d KB free': メモリーカード %d：空き %d KB
  POPS files: POPS ファイル
  START EVERY DRIVE: すべてのドライブを開始
  'STATUS: looking at the drives and the homebrew': ステータス：ドライブと homebrew を確認中
  Start every drive first, so the search reaches all of them? (No searches the drives already started.): 検索がすべてに届くよう、先にすべてのドライブを開始しますか？（いいえで開始済みのドライブを検索します。）
  USB, HDD, MMCE and the rest: USB、HDD、MMCE ほか
  every started drive: 開始済みのすべてのドライブ
  found where you keep them: 置いてある場所で見つかりました
  not found yet: まだ見つかっていません
  not on a started drive: 開始済みのドライブにありません
  only if you have none: 持っていない場合のみ
  starts every drive first: 先にすべてのドライブを開始します
  Drives, launchers and homebrew: ドライブ、ランチャー、自作ソフト
labels:
  IP_ADDRESS_TYPE_STATIC: 固定
  HINT_NEUTRINO_AUTO_ELF: ゲームの起動 ELF を Neutrino に渡し、タイトルごとの設定を探させます。既定でオン。手動で設定した Boot ELF オプションが優先されます。
  HINT_POPSTARTER_PATH: POPSTARTER.ELF の場所。空欄なら RIPPS2 がドライブ上で見つけたものを入れます。別のものを使うには上書きしてください（例：usb:/POPS/POPSTARTER.ELF）
  NEUTRINO_ARGS_TOO_LONG: Neutrino の引数が保存できる長さを超えています。保存する前にいずれかの欄を短くしてください。
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Neutrino の起動引数が安全な上限を超えています。グローバルまたはゲームの引数を短くしてください。
  NEUTRINO_AUTO_ELF: Boot ELF を自動（-elf）
  HINT_NEUTRINO_PATH: neutrino.elf はどこにありますか？<未設定> = ゲームのデバイス -> mc0/mc1。指定したフルパスが最初に試されます。例：mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf
  GAME_VIEW_MODE: PS2/PS1 ゲームの表示
  HINT_GAME_VIEW_MODE: 「すべて」は PS2 と PS1 のゲームを一緒に並べ、L3 で すべて、PS1、PS2 を切り替えます。PS2 か PS1 ではその種類だけを表示し、L3 は無効になります。APPS とお気に入りゲームには独自の表示ルールがあります。
  VIEW_MIXED: PS2 + PS1 ゲームを表示中
  VIEW_PS1_ELF: PS1 ELF アプリを表示中
  APPS_DISPLAY: アプリケーションの表示
  HINT_APPS_DISPLAY: 「すべて」はすべての ELF を 1 つの APPS リストに並べ、L3 は無効です。「アプリ / PS1ELF」は [PS1] を含むタイトルを L3 の 2 ページ目に分けます。起動のしかたは変わりません。
  VIEW: 表示
  VIEW_PS2: お気に入りの PS2 ゲームを表示中
  VIEW_PS1: お気に入りの PS1 ゲームを表示中
  VIEW_ELF: お気に入りの ELF を表示中
  VIEW_ALL: お気に入りのゲームをすべて表示中
  VMC_FRAGMENTED_ON_CREATE: VMC を作成しましたが、断片化しています。メモリーカードのエミュレーションには途切れのない 1 つのファイルが必要なため、起動時にこの VMC は使われず、実際のカードが使われます。空きを作ってから作り直すか、別のデバイスからコピーしてください。
  KEYB_MOVE_CURSOR: カーソル移動
  TITLECOLOR: ゲームタイトルの色
  RA_CHECK_GAME: RetroAchievements の対応を確認
  RA_TEST_LINK: RetroAchievements の PC 接続をテスト
  RA_CHECKING_IMAGE: イメージを確認しています。数秒かかります...
  RA_CHECK_RUNNING: イメージの確認が既に実行中です
  RA_LOOKING_FOR_PC: PC クライアントを探しています...
  RA_UL_UNSUPPORTED: UL/USBExtreme のゲームはまだ確認できません
  RA_UL_UNSUPPORTED2: 対応しているのは DVD/ または CD/ にある通常の .iso イメージだけです
  RA_UNKNOWN_IMAGE: RetroAchievements はこのイメージを知りません
  RA_STILL_IDENTIFYING: PC がまだイメージを識別しています
  RA_TRY_AGAIN: 数秒後にもう一度お試しください
  RA_NO_SOCKET: 本体がネットワークソケットを開けませんでした
  RA_NO_SOCKET2: 本体を再起動するか、設定で ETH デバイスを確認してください
  RA_TEST_NO_SOCKET2: ケーブルと設定の ETH を確認してください。ネットワークが動いているなら本体を再起動してください
  RA_PC_NO_ANSWER: PC クライアントが応答しませんでした
  RA_PC_NO_ANSWER2: xeRAbora が動いているか確認するか、PC 接続テストを試してください
  RA_SUPPORTED: RetroAchievements 対応
  RA_START_TO_TRACK: 実績を追跡するにはゲームを起動してください
  RA_ACHIEVEMENTS: 実績 %d 個
  RA_ACHIEVEMENTS_FULL: 実績 %d 個 -- 解除済み %d、非対応 %d
  RA_HASH_FAILED: イメージのハッシュを計算できませんでした
  RA_HASH_FAILED2: 理由はゲームの隣の RA/hashes.txt を見てください
  RA_NET_BUSY: ネットワークは UDP 転送で使用中です
  RA_NET_BUSY2: RA には SMB スタックが必要です -- プロトコルを切り替えるか、PC で .wl を作成してください
  RA_NET_BUSY_HASH: ハッシュは RA/hashes.txt にあります -- xeRAbora はそこから .wl を作成できます
  RA_NO_IP: 本体に IP アドレスがありません
  RA_NO_IP2: ネットワーク設定の DHCP か固定アドレスを確認してください
  RA_TEST_NO_ANSWER: 3 秒以内に応答した PC クライアントはありません
  RA_TEST_NO_ANSWER2: 本体%s。xeRAbora が動いていて UDP 18194 が開いているか確認してください
  RA_TEST_FOUND: PC クライアントが見つかりました%s%s %s
  RA_TEST_FOUND2: '%u ms で応答、本体%s'
  RA_NA_NEUTRINO: RA の追跡には <OPL> コアが必要です -- Neutrino での起動では ee_core を読み込みません
  RA_NA_UDPFS: UDPFS では RA の追跡は使えません -- ゲームは Neutrino で起動します
  RA_NA_PS1: PS1 ゲームでは RA の追跡は使えません
  RA_NA_HDD: APA のゲーム情報または HDD の設定の保存先が使えません
  RA_NA_HDD2: 有効な HDD の設定の保存先を設定し、更新してから対応を確認してください
  RA_TELEMETRY: RetroAchievements テレメトリー
  RA_BADGES: RetroAchievements バッジ
  HTTP_GAMES: HTTP ゲーム
  HTTP_SERVER: HTTP サーバー
  HTTP_PORT: HTTP ポート
  HTTP_BASE_PATH: HTTP ベースパス
  HTTP_TEST: HTTP サーバーをテスト
  HTTP_TEST_OK: サーバー OK -- ゲームを一覧表示しました
  HTTP_TEST_EMPTY: カタログが空です -- 有効ですが、バイト範囲については何も確かめられません
  HTTP_TEST_NO_ISO: カタログにはバイト範囲をテストできる対応イメージがありません
  HTTP_ERR_CONNECT: HTTP サーバーに接続できません
  HTTP_ERR_CATALOG: games.csv がないか、読めないか、大きすぎます
  HTTP_ERR_RANGE: サーバーが要求したとおりのバイトを返しませんでした
  HTTP_LAUNCH_UNAVAILABLE: HTTP からの起動はまだ実装されていません -- カタログの閲覧のみです
  HTTP_ERR_COMPRESSED: 圧縮イメージ（.zso）は HTTP ではまだ対応していません
  HTTP_NO_VMC: HTTP では仮想メモリーカードは使えません -- 実際のカードを使ってください
  HTTP_TAB_HINT: HTTP はサーバーから games.csv を読みます。ネットワーク設定でアドレス、ポート、ベースパスを設定してから「テスト」を使ってください。
  RA_DISC_CHECK: RA：ディスクの対応を確認
  RA_DISC_LAUNCH: RA：ディスクを起動
  RA_DISC_CHECKING: RetroAchievements 用にディスクを確認しています
  RA_DISC_HASH_FAILED: ディスクのハッシュを計算できませんでした -- 設定フォルダの RA/hashes.txt を確認してください
  RA_DISC_HOME_ERROR: この設定のパスはディスクの追跡リストに使えません
  RA_DISC_ENABLE: まずネットワーク設定で RetroAchievements テレメトリーをオンにしてください
  RA_DISC_CHECK_FIRST: このディスクの追跡リストがありません -- まず「RA：ディスクの対応を確認」を使ってください
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d：HDD は見つかりましたが、APA パーティションテーブルを読めません。フォーマットしないでください -- ゲームを取り戻せるかもしれません。'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d：セクターが 512 バイトではないドライブ（4K セクターのドライブなど）をマウントしませんでした。OPL は 512 バイトのセクターしか読めません。'
  HDD_PARTITION_RENAME_UNSUPPORTED: このタイトルはそれ自体が APA パーティションで、OPL はパーティションテーブルを編集しません。PC で名前を変更してください。
  POPS_SETTINGS_UNREADABLE: POPSTARTER の設定を読めませんでした -- メモリーカードが使用中か読めません。読み込みが終わってからもう一度お試しください。
  GLOBAL_PS_EMULATION_SETTINGS: グローバル PS エミュレーション設定
  RA_NO_LINK_UNTRACKED: ネットワークが使えません -- 今回は RetroAchievements なしで起動します。
  IGR_USB_DRIVERS_PROMPT: IGR パスは USB 上にありますが、%s には USBD.IRX と USBHDFSD.IRX がありません。本体はインゲームリセットの後に USB に届くためにこれらが必要です。ないと IGR は PS2 ブラウザーに戻ります。今 RiptOPL のドライバーをそこへコピーしますか？FMCB、OpenTuna などのエクスプロイトもこれらのファイルを読み込み、動作が変わることがあります。既存のファイルは置き換えません。FAT32 の USB のみ。
  IGR_USB_DRIVERS_FAILED: USB ドライバーを %s にコピーできませんでした（カードがいっぱいか書き込めません）。IGR は PS2 ブラウザーに戻ります。
  OFFICIAL_CFG_NOTIFICATION: OPL 公式の設定を %s から読み込みました
  CFM_VMODE_HOLD_KEEP: 押し続けて維持
  BDM_PS2_FOLDERS_UNREADABLE: '%s の CD または DVD フォルダを開けなかったため（エラー %d）、そのデバイスには PS2 ゲームが表示されません。そのページで SELECT を押してもう一度試してください。'
  NEUTRINO_BD_NO_DEVICE_NUMBER: Neutrino のファイルシステムが bd に設定されていますが、このデバイスはデバイス番号を報告しなかったため、Neutrino をそこへ向けられません。このゲームの Neutrino ファイルシステムを Auto か exfat にしてください。
  CFM_VMODE_REVERT_IN: '%d 秒後に元に戻します'
  EMBER_DITHER: Ember ディザリング
  HINT_EMBER_DITHER: Ember のディザリング（オンまたはオフ）。起動するデバイスの EMBER/settings.txt に書き込みます。ゲームごとの値がこれより優先されます。
  EMBER_SHADING: Ember シェーディング
  HINT_EMBER_SHADING: Ember の色深度：15 ビット、または 24 ビット（実験的）。起動するデバイスの EMBER/settings.txt に書き込みます。ゲームごとの値がこれより優先されます。
  EMBER_CONTROLLER: Ember コントローラー
  HINT_EMBER_CONTROLLER: Ember のコントローラーモード：自動、アナログ、D2A。ゲームごとの設定（三角 > Ember ゲーム設定）が優先されるので、通常はそちらで設定するのが最適です。
  EMBER_480P_CONFIRM: Ember の 480p はコンポジットでは映りません。480p を使いますか？
  EMBER_SHADING_24: 24 ビット（実験的）
  EMBER_GAME_SETTINGS: Ember ゲーム設定
  HINT_EMBER_GAME_SETTING: このゲームのみ。OK を押すと起動前に EMBER/games/<名前>/settings.txt に書き込みます。触っていない「既定」はファイルの既存の値を残し、値を「既定」に戻すとその上書きを取り除きます。
  EMBER_TIMING: Ember タイミング
  HINT_EMBER_TIMING: Ember の映像タイミング：自動はディスクのリージョンに従い、NTSC は 60 Hz、PAL は 50 Hz に固定します。起動するデバイスの EMBER/settings.txt に書き込みます。
  EMBER_GLOBAL_WARNING: これらの Ember 設定はすべての PS1 ゲームに適用され、一部のゲームはこれで落ちます。1 本のゲームだけを変えるには、そのゲームで 三角 > Ember ゲーム設定 を使ってください。
  RIPPS2_RANDOM: ランダム
  RIPPS2_ALL: すべて
  RIPPS2_RANDOM_GAME: ランダムなゲーム
  HINT_RIPPS2_RANDOM_GAME: L2 と R2 を同時に押すとランダムなゲームに飛びます。「起動時」では各リストもランダムなゲームで開きます。
  RIPPS2_ALL_GAMES: すべてのゲーム
  RIPPS2_SET_METADATA: メタデータを設定
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 電源投入時に PS2BBL を通じて RIPPS2 を起動します。オフにすると PS2BBL が以前に起動していたものに戻します。PS2BBL がまだない？「ブートローダー」で BIBLE をインストールできます。
  HINT_COLORS_TEXT: ゲームリストの文字の色。テーマは独自の色を持っています。これは内蔵テーマの色を変えます。
  HINT_COLORS_SELECTED: 選んだゲームと、設定ページで選んだ行の色。
  HINT_COLORS_DIALOG: 設定ページとメッセージボックスの色。
  HINT_COLORS_TITLE: 情報ページでのゲーム名の色。
  HINT_COLORS_BACKGROUND: アートやタワーを描いていないときの一番奥の色。
  HINT_COLORS_PLASMA: 旧 OPL のプラズマ背景が混ざっていく色（<OPL> テーマ）。
  HINT_COLORS_RESET: 上の 6 色をテーマ自身の色に戻します。
  HINT_COVERFLOW_COUNT: RIPFLOW が選んだカバーの両側にそれぞれ何枚のカバーを表示するか。
  HINT_COVERFLOW_SCALE: RIPFLOW が選んだカバーをほかと比べてどれだけ大きく描くか。
  HINT_COVERFLOW_ANIM: フローの中を移動するときにカバーが滑る速さ。
  HINT_NARGS_QB: Quick Boot：Neutrino 自身の起動画面を飛ばします。ここでオンにするとすべてのゲームに送ります。オフでも、必要な USB、iLink、ネットワークのゲームには RIPPS2 が自動で送ります。
  HINT_NARGS_DBC: デバッグカラー：Neutrino が読み込みの各段階で画面を 1 色で塗るので、写真を撮ればゲームがどこで止まったか分かります。
  HINT_NARGS_LOGO: ゲームの前に PS2 ロゴを表示します（IOP の 2 回目の再起動で、一部の iLink ドライブに必要）。ここでオフなら RIPPS2 は ゲームの起動 > PS2 ロゴ に従い、MMCE やネットワークのゲームには送りません。
  HINT_NARGS_CWD: ゲームが自分のものとみなすフォルダ。空欄：Neutrino の既定値。
  HINT_NARGS_CFG: 自分用の Neutrino 設定ファイル（-cfg）。空欄：Neutrino のもの。
  HINT_NARGS_ELF: ディスクが指定する起動ファイルの代わりにこの ELF を起動します。空欄：ゲーム自身のもの。
  HINT_NARGS_ATA0: Neutrino が本体の内蔵 HDD としてマウントする HDD イメージ。HDD を使うゲーム用（-ata0）。
  HINT_NARGS_ATA0ID: その HDD イメージに対応する ID ファイル（-ata0id）。
  HINT_NARGS_ATA1: 2 つ目の HDD イメージ（-ata1）。
  RIPPS2_LAST_USED: 前回使用
  RIPPS2_PAGE_BUTTONS: ページボタン
  HINT_RIPPS2_PAGE_BUTTONS: どのショルダーボタンでゲームリストのページを送るか。L2 / R2：ページを送り、L1 / R1 でカテゴリーを切り替え。L1 / R1：ページを送り、L2 / R2 でカテゴリーを切り替え。テーマ：テーマが決め、テーマがなければ L2 で先頭、R2 で末尾へ。L2 + R2 を同時に押すと常にランダムなゲームを選びます。
  RIPPS2_IGR_MENU: ゲーム内メニュー
  HINT_RIPPS2_IGR_MENU: オン：L1+L2+R1+R2+SELECT+START でゲームを一時停止：再開、終了、スクリーンショット、実績の確認、電源オフ。オフ：コンボで以前どおりすぐにゲームを終了します。
  RIPPS2_BOOT_LOADER: ブートローダー
  HINT_RIPPS2_BOOT_LOADER: 各メモリーカードが電源投入時に何を起動するかを表示し、BIBLE（RIPPS2 用に設定した PS2BBL）をインストールします。カードの元の起動ファイルは保存されます。
  RIPPS2_MANAGE: 管理
  RIPPS2_ACHIEVEMENTS: 実績
  RIPPS2_NBD_SERVER: NBD サーバー
  HINT_RIPPS2_NBD_SERVER: ネットワーク越しに HDD を PC と共有します。動作中はステータス画面が表示されたままになります。
  RIPPS2_START: 開始
  RIPPS2_COVER_ART: カバーアート
  HINT_RIPPS2_COVER_ART: 開始済みのリストにあるカバーのない PS2 ゲームすべてに、GitHub 上の xlenore の ps2-covers からカバーをダウンロードし、そのドライブの ART フォルダに入れます。ネットワークケーブルとインターネットが必要です。
  RIPPS2_DOWNLOAD: ダウンロード
  RIPPS2_GLYPHS: 十字キーのグリフ
  HINT_RIPPS2_GLYPHS: ドライブ名とフォーメーション名の横の十字キーのグリフ。フェードインは切り替え時に、フェードアウトはページを開くときに表示します。テーマ：テーマが決めます。
  RIPPS2_COLOR_THEME: カラーテーマ
  HINT_RIPPS2_COLOR_THEME: タワー、オーブ、ガラス、CD プレーヤー、ファイルブラウザーを 3 つのタブすべてで 1 色にします。テーマ：テーマが決めます（決めない場合は RIPPS2 ブルー）。
  RIPPS2_HINTS: ボタンヒント
  HINT_RIPPS2_HINTS: 下に並ぶボタンヒント。「操作がないときフェード」はボタンを押すまで隠します。テーマ：テーマが決めます。
  RIPPS2_CATEGORY_BAR: カテゴリーバー
  HINT_RIPPS2_CATEGORY_BAR: 上に並ぶ ディスク起動、ストレージ、メモリーファイル。「操作がないときフェード」はボタンを押すまで隠します。テーマ：テーマが決めます。
  RIPPS2_SOURCE_NAME: ソース名
  RIPPS2_STATUS: ステータス
  RIPPS2_SOURCE: ソース
  HINT_RIPPS2_SOURCE_NAME: ゲームの上のソース名（すべてのゲーム、HDD ゲームなど）。「操作がないときフェード」はカテゴリーバーと一緒に消します。「ポップイン」は代わりに、L3 がリスト名を出すように、起動後最初のリストとソースが変わるたびにページ中央に大きく出してからフェードします。テーマは「ポップイン」を自分の「表示」にできます。テーマ：テーマが決めます。
  RIPPS2_RECENTS: 最近のゲームを表示
  HINT_RIPPS2_RECENTS: 最近起動したゲームを最大この数だけ、新しい順にお気に入りゲームの先頭に表示します。0 でオフ。
  RIPPS2_CATEGORY_ORDER: カテゴリーの順番
  HINT_RIPPS2_CATEGORY_ORDER: メモリーファイルを先頭に、ディスク起動を最後に。RIPFLOW 用です（インターフェース > テーマ）。テーマ：テーマが決めます。
  RIPPS2_MUSIC: 音楽
  HINT_RIPPS2_MUSIC: RIPPS2 の隣の AUDIO フォルダと、開始した各ドライブの OPL の AUDIO フォルダにある bgm ファイル（タグなしの Ogg か 16 ビット WAV）を再生します。Menu という名前のものが最初に流れます。テーマ自身の音楽があればそちらが流れます。
  RIPPS2_BIOS_SOUNDS: BIOS サウンド
  HINT_RIPPS2_BIOS_SOUNDS: この本体の BIOS からメニューのサウンドを RIPPS2 のサウンドとして AUDIO フォルダに書き込みます（1 MB 未満）。メニュー音楽は別の抽出です：BIOS 音楽。
  RIPPS2_RIP: 抽出
  RIPPS2_HINTS_GLYPHS: ヒントとグリフ
  HINT_RIPPS2_HINTS_GLYPHS: ボタンヒントとグリフの見た目。どの行も最初は「テーマ」、つまりテーマが選んだものです。ほかの選択はあなたのもので、どのテーマよりも優先されます。
  RIPPS2_HINT_LAYOUT: ヒントのレイアウト
  HINT_RIPPS2_STARSIDE: お気に入りゲームの星を一覧のどこに出すか。左：各行の先頭に専用の列。右：タイトルのあと。非表示：星なし。テーマ：テーマのとおり。テーマの行アイコンは反対の端に移るので、重なりません。
  HINT_RIPPS2_HINT_LAYOUT: 横並び：ヒントを 1 行に。縦列：1 行に 1 つのヒントを、テーマがヒントを置く位置から横にリストとして並べます。
  RIPPS2_HINT_LABELS: ヒントのラベル
  HINT_RIPPS2_HINT_LABELS: 「グリフのみ」はボタンだけを描きます。文字入りのグリフ向けです。「バッジ」は各ヒントのグリフと名前を 1 つのバッジにまとめます。
  RIPPS2_HINT_MENU: メニューのヒント（START）
  RIPPS2_HINT_REFRESH: 更新のヒント（SELECT）
  RIPPS2_HINT_STAR: お気に入りのヒント（R3）
  RIPPS2_HINT_VIEW: 表示のヒント（L3）
  HINT_RIPPS2_HINT_SHOW: このヒントを表示または非表示にします。ボタンはどちらでも使えます。
  RIPPS2_GLYPH_SET: グリフセット
  HINT_RIPPS2_GLYPH_SET: すべてのページのボタングリフ：テーマ自身のもの、RIPPS2 のもの、スタンダード（暗いボタンに色付きの記号）、ホワイト（真っ白）。
  RIPPS2_HINT_ORDER: ヒントの順番
  HINT_RIPPS2_HINT_ORDER: ヒントを並べ替えます。「テーマ」はテーマの順番、「自分の順番」はここで設定した順番です。
  RIPPS2_HINT_ORDER_FOLLOW: 順番
  RIPPS2_GRID_LAYOUT: グリッドレイアウト
  HINT_RIPPS2_GRID_LAYOUT: グリッドの 1 ページに入るカバーの数を、RIPPS2 の間隔で。「テーマ」はテーマ自身のものを使います。
  RIPPS2_LAUNCH_DISC: 起動時のディスク
  HINT_RIPPS2_LAUNCH_DISC: ゲームの起動時にディスクが現れます。「ポップイン」は落ち着いてからフェードし、「スピン」はゲームが始まるまでどんどん速く回ります。
  RIPPS2_TRANSITION: ページの切り替え
  HINT_RIPPS2_TRANSITION: 別のカテゴリーに移るときに新しいページがどう現れるか：テーマの背景色から、またはフラッシュから。「テーマ」はテーマの選択を使います。
  RIPPS2_CATEGORY_LAYOUT: カテゴリーの配置
  HINT_RIPPS2_CATEGORY_LAYOUT: 3 つのカテゴリーの置き場所：名前を上に並べるか、サイドバーにアイコンを縦に並べ、それぞれのページを引き出しで表示します（リストで左を押すとそこへ移動）。「テーマ」はテーマ自身のものを使います。
  RIPPS2_CACHE: キャッシュ
  HINT_RIPPS2_CACHE: 各ソースのゲームリストを保存してページをすぐ開く方法：Fast Cache、内蔵 HDD のリスト、自動更新。
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 各ソースは最後のゲームリスト（CD と DVD フォルダーの横の RIPPS2.LST）を保存し、ソースが応答した瞬間に表示してから、バックグラウンドでソースを読み直します。オフにすると、以前のように各リストをまずソースから読み込みます。
  HINT_RIPPS2_VIGNETTE: 選んだカバー以外のすべてのカバーの縁を暗くして、選んだカバーを目立たせます。「弱」は「最大」の半分です。
  RIPPS2_GRID_WIDE: ワイドスクリーンのグリッドレイアウト
  HINT_RIPPS2_GRID_WIDE: 16:9 の画面（ワイドスクリーン、720p、1080i）でだけ使うグリッドのページ。カバーが細くなり、横により多く並びます。「テーマ」はテーマ自身のもの、「同じ」はグリッドレイアウトに従います。
  RIPPS2_BGBLUR: 背景のぼかし
  HINT_RIPPS2_BGBLUR: すりガラスがゲームの背景アートをどれだけぼかすか。「テーマ」はテーマ自身のもの（RIPGRID と Adapt では「弱」）。
  HINT_RIPPS2_HINT_SLOT: この位置のヒント。ここにあったヒントは、選んだヒントの元の位置に移ります。
  PS1_SAVE_GUIDANCE: PS1 のセーブデータは Ember か POPSTARTER しだいです。PS2 の VMC 設定は適用されません。
  NEUTRINO_SHOW_ARGS: 起動引数を表示
  HINT_NEUTRINO_SHOW_ARGS: Neutrino で起動するたびに、Neutrino が受け取る引数をすべて表示して続けるか確認します。戻るで起動せずにメニューに戻ります。
  NEUTRINO_ARGS_CONFIRM: Neutrino はこの引数で起動します。起動しますか？
  HINT_NARGS_EXTRA: そのほかの Neutrino フラグをスペース区切りで。上のすべての後に送ります。RIPPS2 は常に、ゲームのドライブと ISO に -bsd と -dvd、VMC に -mc0 と -mc1、映像モードに -gsm、そしてゲーム自身の互換モードを付けます。上に専用の行があるフラグ（-logo など）は保存時にその行に移り、送られるのは変わりません。
  HINT_RIPPS2_THEME: すべてのページの見た目。ゲームリストで SELECT を 4.2 秒押し続けると次のテーマに切り替わります。SELECT を短く押せば今までどおりリストを更新します。
  GAME_TYPE_LABELS: '[PS1]/[PS2] ラベルを表示'
  NEUTRINO_CHEATS_WRITE_FAILED: チートのリストを Neutrino フォルダに保存できなかったため、Neutrino は使えません。チートなしで起動しますか？
  AUTO_CREATE_VMC: 初回起動時に VMC を作成
  HINT_AUTO_CREATE_VMC: スロット 1 に VMC がない PS2 ゲームを起動すると、ゲームのデバイスに 8 MB のカードを作り、VMC 画面が提案する名前（そのゲームのすべてのディスクで共有）を付けて割り当てます。Neutrino での内蔵 HDD には使えません。
  AUTO_VMC_CREATING: このゲームの VMC を作成しています...
  AUTO_VMC_FAILED: このゲームの VMC を作成できませんでした。ゲームは VMC なしで起動します。
  RIPPS2_BIOS_MUSIC: BIOS 音楽
  HINT_RIPPS2_BIOS_MUSIC: この本体のメニュー音楽（ブラウザーの環境曲、WAV で約 15 MB）を、選んだ AUDIO フォルダ（RIPPS2 の隣、または開始したドライブの OPL のもの）に書き込みます。メモリーカードには大きすぎます。先にサイズを表示します。
  SAVE_ICONS: 3D セーブアイコン
  HINT_SAVE_ICONS: テーマに場所があれば、選んだゲームのセーブアイコンを回転させて表示します。まずゲーム自身の VMC を、次にメモリーカードを読みます。
  NETBOOT_RESTART_NOW: ネットワークプロトコルは再起動後に変わります。今設定を保存して OPL を再起動しますか？
  HINT_NET_PROTOCOL: RiptOPL が使うネットワークサービス：SMB 共有、UDPFS、UDPBD、HTTP。ゲームソースの設定と同じです。動作中のものから切り替えるには再起動が必要です。
  HINT_UDPFS_ACCESS: UDPFS のみ。「ファイル」はサーバーのゲームフォルダから個別の ISO を読み、IMG はディスクイメージをドライブとして読みます。SMB と HTTP は常に「ファイル」、UDPBD は常に IMG です。
  HINT_SMB_VERSION: PC の共有と話す SMB のバージョン。
  HINT_NET_ADVANCED: イーサネットのリンクモードと SMB ポートを編集できるようにします。
  HINT_ETH_LINK_MODE: ネットワークのリンク速度とデュプレックスを固定します。リンクが切れ続けるのでなければ自動のままにしてください。
  HINT_IP_ADDR_TYPE: 固定は下のアドレスを使い、DHCP はルーターに尋ねます。UDPFS と UDPBD は常に固定です。
  HINT_PS2_IP: PS2 自身の IP アドレス。PC と同じ範囲で、ほかの機器が使っていないものを選んでください。
  HINT_NETMASK: サブネットマスク。通常は 255.255.255.0。
  HINT_GATEWAY: ルーターのアドレス。通常は最初の 3 つの数字が同じで、.1 で終わります。
  HINT_DNS: DNS サーバーのアドレス。通常はゲートウェイと同じです。
  HINT_SMB_ADDR_TYPE: PC に IP アドレスで接続するか、NetBIOS（コンピューター）名で接続するか。
  HINT_SMB_ADDRESS: ゲームを共有している PC：その IP アドレス、またはアドレスの種類が NetBIOS ならコンピューター名。
  HINT_SMB_PORT: SMB ポート。PC と一致させる必要があります：PS2 Servers は 1111、Windows と Samba の共有は 445 を使います。
  HINT_SMB_USER: SMB のユーザー名。ほとんどの共有では guest で動きます。
  HINT_HTTP_SERVER: HTTP ゲームサーバーの IP アドレス。
  HINT_HTTP_PORT: HTTP ゲームサーバーが待ち受けるポート。
  HINT_HTTP_BASE: HTTP サーバー上で games.csv を置いているフォルダ。/ はサーバーのルートです。
  HINT_HTTP_TEST: 上の値で HTTP サーバーを試し、結果を報告します。
  HINT_RA_TELEMETRY: RetroAchievements のメインスイッチ。オフではネットワークスタックもスナップショットもなしでゲームを起動し、通常のビルドと同じです。
  HINT_RA_BADGES: リストで実績のあるゲームに印を付けます。テレメトリーがオフの間は暗いままです。
  HINT_POPS_NET_BUTTON: SMB での PS1 ゲームに必要な、POPSTARTER 自身のネットワークファイル（IPCONFIG.DAT、SMBCONFIG.DAT）を編集します。
  HINT_POPS_IP_TYPE: PS1 ゲームを SMB で動かす間に PS2 がアドレスを得る方法：固定か DHCP。
  HINT_POPS_IP: PS1 ゲームを SMB で動かす間の PS2 の IP アドレス。
  HINT_POPS_SMB_IP: PS1 ゲームを共有している PC の IP アドレス。
  HINT_POPS_SMB_SHARE: その PC で POPS フォルダを置いている共有の名前。
  HINT_LASTPLAYED: 前回起動したゲームから始めます。
  HINT_LANGUAGE: メニューの言語。lang_*.lng ファイルを LNG フォルダに入れると増やせます。
  HINT_GSM_DEFAULTS_BUTTON: 独自の GSM 設定がない限りすべてのゲームに適用される映像モードの修正。
  HINT_DEFDEVICE: 起動時に RiptOPL が開くページ。
  HINT_MMCE_MODE: SD2PSX や MemCard PRO2 上のゲーム。自動は起動時に、手動はページを開いたときに開始し、オフでは非表示にします。
  HINT_MMCE_SETTINGS_BUTTON: MMCE のスロット、IGR bootcard、GameID、タイミングのオプション。
  HINT_ENABLE_USB: USB ストレージのドライバーを読み込みます。
  HINT_ENABLE_MX4SIO: MX4SIO SD カードアダプターのドライバーを読み込みます。
  HINT_ENABLE_ILINK: iLink（FireWire）ストレージのドライバーを読み込みます。
  HINT_NETSTART: ネットワークを開始します：自動は起動時、手動はそのページを開いたとき。オフではネットワークアダプターに触れません。
  HINT_APPMODE: アプリのページ。自動は起動時に、手動は開いたときに開始し、オフでは非表示にします。
  HINT_FAVMODE: お気に入りゲームのページ。自動は起動時に、手動は開いたときに開始し、オフでは非表示にします。
  HINT_BDMA_BUTTON: USB、MX4SIO、MMCE、HDD、iLink 上の PS1 ゲームに POPSTARTER が使う exFAT ドライバー。
  HINT_VCD_LIST_BUTTON: PS1 ゲームの並べ方：ゲーム ID を隠す、ディスク 1 だけを表示、HDD の PP パーティションを表示。
  HINT_MMCE_SLOT: MMCE デバイスが挿さっているメモリーカードスロット。自動で見つけます。
  HINT_MMCE_GAMEID: 起動するゲームを MMCE デバイスに伝え、そのゲームのメモリーカードに切り替えられるようにします。
  HINT_MMCE_COMM_BUTTON: MMCE 接続のタイミングのオプション。ゲームが固まるか読み込みが遅いときだけ変えてください。
  HINT_MMCE_PATH_BUTTON: MMCE カード上のゲームフォルダの場所。
  HINT_MMCE_PREFIX: MMCE カード上で CD、DVD、そのほかの OPL フォルダを置いているサブフォルダ。空欄ならカードのルートを使います。
  HINT_GAME_TYPE_LABELS: 各ゲーム名の先頭に [PS1] か [PS2] を付けます。表示のみ。
  HINT_MENU_VMODE: メニューの映像出力。ゲームは代わりに GSM を使います。新しいモードを維持するには決定を押し続けてください。
  HINT_THEME: メニューの見た目。テーマは各デバイスの THM フォルダから読み込みます。
  HINT_COVERFLOW_BUTTON: Coverflow テーマのカバーの数、大きさ、アニメーション、暗さ。
  HINT_ARTWORK_BUTTON: 読み込むアート：カバー、ディスクアート、背景、セーブアイコン。
  HINT_COLORS_BUTTON: 文字、ハイライト、ダイアログ、背景の色。
  HINT_NOTIFICATIONS: 設定、テーマ、言語ファイルを読み込んだときの短いお知らせ。
  HINT_AUTOSORT: ゲームリストを A から Z に並べます。オフでは見つかった順のままです。
  HINT_AUTOREFRESH: 手動で更新しなくても、新しくつないだデバイスのゲームを加えます。
  HINT_COVERART: ART フォルダからカバーアートを読み込みます。
  HINT_DISCART: ディスクアート（<ID>_ICO）を表示します。オフではディスクを隠し、カバーと背景は残します。
  HINT_BGART: テーマが背景を使う場合、ゲームの背景（<ID>_BG）を表示します。
  HINT_ART_TAR: ART/art.tar にまとめたアートも読み込みます。
  HINT_ART_DELAY: カーソルがゲームに止まってからアートを読み込むまでの時間。長いほど、速くスクロールしたときにアートを飛ばします。
  HINT_TXTCOLOR: 通常のメニュー文字の色。
