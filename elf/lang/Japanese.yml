  BIBLE could not be written to memory card %d, so the card was put back as it was. Check its free space, then try again.: BIBLE をメモリーカード %d に書き込めなかったため、カードを元の状態に戻しました。空き容量を確認して、もう一度お試しください。
  BIBLE could not copy RIPPS2 to %s. Check the space and that it is not write protected. Nothing else was changed.: BIBLE は RIPPS2 を %s にコピーできませんでした。空き容量と書き込み禁止になっていないかを確認してください。ほかには何も変更していません。
  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE は RIPPS2 を HDD の %s パーティションにコピーできませんでした。空き容量を確認してください。ほかには何も変更していません。
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE は HDD のブートプログラムのコピーを保存できなかったため、変更する前に止まりました。RIPPS2 は HDD にコピーされました。ほかには何も変更していません。
  BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed.: BIBLE は %s を退避できなかったため、そこで止まりました。カード上は何も変更していません。
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE は設定（%s）を書き込めませんでした。ブートプログラムは変更していません。
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE は HDD のブートプログラムを書き込めませんでした（手順 %d）。%s
  ? 'BIBLE is installed on memory card %d (mc%d:/%s/%s) and BOOT LOCK is on: at power on the console starts RIPPS2 from %s, at once.'
  : BIBLE はメモリーカード %d（mc%d:/%s/%s）にインストールされ、BOOT LOCK はオンです：電源投入時に本体はすぐに %s から RIPPS2 を起動します。
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : BIBLE は内蔵 HDD にインストールされ、BOOT LOCK はオンです：電源投入時に本体はすぐに %s%s%s%s から RIPPS2 を起動します。設定：%s。%s%s
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE はメモリーカード %d にありますが、設定（%s）を書き込めなかったため、ブラウザーを起動します。空きを作ってから、もう一度「管理」を実行して完了させてください。
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE は開始前にメモリー不足になりました。何も変更していません。
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE はメモリー不足になりました。メモリーカード上は何も変更していません。
  'BIBLE: binding PS2BBL to the memory card': BIBLE：PS2BBL をメモリーカードに結び付けています
  'BIBLE: copying RIPPS2 to %s (%d%%)': BIBLE：RIPPS2 を %s にコピー中（%d%%）
  'BIBLE: keeping the HDD''s boot program': BIBLE：HDD のブートプログラムを保存しています
  'BIBLE: putting the HDD''s boot program back': BIBLE：HDD のブートプログラムを戻しています
  'BIBLE: restarting the I/O processor with the security module': BIBLE：セキュリティモジュールで I/O プロセッサーを再起動しています
  'BIBLE: writing PS2BBL to the HDD''s boot area': BIBLE：PS2BBL を HDD のブート領域に書き込んでいます
  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK は PS2BBL の設定を書き込めませんでした。メモリーカードやドライブが書き込み禁止になっていないか確認して、もう一度お試しください。
  BOOT LOCK found no PS2BBL config to change.: BOOT LOCK は変更できる PS2BBL の設定を見つけられませんでした。
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: BOOT LOCK はオフです。PS2BBL は以前に起動していたもの（%s）を起動します。
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK はオンです。PS2BBL は電源投入時に RIPPS2 を起動します（%s）。ほかのものに行くには、本体の起動中に PS2BBL のホットキーを押し続けてください。%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK は PS2BBL（PlayStation 2 Basic BootLoader）を通じて動作しますが、ここのメモリーカードにはありません。
  INSTALL BIBLE: BIBLE をインストール
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'メモリーカード %d に BIBLE をインストール

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : '内蔵 HDD に BIBLE をインストール

    - RIPPS2 を %s にコピー。

    - 現在 __mbr にある HDD のブートプログラムを読み出し、%s/RIPPS2 に保存（復元で元に戻ります）。

    - その場所に PS2BBL 1.2.0 の HDD 版を書き込み、本体が電源投入時にそれを起動するよう設定。

    - その設定（%s）がまず %s%s%s から RIPPS2 を起動し、BOOT LOCK はオン。

    HDD から起動できる本体（ネットワークアダプター付きの初期型 PS2）が必要です。完了と表示されるまで電源を入れておいてください。'
  INTERNAL HDD  (its boot area): 内蔵 HDD  （そのブート領域）
  MEMORY CARD %d  (%s): メモリーカード %d  （%s）
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'メモリーカード 0：%s

    メモリーカード 1：%s

    %s

    BIBLE は El Isra による PS2BBL 1.2.0 を RIPPS2 が設定したものです：電源投入時に待たず、まず RIPPS2。電源投入時にボタンを押し続ければ、ブラウザー（三角）、ディスク（START）、元にあったもの（丸）にも行けます。メモリーカードか内蔵 HDD にインストールまたは修復しますか？'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: メモリーカード %d の空きは %d KB で、BIBLE にはそこで %d KB 必要です。空きを作ってから、もう一度お試しください。
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: メモリーカード %d の空きは %d KB で、RIPPS2 のコピーには %d KB 必要です。空きを作るか、別の場所を選んでください。
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: メモリーカード %d は電源投入時に %s を起動しますが、BOOT LOCK は PS2BBL を通じてのみ動作します。
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 は RIPPS2 を今の場所から起動できません（メモリーカード、USB メモリ、MX4SIO なら読めます）。ブートローダー > 管理 で RIPPS2 をメモリーカードか USB メモリにコピーできます。
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL はメモリーカード、USB メモリ、MX4SIO からプログラムを起動しますが、RIPPS2 は自分自身を読み取ってそこへコピーできませんでした。そのいずれかから RIPPS2 を起動して、もう一度お試しください。
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'HDD の元のブートプログラムを戻す

    BIBLE が保存したもの（HDD 上の RIPPS2/MBR-BACKUP.KELF）を、BIBLE の代わりに __mbr に戻します。RIPPS2 と PS2BBL の設定はそのまま残ります。'
  RESTORE: 復元
  RESTORE THE HDD'S OLD BOOT PROGRAM: HDD の元のブートプログラムを復元
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 は ROM からこの本体のリージョンを判別できないため、どのシステム更新フォルダを読むのか分かりません。BIBLE はインストールしていません。
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 は HDD の __sysconf または __common パーティションを開けなかったため（エラー %d）、BIBLE はそこに RIPPS2 と設定を置けません。何も変更していません。
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 は保存されたブートプログラムを読み取れませんでした。何も変更していません。
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 はブートプログラムを書き戻せませんでした。もう一度お試しください。保存されたコピーはそのままです。
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': RIPPS2 はドライブの読み込み中で、I/O プロセッサーを再起動できませんでした。何も変更していません。少し待ってからもう一度お試しください。
  Reading the memory cards: メモリーカードを読み込み中
  The HDD partition BIBLE uses went away. Nothing was changed.: BIBLE が使う HDD パーティションがなくなりました。何も変更していません。
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: HDD の元のブートプログラムが戻りました。BIBLE は HDD から起動しなくなりました。
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : 本体が BIBLE をメモリーカード %d に結び付けられませんでした（MagicGate の手順が失敗）。カード上は何も変更していません。純正または MagicGate 対応ではないカードにはシステム更新を入れられません。
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 元にあったものは HDD 上の RIPPS2/MBR-BACKUP.KELF に保存されています。ブートローダー > 管理 > 復元 で元に戻せます。
  The security module would not start on this console. Nothing on the memory card was changed.: この本体ではセキュリティモジュールが起動しませんでした。メモリーカード上は何も変更していません。
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : どちらのスロットにもフォーマット済みの PS2 メモリーカードがなく、内蔵 HDD もありません。BIBLE はメモリーカードか HDD に置かれます。カードを挿してから、もう一度お試しください。
  There is no kept boot program on this HDD. Nothing was changed.: この HDD には保存されたブートプログラムがありません。何も変更していません。
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : この HDD には __sysconf パーティションがないため、BIBLE の設定はメモリーカードに置く必要があります（PS2BBL はカードのものを先に読みます）が、どちらのスロットにもありません。1 枚挿してから、もう一度お試しください。
