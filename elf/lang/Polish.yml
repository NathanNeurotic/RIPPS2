  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Karta pamięci %d ma %d KB wolnego miejsca, a BIBLE potrzebuje na niej %d KB. Zwolnij trochę miejsca i spróbuj ponownie.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Karta pamięci %d ma %d KB wolnego miejsca, a kopia RIPPS2 potrzebuje %d KB. Zwolnij trochę miejsca albo wybierz inne miejsce.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Karta pamięci %d uruchamia przy włączaniu %s, a BOOT LOCK działa tylko przez PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 nie może uruchomić RIPPS2 z miejsca, w którym teraz jest (sięga do kart pamięci, pendrive'ów USB i MX4SIO). PROGRAM ROZRUCHOWY > ZARZĄDZAJ może skopiować dla niego RIPPS2 na kartę pamięci lub pendrive USB.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL uruchamia programy z karty pamięci, pendrive'a USB lub MX4SIO, a RIPPS2 nie mógł odczytać sam siebie, by się tam skopiować. Uruchom RIPPS2 z jednego z nich i spróbuj ponownie.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
