  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK działa przez PS2BBL (PlayStation 2 Basic BootLoader), a na kartach pamięci tutaj go nie ma.
