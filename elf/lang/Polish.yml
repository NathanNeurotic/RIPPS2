  This game's partition is one RIPPS2 does not remove (a system partition, or the one its settings are on).: Partycja tej gry należy do tych, których RIPPS2 nie usuwa (partycja systemowa albo ta z jego ustawieniami).
  'a partition is larger than this disk allows: the table was made for a disk of another size': 'partycja jest większa, niż pozwala ten dysk: tablicę zrobiono dla dysku o innym rozmiarze'
  'a partition runs past the end of this disk (sector %u of %u): the table was made for a bigger disk': 'partycja wychodzi poza koniec tego dysku (sektor %u z %u): tablicę zrobiono dla większego dysku'
  its RIPSHOT pictures: jej zdjęcia RIPSHOT
  its drive: jej dysk
  its saves: jej zapisy
  sector %u holds no partition header: sektor %u nie zawiera nagłówka partycji
  the chain does not close at __mbr: łańcuch nie zamyka się na __mbr
  the chain skips from sector %u: łańcuch przeskakuje od sektora %u
  the chain's links disagree at sector %u: ogniwa łańcucha nie zgadzają się w sektorze %u
  the drive's size could not be read: nie udało się odczytać rozmiaru dysku
  the game (%s): gra (%s)
  the game's folder and everything in it (%s): folder gry i wszystko w nim (%s)
  the header at sector %u could not be read: nie udało się odczytać nagłówka w sektorze %u
  the header at sector %u fails its checksum: nagłówek w sektorze %u nie przechodzi sumy kontrolnej
  the partition at sector %u is not where or as large as APA puts one: partycja w sektorze %u nie leży tam, gdzie ani nie ma rozmiaru, jaki nadaje jej APA
  the settings and art another copy of it uses: ustawienia i okładki, których używa inna jej kopia
  '%d FOLDERS': '%d FOLDERÓW'
  '%s could not be copied to %s. Is the drive full or write-protected?': Nie udało się skopiować %s do %s. Czy dysk jest pełny lub zabezpieczony przed zapisem?
  ? '%s is not where RIPPS2 looks. Search the drives RIPPS2 has started for it? Where it is found is remembered for every launch after.'
  : '%s nie ma tam, gdzie szuka RIPPS2. Poszukać na dyskach uruchomionych przez RIPPS2? Miejsce znalezienia zostanie zapamiętane na każde kolejne uruchomienie.'
  ? 'Ember is not in %s, beside the games, and it has to be. RIPPS2 found it at %s: START copies it there (%d KB) and starts the game.'
  : 'Ember nie ma w %s, obok gier, a musi tam być. RIPPS2 znalazł go w %s: START kopiuje go tam (%d KB) i uruchamia grę.'
  Ember's BIOS: BIOS Embera
  ? 'Ember''s BIOS (bios.bin) is not in %s, beside Ember. RIPPS2 found one at %s: START copies it there (%d KB) and starts the game.'
  : 'BIOS Embera (bios.bin) nie ma w %s, obok Embera. RIPPS2 znalazł jeden w %s: START kopiuje go tam (%d KB) i uruchamia grę.'
  LOOKING FOR YOUR LAUNCHERS: SZUKANIE TWOICH PROGRAMÓW STARTOWYCH
  The POPS files: Pliki POPS
  '%s  MMCE card': '%s  karta MMCE'
  INSTALL RIPPS2'S NEUTRINO: ZAINSTALUJ NEUTRINO Z RIPPS2
  'Internal HDD (APA): %s free of %s': 'Wewnętrzny HDD (APA): wolne %s z %s'
  LAUNCHERS: PROGRAMY STARTOWE
  LOOK FOR THEM: POSZUKAJ ICH
  'Memory card %d: %d KB free': 'Karta pamięci %d: wolne %d KB'
