labels:
  OK: OK
  START: Uruchom
  RESET: Resetuj
  VMC_STATUS: Stan
  ENTER: Enter
  VSYNC: Synchronizacja pionowa
  AUTOSTARTLAST: Autostart
  DS34BT_MODE: DualShock3/4 BT
  HINT_NEUTRINO_AUTO_ELF: Przekazuje rozruchowy ELF gry do Neutrino, aby znalazło konfigurację dla danego tytułu. Domyślnie włączone; ręcznie ustawiona opcja Boot ELF ma pierwszeństwo.
  HINT_POPSTARTER_PATH: Gdzie jest POPSTARTER.ELF. Gdy puste, RIPPS2 wpisuje ten znaleziony na dysku; nadpisz, aby użyć innego, np. usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Argumenty Neutrino przekraczają długość, którą można zapisać. Skróć jakieś pole przed zapisem.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Argumenty uruchomienia Neutrino przekraczają bezpieczny limit. Skróć argumenty globalne lub gry.
  NEUTRINO_AUTO_ELF: Automatyczny Boot ELF (-elf)
  HINT_NEUTRINO_PATH: 'Gdzie jest neutrino.elf? <nie ustawiono> = urządzenie gry -> mc0/mc1. Własna pełna ścieżka jest próbowana jako pierwsza. Przykłady: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Wyświetlanie gier PS2/PS1
  HINT_GAME_VIEW_MODE: Wszystko pokazuje gry PS2 i PS1 razem, a L3 przełącza Wszystko, PS1, PS2. PS2 lub PS1 pokazuje tylko ten typ i wyłącza L3. APPS i Ulubione gry mają własne zasady wyświetlania.
  VIEW_MIXED: Pokazywane gry PS2 + PS1
  VIEW_PS1_ELF: Pokazywane aplikacje PS1 ELF
  APPS_DISPLAY: Wyświetlanie aplikacji
  HINT_APPS_DISPLAY: Wszystko pokazuje każdy ELF na jednej liście APPS z wyłączonym L3. Aplikacje / PS1ELF przenosi tytuły zawierające [PS1] na drugą stronę L3; sposób uruchamiania się nie zmienia.
  VIEW: Widok
  VIEW_PS2: Pokazywane ulubione gry PS2
  VIEW_PS1: Pokazywane ulubione gry PS1
  VIEW_ELF: Pokazywane ulubione ELF-y
  VIEW_ALL: Pokazywane wszystkie ulubione gry
  VMC_FRAGMENTED_ON_CREATE: VMC utworzono, ale jest pofragmentowany. Emulacja karty pamięci potrzebuje jednego nieprzerwanego pliku, więc przy uruchomieniu ten VMC zostanie pominięty, a użyta zostanie prawdziwa karta. Zwolnij miejsce i utwórz go ponownie albo skopiuj z innego urządzenia.
  KEYB_MOVE_CURSOR: Przesuń kursor
  TITLECOLOR: Kolor tytułów gier
  RA_CHECK_GAME: Sprawdź obsługę RetroAchievements
  RA_TEST_LINK: Testuj połączenie RetroAchievements z PC
  RA_CHECKING_IMAGE: Sprawdzanie obrazu, to potrwa kilka sekund...
  RA_CHECK_RUNNING: Sprawdzanie obrazu już trwa
  RA_LOOKING_FOR_PC: Szukanie klienta na PC...
  RA_UL_UNSUPPORTED: Gier UL/USBExtreme nie da się jeszcze sprawdzić
  RA_UL_UNSUPPORTED2: Obsługiwane są tylko zwykłe obrazy .iso w DVD/ lub CD/
  RA_UNKNOWN_IMAGE: RetroAchievements nie zna tego obrazu
  RA_STILL_IDENTIFYING: PC wciąż rozpoznaje obraz
  RA_TRY_AGAIN: Spróbuj ponownie za kilka sekund
  RA_NO_SOCKET: Konsola nie mogła otworzyć gniazda sieciowego
  RA_NO_SOCKET2: Uruchom ponownie konsolę albo sprawdź urządzenie ETH w ustawieniach
  RA_TEST_NO_SOCKET2: Sprawdź kabel i ETH w ustawieniach; jeśli sieć działa, uruchom ponownie konsolę
  RA_PC_NO_ANSWER: Klient na PC nie odpowiedział
  RA_PC_NO_ANSWER2: Sprawdź, czy xeRAbora działa, albo spróbuj testu połączenia z PC
  RA_SUPPORTED: Obsługiwane przez RetroAchievements
  RA_START_TO_TRACK: Uruchom grę, aby śledzić osiągnięcia
  RA_ACHIEVEMENTS: '%d osiągnięć'
  RA_ACHIEVEMENTS_FULL: '%d osiągnięć -- %d odblokowanych, %d nieobsługiwanych'
  RA_HASH_FAILED: Nie udało się obliczyć skrótu obrazu
  RA_HASH_FAILED2: Przyczynę znajdziesz w RA/hashes.txt obok gier
  RA_NET_BUSY: Sieć jest zajęta przez transport UDP
  RA_NET_BUSY2: RA potrzebuje stosu SMB -- zmień protokół albo zbuduj plik .wl na PC
  RA_NET_BUSY_HASH: Skrót jest w RA/hashes.txt -- xeRAbora może z niego zbudować .wl
  RA_NO_IP: Konsola nie ma adresu IP
  RA_NO_IP2: Sprawdź DHCP albo adres statyczny w ustawieniach sieci
  RA_TEST_NO_ANSWER: Żaden klient na PC nie odpowiedział w ciągu 3 sekund
  RA_TEST_NO_ANSWER2: Konsola%s. Sprawdź, czy xeRAbora działa i czy UDP 18194 jest otwarty
  RA_TEST_FOUND: Znaleziono klienta na PC%s%s %s
  RA_TEST_FOUND2: Odpowiedź w %u ms, konsola%s
