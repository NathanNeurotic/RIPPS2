  PCCF_UNSUPPORTED_GAME: CF obecnie obsługuje tylko natywne gry PS2. VMC na CF, wczytywanie PS1 i osiągnięcia sieciowe są niedostępne.
  HINT_ENABLE_DVR: Eksperymentalne wykrywanie ISO DESR DVR. Wymaga włączonego źródła HDD; uruchamianie gier wymaga zewnętrznego Neutrino z obsługą DVR.
