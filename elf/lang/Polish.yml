  START EVERY DRIVE: URUCHOM WSZYSTKIE DYSKI
  'STATUS: looking at the drives and the homebrew': 'STAN: przegląd dysków i homebrew'
  Start every drive first, so the search reaches all of them? (No searches the drives already started.): Najpierw uruchomić wszystkie dyski, żeby wyszukiwanie dotarło do każdego? (Nie szuka na już uruchomionych dyskach.)
  USB, HDD, MMCE and the rest: USB, HDD, MMCE i reszta
