  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL 1.2.0 zostaje związany z tą kartą przez konsolę i zapisany jako %s/%s.

    - Jego konfiguracja, mc%d:/PS2BBL/CONFIG.INI, uruchamia RIPPS2 z %s, BOOT LOCK włączony.

    Procesor I/O zostanie w tym celu uruchomiony ponownie; muzyka i dyski wrócą potem. Trzymaj kartę w gnieździe i konsolę włączoną, aż pojawi się informacja o zakończeniu.'
