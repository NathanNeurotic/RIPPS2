  RA_NA_UDPFS: Śledzenie RA nie jest dostępne na UDPFS -- gry uruchamiają się przez Neutrino
  RA_NA_PS1: Śledzenie RA nie jest dostępne dla gier PS1
  RA_NA_HDD: Informacje o grze APA lub katalog ustawień HDD są niedostępne
  RA_NA_HDD2: Ustaw prawidłowy katalog ustawień HDD i odśwież przed sprawdzeniem obsługi
  RA_TELEMETRY: Telemetria RetroAchievements
  RA_BADGES: Odznaki RetroAchievements
  HTTP_GAMES: Gry HTTP
  HTTP_SERVER: Serwer HTTP
  HTTP_PORT: Port HTTP
  HTTP_BASE_PATH: Ścieżka bazowa HTTP
  HTTP_TEST: Testuj serwer HTTP
  HTTP_TEST_OK: Serwer OK -- gry na liście
  HTTP_TEST_EMPTY: Katalog jest pusty -- poprawny, ale nic nie dowodzi w sprawie zakresów bajtów
  HTTP_TEST_NO_ISO: Katalog nie ma obsługiwanego obrazu, na którym można przetestować zakres bajtów
