  HTTP_NO_VMC: Wirtualne karty pamięci nie są dostępne przez HTTP -- użyj fizycznej karty
  HTTP_TAB_HINT: HTTP czyta games.csv z twojego serwera. Ustaw adres, port i ścieżkę bazową w ustawieniach sieci, a potem użyj Testu.
  RA_DISC_CHECK: 'RA: sprawdź obsługę płyty'
  RA_DISC_LAUNCH: 'RA: uruchom płytę'
  RA_DISC_CHECKING: Sprawdzanie płyty pod kątem RetroAchievements
  RA_DISC_HASH_FAILED: Nie udało się obliczyć skrótu płyty -- sprawdź RA/hashes.txt w folderze ustawień
  RA_DISC_HOME_ERROR: Ścieżki ustawień nie można użyć dla list śledzenia płyt
  RA_DISC_ENABLE: Najpierw włącz telemetrię RetroAchievements w ustawieniach sieci
  RA_DISC_CHECK_FIRST: 'Brak listy śledzenia dla tej płyty -- najpierw użyj RA: sprawdź obsługę płyty'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: znaleziono HDD, ale nie da się odczytać jego tablicy partycji APA. Nie formatuj go -- twoje gry mogą dać się odzyskać.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: dysk nie został zamontowany, bo jego sektory nie mają 512 bajtów (np. dysk z sektorami 4K). OPL czyta tylko sektory 512-bajtowe.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Ten tytuł jest osobną partycją APA, a OPL nigdy nie edytuje tablicy partycji. Zmień nazwę na PC.
  POPS_SETTINGS_UNREADABLE: Nie udało się odczytać ustawień POPSTARTER -- karta pamięci jest zajęta lub nieczytelna. Spróbuj ponownie po zakończeniu wczytywania.
  GLOBAL_PS_EMULATION_SETTINGS: Globalne ustawienia emulacji PS
  RA_NO_LINK_UNTRACKED: Sieć niedostępna -- tym razem uruchamianie bez RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: Ścieżka IGR jest na USB, ale w %s brakuje USBD.IRX i USBHDFSD.IRX, których konsola potrzebuje, by dostać się do USB po resecie w grze. Bez nich IGR wraca do przeglądarki PS2. Skopiować tam teraz sterowniki RiptOPL? FMCB, OpenTuna i inne exploity też wczytują te pliki i mogą z nimi działać inaczej. Istniejące pliki nigdy nie są zastępowane. Tylko USB FAT32.
  IGR_USB_DRIVERS_FAILED: Nie udało się skopiować sterowników USB do %s (karta pełna lub niezapisywalna). IGR będzie wracać do przeglądarki PS2.
  OFFICIAL_CFG_NOTIFICATION: Oficjalne ustawienia OPL wczytane z %s
  CFM_VMODE_HOLD_KEEP: Przytrzymaj, aby zachować
  BDM_PS2_FOLDERS_UNREADABLE: Nie udało się otworzyć folderu CD ani DVD w %s (błąd %d), więc to urządzenie nie pokazuje gier PS2. Naciśnij SELECT na jego stronie, aby spróbować ponownie.
  NEUTRINO_BD_NO_DEVICE_NUMBER: System plików Neutrino ustawiono na bd, ale to urządzenie nigdy nie podało swojego numeru, więc Neutrino nie może na nie wskazać. Ustaw system plików Neutrino dla tej gry na Auto lub exfat.
  CFM_VMODE_REVERT_IN: Przywrócenie za %d s
  EMBER_DITHER: Dithering Ember
  HINT_EMBER_DITHER: Dithering Ember (Wł. lub Wył.), zapisywany do EMBER/settings.txt na urządzeniu uruchamiania. Wartość dla gry ma pierwszeństwo.
  EMBER_SHADING: Cieniowanie Ember
  HINT_EMBER_SHADING: 'Głębia kolorów Ember: 15 bitów lub 24 bity (eksperymentalne). Zapisywana do EMBER/settings.txt na urządzeniu uruchamiania. Wartość dla gry ma pierwszeństwo.'
  EMBER_CONTROLLER: Kontroler Ember
  HINT_EMBER_CONTROLLER: 'Tryb kontrolera Ember: Auto, Analog lub D2A. Zwykle najlepiej ustawić go dla gry (Trójkąt > Ustawienia gry Ember), co ma pierwszeństwo.'
  EMBER_480P_CONFIRM: Ember w 480p nie daje obrazu przez kompozyt. Użyć 480p?
  EMBER_SHADING_24: 24 bity (eksperymentalne)
  EMBER_GAME_SETTINGS: Ustawienia gry Ember
  HINT_EMBER_GAME_SETTING: Tylko ta gra. Naciśnij OK, aby przed uruchomieniem zapisać EMBER/games/<nazwa>/settings.txt. Nieruszona Domyślna zachowuje istniejącą wartość z pliku; zmiana wartości z powrotem na Domyślną usuwa jej nadpisanie.
  EMBER_TIMING: Taktowanie Ember
  HINT_EMBER_TIMING: 'Taktowanie obrazu Ember: Auto podąża za regionem płyty, NTSC wymusza 60 Hz, PAL wymusza 50 Hz. Zapisywane do EMBER/settings.txt na urządzeniu uruchamiania.'
  EMBER_GLOBAL_WARNING: Te ustawienia Ember dotyczą każdej gry PS1, a niektóre gry się z nimi wysypują. Aby zmienić tylko jedną grę, użyj Trójkąt > Ustawienia gry Ember na tej grze.
  RIPPS2_RANDOM: Losowo
  RIPPS2_ALL: Wszystko
  RIPPS2_RANDOM_GAME: Losowa gra
  HINT_RIPPS2_RANDOM_GAME: L2 i R2 naraz skaczą do losowej gry. Przy starcie każda lista też otwiera się na losowej grze.
  RIPPS2_ALL_GAMES: Wszystkie gry
  RIPPS2_SET_METADATA: Ustaw metadane
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: Uruchamia RIPPS2 przy włączaniu przez PS2BBL. Wył. przywraca to, co PS2BBL uruchamiał wcześniej. Nie masz jeszcze PS2BBL? Program rozruchowy zainstaluje BIBLE.
  HINT_COLORS_TEXT: Kolor tekstu listy gier. Motywy ustawiają własny; to zmienia go dla motywów wbudowanych.
  HINT_COLORS_SELECTED: Kolor wybranej gry i wybranego wiersza na stronach ustawień.
  HINT_COLORS_DIALOG: Kolor stron ustawień i okien komunikatów.
  HINT_COLORS_TITLE: Kolor nazwy gry na jej stronie informacji.
  HINT_COLORS_BACKGROUND: Kolor za wszystkim, gdy nie są rysowane grafiki ani wieże.
  HINT_COLORS_PLASMA: Kolor, w stronę którego miesza się stare tło plazmy OPL (motyw <OPL>).
  HINT_COLORS_RESET: Przywraca sześć powyższych kolorów do kolorów motywu.
  HINT_COVERFLOW_COUNT: Ile okładek RIPFLOW pokazuje po każdej stronie wybranej.
  HINT_COVERFLOW_SCALE: Jak dużą RIPFLOW rysuje wybraną okładkę względem pozostałych.
  HINT_COVERFLOW_ANIM: Jak szybko okładki przesuwają się, gdy poruszasz się po przepływie.
  HINT_NARGS_QB: 'Quick Boot: pomija ekran startowy Neutrino. Włączone tutaj jest wysyłane dla każdej gry; wyłączone, RIPPS2 i tak wysyła je samo dla gier z USB, iLink i sieci, gdzie jest potrzebne.'
  HINT_NARGS_DBC: 'Kolory debugowania: Neutrino wypełnia ekran kolorem na każdym etapie wczytywania, więc zdjęcie pokazuje, gdzie gra się zatrzymuje.'
  HINT_NARGS_LOGO: Pokazuje logo PS2 przed grą (drugi restart IOP, którego potrzebują niektóre dyski iLink). Wyłączone tutaj, RIPPS2 kieruje się opcją Uruchamianie gier > Logo PS2 i nigdy nie wysyła go dla gier z MMCE ani z sieci.
  HINT_NARGS_CWD: 'Folder, który gra uważa za własny. Puste: domyślny Neutrino.'
  HINT_NARGS_CFG: 'Twój własny plik konfiguracji Neutrino (-cfg). Puste: ten od Neutrino.'
  HINT_NARGS_ELF: 'Uruchamia ten ELF zamiast pliku rozruchowego wskazanego przez płytę. Puste: własny plik gry.'
  HINT_NARGS_ATA0: Obraz HDD, który Neutrino montuje jako wewnętrzny HDD konsoli, dla gier używających HDD (-ata0).
  HINT_NARGS_ATA0ID: Plik ID pasujący do tego obrazu HDD (-ata0id).
  HINT_NARGS_ATA1: Drugi obraz HDD (-ata1).
  RIPPS2_LAST_USED: Ostatnio używane
  RIPPS2_PAGE_BUTTONS: Przyciski stron
  HINT_RIPPS2_PAGE_BUTTONS: 'Którymi przyciskami barkowymi przewraca się strony listy gier. L2 / R2: przewracają strony, a L1 / R1 zmieniają kategorie. L1 / R1: przewracają strony, a L2 / R2 zmieniają kategorie. Motyw: decyduje motyw; bez niego L2 idzie na początek, a R2 na koniec. L2 + R2 naraz zawsze wybierają losową grę.'
  RIPPS2_IGR_MENU: Menu w grze
  HINT_RIPPS2_IGR_MENU: 'Wł.: L1+L2+R1+R2+SELECT+START pauzuje grę: wznów, wyjdź, zrób zrzut ekranu, sprawdź osiągnięcia lub wyłącz. Wył.: kombinacja od razu wychodzi z gry, jak dotąd.'
  RIPPS2_BOOT_LOADER: Program rozruchowy
  HINT_RIPPS2_BOOT_LOADER: Pokazuje, co każda karta pamięci uruchamia przy włączaniu, i instaluje BIBLE (PS2BBL ustawiony dla RIPPS2). Stare pliki rozruchowe karty zostają zachowane.
  RIPPS2_MANAGE: Zarządzaj
  RIPPS2_ACHIEVEMENTS: Osiągnięcia
  RIPPS2_NBD_SERVER: Serwer NBD
  HINT_RIPPS2_NBD_SERVER: Udostępnia dysk twardy komputerowi przez sieć. Podczas działania widoczny jest ekran stanu.
  RIPPS2_START: Uruchom
  RIPPS2_COVER_ART: Okładki
  HINT_RIPPS2_COVER_ART: Pobiera okładkę dla każdej gry PS2 bez okładki na twoich uruchomionych listach, do folderu ART tego dysku, z ps2-covers xlenore na GitHub. Potrzebny kabel sieciowy i internet.
  RIPPS2_DOWNLOAD: Pobierz
  RIPPS2_GLYPHS: Symbole krzyżaka
  HINT_RIPPS2_GLYPHS: 'Symbole krzyżaka obok nazw dysków i formacji. Pojawianie pokazuje je przy przełączaniu; Znikanie pokazuje je przy otwieraniu strony. Motyw: decyduje motyw.'
  RIPPS2_COLOR_THEME: Motyw kolorów
  HINT_RIPPS2_COLOR_THEME: 'Jeden kolor dla wież, kul, szkła, odtwarzacza CD i przeglądarki plików, na wszystkich trzech kartach. Motyw: decyduje motyw (tam, gdzie nie decyduje, niebieski RIPPS2).'
  RIPPS2_HINTS: Podpowiedzi przycisków
  HINT_RIPPS2_HINTS: 'Podpowiedzi przycisków na dole. Znikaj przy bezczynności ukrywa je, dopóki nie naciśniesz przycisku. Motyw: decyduje motyw.'
  RIPPS2_CATEGORY_BAR: Pasek kategorii
  HINT_RIPPS2_CATEGORY_BAR: 'URUCHOM PŁYTĘ, PAMIĘĆ MASOWA i PLIKI PAMIĘCI na górze. Znikaj przy bezczynności ukrywa je, dopóki nie naciśniesz przycisku. Motyw: decyduje motyw.'
  RIPPS2_SOURCE_NAME: Nazwa źródła
  RIPPS2_STATUS: Stan
  RIPPS2_SOURCE: Źródło
  HINT_RIPPS2_SOURCE_NAME: 'Nazwa źródła nad grami (WSZYSTKIE GRY, GRY HDD i tak dalej). Znikaj przy bezczynności wygasza ją razem z paskiem kategorii; Wyskakiwanie zamiast tego pokazuje ją dużą na środku strony, tak jak L3 nazywa listę, przy pierwszej liście po starcie i przy każdej zmianie źródła, a potem ją wygasza. Motywy mogą uczynić Wyskakiwanie swoim Widocznym. Motyw: decyduje motyw.'
  RIPPS2_RECENTS: Pokaż ostatnie
  HINT_RIPPS2_RECENTS: Do tylu ostatnio uruchomionych gier na górze Ulubionych gier, najnowsze pierwsze. 0 wyłącza.
  RIPPS2_CATEGORY_ORDER: Kolejność kategorii
  HINT_RIPPS2_CATEGORY_ORDER: 'Pliki pamięci pierwsze, a Uruchom płytę ostatnie. Zrobione dla RIPFLOW (Interfejs > Motyw). Motyw: decyduje motyw.'
  RIPPS2_MUSIC: Muzyka
  HINT_RIPPS2_MUSIC: Odtwarza pliki bgm z folderu AUDIO obok RIPPS2 i z folderu AUDIO OPL na każdym uruchomionym dysku (Ogg bez tagów lub 16-bitowy WAV); ten o nazwie Menu gra pierwszy. Własna muzyka motywu gra zamiast nich.
  RIPPS2_BIOS_SOUNDS: Dźwięki BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Zapisuje własne dźwięki menu tej konsoli z jej BIOS-u do folderu AUDIO jako dźwięki RIPPS2 (poniżej 1 MB). Muzyka menu to osobne zgranie: Muzyka BIOS.'
  RIPPS2_RIP: Zgraj
  RIPPS2_HINTS_GLYPHS: Podpowiedzi i symbole
  HINT_RIPPS2_HINTS_GLYPHS: Jak wyglądają podpowiedzi przycisków i symbole. Każdy wiersz zaczyna od Motyw, czyli wyboru motywu; każdy inny wybór jest twój i wygrywa z każdym motywem.
  RIPPS2_HINT_LAYOUT: Układ podpowiedzi
  HINT_RIPPS2_STARSIDE: 'Gdzie stoi gwiazdka ulubionej gry na liście. Lewo: własna kolumna na początku każdego wiersza. Prawo: za tytułem. Ukryta: bez gwiazdki. Motyw: jak mówi motyw. Ikona wiersza motywu przechodzi na drugi koniec, więc nigdy się nie nakładają.'
  HINT_RIPPS2_HINT_LAYOUT: 'Wiersz: podpowiedzi w jednej linii. Kolumna: jedna podpowiedź w linii, lista z boku, zaczynająca się tam, gdzie motyw umieszcza podpowiedzi.'
  RIPPS2_HINT_LABELS: Etykiety podpowiedzi
  HINT_RIPPS2_HINT_LABELS: Tylko symbol rysuje same przyciski, dla symboli z własnymi napisami. Odznaki łączą symbol i tytuł każdej podpowiedzi w jednej odznace.
  RIPPS2_HINT_MENU: Podpowiedź menu (START)
  RIPPS2_HINT_REFRESH: Podpowiedź odświeżania (SELECT)
  RIPPS2_HINT_STAR: Podpowiedź gwiazdki (R3)
  RIPPS2_HINT_VIEW: Podpowiedź widoku (L3)
  HINT_RIPPS2_HINT_SHOW: Pokazuje lub ukrywa tę podpowiedź. Jej przycisk działa w obu przypadkach.
  RIPPS2_GLYPH_SET: Zestaw symboli
  HINT_RIPPS2_GLYPH_SET: 'Symbole przycisków na każdej stronie: własne motywu, RIPPS2, Standardowe (ciemne przyciski, kolorowe znaki) lub Białe (całe białe).'
  RIPPS2_HINT_ORDER: Kolejność podpowiedzi
  HINT_RIPPS2_HINT_ORDER: Układa podpowiedzi. Motyw zachowuje kolejność motywu; Twoja kolejność to ta ustawiona tutaj.
  RIPPS2_HINT_ORDER_FOLLOW: Kolejność
  RIPPS2_GRID_LAYOUT: Układ siatki
  HINT_RIPPS2_GRID_LAYOUT: Ile okładek mieści strona siatki, z odstępami RIPPS2. Motyw zachowuje własne ustawienie motywu.
  RIPPS2_LAUNCH_DISC: Płyta przy uruchamianiu
  HINT_RIPPS2_LAUNCH_DISC: Przy uruchamianiu gry pojawia się jej płyta. Wyskakiwanie osiada i wygasa; Obrót kręci się coraz szybciej, aż gra się zacznie.
  RIPPS2_TRANSITION: Przejście strony
  HINT_RIPPS2_TRANSITION: 'Jak pojawia się nowa strona, gdy przechodzisz do innej kategorii: z koloru tła motywu albo z błysku. Motyw zachowuje wybór motywu.'
  RIPPS2_CATEGORY_LAYOUT: Układ kategorii
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Gdzie stoją trzy kategorie: ich nazwy u góry albo ikony w dół paska bocznego, każda z szufladą swoich stron (Lewo na liście tam prowadzi). Motyw zachowuje własne ustawienie motywu.'
  RIPPS2_CACHE: Pamięć podręczna
  HINT_RIPPS2_CACHE: 'Jak przechowywana jest lista gier każdego źródła, żeby jego strona otwierała się od razu: Fast Cache, lista wewnętrznego HDD i Automatyczne odświeżanie.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: Każde źródło przechowuje swoją ostatnią listę gier (RIPPS2.LST obok folderów CD i DVD) i pokazuje ją, gdy tylko źródło odpowie, a potem czyta źródło ponownie w tle. Wyłączone czyta każdą listę najpierw ze źródła, jak dawniej.
  HINT_RIPPS2_VIGNETTE: Przyciemnia krawędzie każdej okładki oprócz wybranej, aby się wyróżniała. Słabe to połowa Pełnego.
  RIPPS2_GRID_WIDE: Układ siatki panoramicznej
  HINT_RIPPS2_GRID_WIDE: Strona siatki tylko dla obrazu 16:9 (panoramiczny, 720p, 1080i), gdzie okładki są węższe i mieści się ich więcej w rzędzie. Motyw używa własnego ustawienia motywu; Jak układ siatki podąża za układem siatki.
  RIPPS2_BGBLUR: Rozmycie tła
  HINT_RIPPS2_BGBLUR: Jak mocno matowe szkło rozmywa grafikę tła gry. Motyw używa własnego ustawienia motywu (Słabe w RIPGRID i Adapt).
  HINT_RIPPS2_HINT_SLOT: Podpowiedź na tym miejscu. Podpowiedź, która tu była, przenosi się na stare miejsce wybranej.
  PS1_SAVE_GUIDANCE: Zapisy PS1 zależą od Ember lub POPSTARTER; ustawienia VMC PS2 nie mają zastosowania.
  NEUTRINO_SHOW_ARGS: Pokaż argumenty uruchomienia
  HINT_NEUTRINO_SHOW_ARGS: Przed każdym uruchomieniem przez Neutrino pokazuje każdy argument, który Neutrino otrzyma, i pyta, czy kontynuować. Wstecz wraca do menu bez uruchamiania.
  NEUTRINO_ARGS_CONFIRM: Neutrino uruchomi się z tymi argumentami. Uruchomić?
  HINT_NARGS_EXTRA: Inne flagi Neutrino, rozdzielone spacjami, wysyłane po wszystkim powyżej. RIPPS2 zawsze dodaje -bsd i -dvd dla dysku i ISO gry, -mc0 i -mc1 dla jej VMC, -gsm dla trybu obrazu oraz własne tryby zgodności gry. Flaga z własnym wierszem powyżej (np. -logo) przy zapisie trafia do tego wiersza i nadal jest wysyłana.
  HINT_RIPPS2_THEME: Wygląd każdej strony. Na liście gier przytrzymaj SELECT przez 4,2 sekundy, aby przełączyć na następny motyw; krótkie naciśnięcie SELECT nadal odświeża listę.
  GAME_TYPE_LABELS: Pokaż etykiety [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Nie udało się zapisać listy kodów w folderze Neutrino, więc Neutrino nie może jej użyć. Uruchomić bez kodów?
  AUTO_CREATE_VMC: Utwórz VMC przy pierwszym uruchomieniu
  HINT_AUTO_CREATE_VMC: Uruchomienie gry PS2 bez VMC w gnieździe 1 tworzy kartę 8 MB na urządzeniu gry, nazwaną tak, jak proponuje ekran VMC (wspólną dla wszystkich płyt gry), i ją przypisuje. Nie dla wewnętrznego HDD w Neutrino.
  AUTO_VMC_CREATING: Tworzenie VMC tej gry...
  AUTO_VMC_FAILED: Nie udało się utworzyć VMC tej gry. Gra uruchomi się bez niego.
  RIPPS2_BIOS_MUSIC: Muzyka BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Zapisuje muzykę menu tej konsoli (ambientowy utwór jej przeglądarki, około 15 MB jako WAV) do wybranego folderu AUDIO: obok RIPPS2 albo tego od OPL na uruchomionym dysku. Za duża na kartę pamięci. Najpierw pokazywany jest jej rozmiar.'
  SAVE_ICONS: Ikony zapisów 3D
  HINT_SAVE_ICONS: Pokazuje obracającą się ikonę zapisu wybranej gry tam, gdzie motyw ma na nią miejsce. Najpierw czyta własny VMC gry, potem karty pamięci.
  NETBOOT_RESTART_NOW: Protokół sieciowy zmieni się po ponownym uruchomieniu. Zapisać ustawienia i uruchomić teraz ponownie OPL?
  HINT_NET_PROTOCOL: 'Której usługi sieciowej używa RiptOPL: udziału SMB, UDPFS, UDPBD lub HTTP. To samo ustawienie co w Źródłach gier. Zmiana z już działającej wymaga ponownego uruchomienia.'
  HINT_UDPFS_ACCESS: Tylko UDPFS. Pliki czyta pojedyncze ISO z folderu gier na serwerze; IMG czyta obraz dysku jako dysk. SMB i HTTP zawsze używają Plików, UDPBD zawsze IMG.
  HINT_SMB_VERSION: Którą wersją SMB rozmawiać z udziałem na PC.
  HINT_NET_ADVANCED: Odblokowuje edycję trybu łącza Ethernet i portu SMB.
  HINT_ETH_LINK_MODE: Wymusza prędkość i dupleks łącza sieciowego. Zostaw Auto, chyba że łącze ciągle się zrywa.
  HINT_IP_ADDR_TYPE: Statyczny używa adresu poniżej; DHCP pyta router. UDPFS i UDPBD zawsze używają statycznego.
  HINT_PS2_IP: Własny adres IP konsoli PS2. Wybierz taki, którego nie używa żadne inne urządzenie, w tym samym zakresie co PC.
  HINT_NETMASK: Maska podsieci, zwykle 255.255.255.0.
  HINT_GATEWAY: Adres twojego routera, zwykle z tymi samymi trzema pierwszymi liczbami i zakończony na .1.
  HINT_DNS: Adres serwera DNS. Zwykle taki sam jak brama.
  HINT_SMB_ADDR_TYPE: Łączenie z PC przez jego adres IP lub nazwę NetBIOS (komputera).
  HINT_SMB_ADDRESS: 'PC udostępniający twoje gry: jego adres IP albo nazwa komputera, gdy Typ adresu to NetBIOS.'
  HINT_SMB_PORT: 'Port SMB. Musi pasować do PC: PS2 Servers używa 1111, udziały Windows i Samba używają 445.'
  HINT_SMB_USER: Nazwa użytkownika SMB. guest działa dla większości udziałów.
  HINT_HTTP_SERVER: Adres IP serwera gier HTTP.
  HINT_HTTP_PORT: Port, na którym nasłuchuje serwer gier HTTP.
  HINT_HTTP_BASE: Folder na serwerze HTTP, w którym jest games.csv. / to katalog główny serwera.
  HINT_HTTP_TEST: Próbuje serwera HTTP z powyższymi wartościami i podaje, co znalazł.
  HINT_RA_TELEMETRY: Główny przełącznik RetroAchievements. Wył. uruchamia gry bez stosu sieciowego i migawek, tak samo jak zwykła kompilacja.
  HINT_RA_BADGES: Oznacza na liście gry, które mają osiągnięcia. Pozostaje ciemne, gdy telemetria jest wyłączona.
  HINT_POPS_NET_BUTTON: Edytuje własne pliki sieciowe POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), których potrzebują gry PS1 przez SMB.
  HINT_POPS_IP_TYPE: 'Jak PS2 dostaje adres, gdy gra PS1 działa przez SMB: Statyczny lub DHCP.'
  HINT_POPS_IP: Adres IP PS2, gdy gra PS1 działa przez SMB.
  HINT_POPS_SMB_IP: Adres IP PC udostępniającego twoje gry PS1.
  HINT_POPS_SMB_SHARE: Nazwa udziału na tym PC, w którym jest folder POPS.
  HINT_LASTPLAYED: Zaczyna od gry uruchomionej ostatnio.
  HINT_LANGUAGE: Język menu. Dodaj kolejne, wkładając pliki lang_*.lng do folderu LNG.
  HINT_GSM_DEFAULTS_BUTTON: Poprawki trybu obrazu, które dostaje każda gra, chyba że ma własne ustawienia GSM.
  HINT_DEFDEVICE: Strona, którą RiptOPL otwiera przy starcie.
  HINT_MMCE_MODE: Gry na SD2PSX lub MemCard PRO2. Auto startuje przy starcie, Ręcznie po otwarciu strony, Wył. ukrywa ją.
  HINT_MMCE_SETTINGS_BUTTON: Gniazdo, IGR bootcard, GameID i opcje taktowania dla MMCE.
  HINT_ENABLE_USB: Wczytuje sterownik pamięci masowej USB.
  HINT_ENABLE_MX4SIO: Wczytuje sterownik adaptera kart SD MX4SIO.
  HINT_ENABLE_ILINK: Wczytuje sterownik pamięci masowej iLink (FireWire).
  HINT_NETSTART: 'Uruchamia sieć: Auto przy starcie, Ręcznie po otwarciu jej strony. Wył. nie rusza karty sieciowej.'
  HINT_APPMODE: Strona aplikacji. Auto startuje przy starcie, Ręcznie po otwarciu, Wył. ukrywa ją.
  HINT_FAVMODE: Strona ulubionych gier. Auto startuje przy starcie, Ręcznie po otwarciu, Wył. ukrywa ją.
  HINT_BDMA_BUTTON: Którego sterownika exFAT POPSTARTER używa dla gier PS1 na USB, MX4SIO, MMCE, HDD lub iLink.
  HINT_VCD_LIST_BUTTON: 'Jak wyświetlane są gry PS1: ukryj ID gier, pokaż tylko płytę 1, pokaż partycje PP na HDD.'
  HINT_MMCE_SLOT: W którym gnieździe karty pamięci jest urządzenie MMCE. Auto je znajdzie.
  HINT_MMCE_GAMEID: Mówi urządzeniu MMCE, która gra się uruchamia, aby mogło przełączyć się na kartę pamięci tej gry.
  HINT_MMCE_COMM_BUTTON: Opcje taktowania łącza MMCE. Zmieniaj je tylko wtedy, gdy gry się zawieszają lub wolno wczytują.
  HINT_MMCE_PATH_BUTTON: Gdzie na karcie MMCE są foldery gier.
  HINT_MMCE_PREFIX: Podfolder na karcie MMCE, w którym są CD, DVD i inne foldery OPL. Puste używa katalogu głównego karty.
  HINT_GAME_TYPE_LABELS: Poprzedza nazwę każdej gry znacznikiem [PS1] lub [PS2]. Tylko wyświetlanie.
  HINT_MENU_VMODE: Wyjście obrazu menu. Gry używają zamiast tego GSM. Przytrzymaj Zatwierdź, aby zachować nowy tryb.
  HINT_THEME: Wygląd menu. Motywy są czytane z folderu THM na każdym urządzeniu.
  HINT_COVERFLOW_BUTTON: Liczba okładek, rozmiar, animacja i przyciemnianie dla motywu Coverflow.
  HINT_ARTWORK_BUTTON: 'Które grafiki się wczytują: okładki, grafiki płyt, tła i ikony zapisów.'
  HINT_COLORS_BUTTON: Kolory tekstu, podświetlenia, okien dialogowych i tła.
  HINT_NOTIFICATIONS: Krótkie powiadomienia, gdy wczytuje się plik konfiguracji, motywu lub języka.
  HINT_AUTOSORT: Sortuje listy gier od A do Z. Wył. zachowuje kolejność, w jakiej je znaleziono.
  HINT_AUTOREFRESH: Dodaje gry z nowo podłączonych urządzeń bez ręcznego odświeżania.
  HINT_COVERART: Wczytuje okładki z folderu ART.
  HINT_DISCART: Pokazuje grafikę płyty (<ID>_ICO). Wył. ukrywa płytę, ale zachowuje okładki i tła.
  HINT_BGART: Pokazuje tło gry (<ID>_BG), gdy motyw go używa.
  HINT_ART_TAR: Czyta też grafiki spakowane w ART/art.tar.
  HINT_ART_DELAY: Jak długo kursor zatrzymuje się na grze, zanim wczyta się jej grafika. Wyższe pomija grafiki przy szybkim przewijaniu.
  HINT_TXTCOLOR: Kolor zwykłego tekstu menu.
  HINT_SELCOLOR: Kolor podświetlonej pozycji.
  HINT_UICOLOR: Odcień tła okien dialogowych.
  HINT_TITLECOLOR: Kolor tytułów gier na liście.
  HINT_BGCOLOR: Kolor tła menu.
  HINT_PLASCOLOR: Kolor wmieszany w animowane tło.
  HINT_RESETCOLOR: Przywraca wbudowane kolory RiptOPL, a nie kolory motywu.
  HINT_WIDESCREEN: Rysuje menu dla telewizora 16:9.
  HINT_XOFF: Przesuwa menu w lewo lub w prawo na ekranie.
  HINT_YOFF: Przesuwa menu w górę lub w dół na ekranie.
  HINT_MENU_OVERSCAN: Zmniejsza menu do środka, jeśli telewizor obcina jego krawędzie.
  HINT_APPLYGAMEID: Pokazuje kod kreskowy przy starcie gry, aby urządzenia Pixel FX, RetroGEM i PS2Digital przełączyły profile.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Ścieżka, tryb obrazu i argumenty Neutrino dla każdej gry.
  HINT_OSD_DEFAULTS_BUTTON: Język konsoli, rozmiar ekranu i tryb obrazu przekazywane grom.
  HINT_ENWRITEOP: Pozwala zmieniać nazwy i usuwać gry oraz tworzyć VMC. Nigdy nie rusza tablicy partycji HDD.
  HINT_DEBUG: 'Pomoc dla twórców: kolorowe ekrany podczas startu gry i liczniki wczytywania grafik w menu.'
  HINT_BDMPREFIX: Podfolder na dyskach USB, MX4SIO, iLink i exFAT, w którym są foldery gier. Puste używa katalogu głównego dysku.
  HINT_ETHPREFIX: Podfolder w udziale SMB, w którym są foldery gier. Puste używa katalogu głównego udziału.
  HINT_HDDGAMELISTCACHE: Zapamiętuje listę gier z HDD APA, aby przyspieszyć późniejsze skanowania.
  HINT_BDMCACHE: Bufor odczytu z wyprzedzeniem dla USB i innych dysków BDM w grze. Większy może wygładzić strumieniowanie, ale zużywa więcej pamięci.
  HINT_HDDCACHE: Bufor odczytu z wyprzedzeniem dla wewnętrznego HDD w grze.
  HINT_SMBCACHE: Bufor odczytu z wyprzedzeniem dla SMB w grze.
  HINT_CORE_LOADER: Rdzeń dla tej gry tam, gdzie oba są obsługiwane. UDPFS/UDPBD tylko Neutrino; SMB/HTTP tylko <OPL>. Domyślne podąża za Uruchamianiem gier.
  HINT_DMA_MODE: Tryb transferu wewnętrznego HDD dla tej gry. Obniż go, jeśli gra się zacina lub zawiesza.
  HINT_DNAS_GAMEID: ID płyty dla gier online DNAS. Wczytaj z płyty odczytuje je z oryginalnej płyty.
  HINT_LOAD_FROM_DISC: Odczytuje ID DNAS z oryginalnej płyty w napędzie.
  HINT_ALTSTARTUP: Uruchamia ten ELF z obrazu płyty zamiast tego, który wskazuje SYSTEM.CNF.
  HINT_VMC_DEFINE: Wybierz, utwórz lub zmień rozmiar wirtualnej karty pamięci tego gniazda.
  HINT_VMC_ACTION: Użyj ogólnej daje temu gniazdu wspólną kartę; Resetuj czyści wybór.
  HINT_VMC_NAME: Nazwa pliku karty, przechowywanego w folderze VMC.
  HINT_VMC_CREATE: Tworzy kartę albo stosuje do niej nowy rozmiar.
  HINT_VMC_DELETE: Usuwa ten plik karty.
  HINT_SETTINGS_SOURCE: Globalne używa wspólnych ustawień; Dla gry zachowuje je tylko dla tej gry.
  HINT_PADMACRO_TOGGLE: Gdy przycisk wciśnięty spowalnia drążek tylko wtedy, gdy trzymasz przycisk; Przełączane przyciskiem włącza je i wyłącza.
  HINT_SFX: Efekty dźwiękowe menu.
  HINT_BOOT_SND: Odtwarza dźwięk przy starcie RiptOPL.
  HINT_BGM: Odtwarza muzykę motywu albo twój plik Domyślnej muzyki motywu.
  HINT_SFX_VOLUME: Głośność efektów dźwiękowych menu.
  HINT_BOOT_SND_VOLUME: Głośność dźwięku startowego.
  HINT_BGM_VOLUME: Głośność muzyki w tle.
  HINT_SCROLL: Jak szybko przewijają się listy, gdy trzymasz kierunek.
  HINT_SELECTBUTTON: 'Który przycisk zatwierdza: Krzyżyk czy Kółko.'
  HINT_XSENSITIVITY: Jak łatwo lewy drążek przesuwa kursor w lewo i w prawo. Wył. go ignoruje.
  HINT_YSENSITIVITY: Jak łatwo lewy drążek przesuwa kursor w górę i w dół. Wył. go ignoruje.
  HINT_PADEMU_GLOBAL: DualShock 3/4 przez USB lub Bluetooth oraz multitap, dla każdej gry.
  HINT_PADMACRO_GLOBAL: Spowolnienie drążka, odwrócenie osi i turbo, dla każdej gry.
  HINT_COVERFLOW_DIM: Przyciemnia boczne okładki.
  HINT_OSD_ENABLE: Przekazuje grze poniższe ustawienia. Wył. używa ustawień konsoli.
  HINT_OSD_TVASPECT: Kształt telewizora przekazywany grze.
  HINT_OSD_VMODE: Tryb obrazu przekazywany grze.
  DNAS_ID: ID DNAS
  NEUTRINO_PADEMU_WARN: Emulacja pada jest niedostępna z Neutrino. Użyj kontrolera PS2 albo źródła obsługującego rdzeń <OPL>.
  RA_MODE: Tryb RA
  RA_HOST_IP: IP pomocnika RA (0.0.0.0 = automatycznie)
