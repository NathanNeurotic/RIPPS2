  XERA_USE_LIBRARY: Przeglądaj tę grę przez bibliotekę RetroAchievements w menu głównym.
  XERA_OPEN_NETWORK: Nie można połączyć się z xeRAbora. Włącz OPEN TO THE NETWORK w jego ustawieniach, sprawdź IP pomocnika RA i zaporę PC.
  XERA_UNKNOWN_GAME: xeRAbora nie zna tego obrazu. Najpierw uruchom sprawdzanie obsługi gry RA.
  XERA_NOT_PLAYED: Jeszcze nie ma w twojej bibliotece RetroAchievements. Zagraj raz z osiągnięciami, a potem naciśnij Select.
  XERA_CONNECTION_ERROR: Nie można odczytać listy z xeRAbora. Naciśnij Select, aby spróbować ponownie.
  CAD_PAIR_UDPFS: Nie można połączyć się z Caduceus. Sparuj ART/CADUCEUS.KEY w folderze udostępnianym przez PS2-Servers i ustaw IP pomocnika RA.
  RA_WL_NOT_SAVED: Nie udało się zapisać listy śledzenia. Upewnij się, że urządzenie lub udział gry jest zapisywalny, a potem sprawdź ponownie.
