  UDPFS_IP_CONFLICT: ອຸປະກອນອື່ນ ໃນເຄືອຂ່າຍຂອງທ່ານ ໃຊ້ທີ່ຢູ່ IP ຂອງ PS2 ນີ້, ດັ່ງນັ້ນ ຄຳຕອບ ຂອງເຊີບເວີ UDPFS ໄປຫາມັນ. ຕັ້ງ IP ອື່ນ ໃຫ້ PS2 ໃນການຕັ້ງຄ່າເຄືອຂ່າຍ.
