  HINT_CFG_TITLES: ສະແດງ ຊື່ຈາກ CFG ຂອງແຕ່ລະເກມ ແທນຊື່ໄຟລ໌, ແລະ ຈັດລຽງຕາມມັນ. ອ່ານທຸກ CFG ເມື່ອລາຍຊື່ເອີ້ນຄືນໃໝ່, ດັ່ງນັ້ນ ລາຍຊື່ໂຫຼດຊ້າລົງ. ການສະແດງເທົ່ານັ້ນ.
