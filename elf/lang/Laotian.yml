  XERA_NOT_PLAYED: ຍັງບໍ່ຢູ່ໃນຫ້ອງສະໝຸດ RetroAchievements ຂອງທ່ານ. ຫຼິ້ນມັນ ໜຶ່ງເທື່ອ ພ້ອມຄວາມສຳເລັດ, ແລ້ວກົດ Select.
  XERA_CONNECTION_ERROR: ອ່ານລາຍຊື່ ຈາກ xeRAbora ບໍ່ໄດ້. ກົດ Select ເພື່ອລອງໃໝ່.
