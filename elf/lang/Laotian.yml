  HINT_COVERFLOW_SCALE: RIPFLOW ແຕ້ມໜ້າປົກທີ່ເລືອກ ໃຫຍ່ປານໃດ ທຽບກັບອັນອື່ນ.
  HINT_COVERFLOW_ANIM: ໜ້າປົກ ເລື່ອນໄວປານໃດ ເມື່ອທ່ານເລື່ອນໄປຕາມ flow.
  HINT_NARGS_QB: 'ບູດໄວ: ຂ້າມໜ້າເລີ່ມຕົ້ນ ຂອງ Neutrino. ເປີດຢູ່ນີ້, ມັນຖືກສົ່ງ ສຳລັບທຸກເກມ; ປິດ, RIPPS2 ຍັງສົ່ງມັນເອງ ສຳລັບເກມ USB, iLink ແລະ ເຄືອຂ່າຍ, ບ່ອນທີ່ຕ້ອງການ.'
  HINT_NARGS_DBC: 'ສີດີບັກ: Neutrino ເຕັມຈໍ ດ້ວຍສີ ໃນແຕ່ລະຂັ້ນການໂຫຼດ, ດັ່ງນັ້ນ ຮູບຖ່າຍ ສະແດງວ່າ ເກມຢຸດຢູ່ໃສ.'
  HINT_NARGS_LOGO: ສະແດງໂລໂກ້ PS2 ກ່ອນເກມ (ການເລີ່ມ IOP ໃໝ່ ເທື່ອທີສອງ, ເຊິ່ງບາງໄດຣຟ໌ iLink ຕ້ອງການ). ປິດຢູ່ນີ້, RIPPS2 ເຮັດຕາມ ການເປີດເກມ > ໂລໂກ້ PS2, ແລະ ບໍ່ເຄີຍສົ່ງມັນ ສຳລັບເກມ MMCE ຫຼື ເຄືອຂ່າຍ.
  HINT_NARGS_CWD: 'ໂຟນເດີ ທີ່ເກມເຫັນເປັນຂອງມັນເອງ. ວ່າງ: ຄ່າເລີ່ມຕົ້ນ ຂອງ Neutrino.'
  HINT_NARGS_CFG: 'ໄຟລ໌ການຕັ້ງຄ່າ Neutrino ຂອງທ່ານເອງ (-cfg). ວ່າງ: ຂອງ Neutrino.'
  HINT_NARGS_ELF: 'ເລີ່ມ ELF ນີ້ ແທນໄຟລ໌ບູດ ທີ່ແຜ່ນລະບຸ. ວ່າງ: ຂອງເກມເອງ.'
  HINT_NARGS_ATA0: ຮູບ HDD ທີ່ Neutrino ເມົາເປັນ HDD ພາຍໃນ ຂອງເຄື່ອງ, ສຳລັບເກມທີ່ໃຊ້ HDD (-ata0).
  HINT_NARGS_ATA0ID: ໄຟລ໌ ID ທີ່ຄູ່ກັບຮູບ HDD ນັ້ນ (-ata0id).
  HINT_NARGS_ATA1: ຮູບ HDD ທີສອງ (-ata1).
  RIPPS2_LAST_USED: ໃຊ້ຫຼ້າສຸດ
  RIPPS2_PAGE_BUTTONS: ປຸ່ມ ປ່ຽນໜ້າ
  HINT_RIPPS2_PAGE_BUTTONS: 'ປຸ່ມບ່າ ອັນໃດ ປ່ຽນໜ້າ ລາຍຊື່ເກມ. L2 / R2: ພວກມັນປ່ຽນໜ້າ ແລະ L1 / R1 ປ່ຽນໝວດ. L1 / R1: ພວກມັນປ່ຽນໜ້າ ແລະ L2 / R2 ປ່ຽນໝວດ. ທີມ: ທີມຕັດສິນ; ຖ້າບໍ່ມີ, L2 ໄປເທິງສຸດ ແລະ R2 ໄປທ້າຍ. L2 + R2 ພ້ອມກັນ ເລືອກເກມສຸ່ມສະເໝີ.'
  RIPPS2_IGR_MENU: ເມນູ ໃນເກມ
  HINT_RIPPS2_IGR_MENU: 'ເປີດ: L1+L2+R1+R2+SELECT+START ຢຸດເກມຊົ່ວຄາວ: ສືບຕໍ່, ອອກ, ຖ່າຍພາບໜ້າຈໍ, ເບິ່ງຜົນງານ ຫຼື ປິດເຄື່ອງ. ປິດ: ປຸ່ມລວມຈະອອກຈາກເກມທັນທີ ຄືເກົ່າ.'
  RIPPS2_BOOT_LOADER: ໂຕໂຫຼດບູດ
  HINT_RIPPS2_BOOT_LOADER: ສະແດງວ່າ ແຕ່ລະເມມໂມຣີກາດ ເລີ່ມຫຍັງ ຕອນເປີດເຄື່ອງ, ແລະ ຕິດຕັ້ງ BIBLE (PS2BBL ທີ່ຕັ້ງສຳລັບ RIPPS2). ໄຟລ໌ບູດເກົ່າ ຂອງກາດ ຖືກເກັບໄວ້.
