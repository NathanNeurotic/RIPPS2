  HINT_LOGOART: ສະແດງໂລໂກ້ ຂອງເກມ (<ID>_LGO) ເມື່ອທີມໃຊ້ມັນ. ປິດ ເຊື່ອງຮູບເລີ່ມຕົ້ນ ຂອງມັນນຳ, ແຕ່ເກັບ ໜ້າປົກ, ຮູບແຜ່ນ ແລະ ພື້ນຫຼັງໄວ້.
