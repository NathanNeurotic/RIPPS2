  RA_WL_NOT_SAVED: ບັນທຶກລາຍການຕິດຕາມ ບໍ່ໄດ້. ກວດໃຫ້ແນ່ໃຈ ວ່າອຸປະກອນ ຫຼື ແຊ ຂອງເກມ ຂຽນໄດ້, ແລ້ວກວດອີກ.
  RA_UDPFS_LOAD_FIRST: ເປີດໜ້າ UDPFS ໜຶ່ງເທື່ອ ເພື່ອໃຫ້ໂມດູນເຄືອຂ່າຍ ຂອງມັນໂຫຼດ, ແລ້ວລອງໃໝ່.
  CAD_UDPFS_IMG: 'ໂຕທ່ອງ Caduceus ຕ້ອງການ SMB ຫຼື UDPFS ໄຟລ໌: UDPFS IMG ບໍ່ມີໂຟນເດີທີ່ແບ່ງປັນ ສຳລັບກະແຈຂອງມັນ.'
