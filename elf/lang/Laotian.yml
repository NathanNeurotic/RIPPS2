  RIPPS2_ACHIEVEMENTS: ຄວາມສຳເລັດ
  RIPPS2_NBD_SERVER: ເຊີບເວີ NBD
  HINT_RIPPS2_NBD_SERVER: ແບ່ງປັນ ຮາດດິສ ກັບ PC ຜ່ານເຄືອຂ່າຍ. ໜ້າສະຖານະ ຢູ່ ໃນຂະນະທີ່ມັນເຮັດວຽກ.
  RIPPS2_START: ເລີ່ມ
  RIPPS2_COVER_ART: ໜ້າປົກ
  HINT_RIPPS2_COVER_ART: ດາວໂຫຼດໜ້າປົກ ສຳລັບທຸກເກມ PS2 ໃນລາຍຊື່ທີ່ເລີ່ມແລ້ວ ທີ່ຍັງບໍ່ມີ, ໄປໂຟນເດີ ART ຂອງໄດຣຟ໌ນັ້ນ, ຈາກ ps2-covers ຂອງ xlenore ເທິງ GitHub. ຕ້ອງການສາຍເຄືອຂ່າຍ ແລະ ອິນເຕີເນັດ.
  RIPPS2_DOWNLOAD: ດາວໂຫຼດ
  RIPPS2_GLYPHS: ສັນຍາລັກ D-pad
  HINT_RIPPS2_GLYPHS: 'ສັນຍາລັກ D-pad ຂ້າງຊື່ໄດຣຟ໌ ແລະ ຮູບແບບ. ຄ່ອຍໆ ປາກົດ ສະແດງພວກມັນ ເມື່ອທ່ານປ່ຽນ; ຄ່ອຍໆ ຫາຍໄປ ສະແດງພວກມັນ ເມື່ອໜ້າເປີດ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_COLOR_THEME: ທີມສີ
  HINT_RIPPS2_COLOR_THEME: 'ສີດຽວ ສຳລັບຫໍຄອຍ, ລູກແກ້ວ, ແກ້ວ, ເຄື່ອງຫຼິ້ນ CD ແລະ ໂຕທ່ອງໄຟລ໌, ໃນທັງສາມແຖບ. ທີມ: ທີມຕັດສິນ (ສີຟ້າ RIPPS2 ບ່ອນທີ່ມັນບໍ່ຕັດສິນ).'
  RIPPS2_HINTS: ຄຳແນະນຳ ປຸ່ມ
  HINT_RIPPS2_HINTS: 'ຄຳແນະນຳປຸ່ມ ຢູ່ລຸ່ມສຸດ. ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຊື່ອງພວກມັນ ຈົນທ່ານກົດປຸ່ມ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_CATEGORY_BAR: ແຖບໝວດ
  HINT_RIPPS2_CATEGORY_BAR: 'ເປີດແຜ່ນ, ບ່ອນເກັບຂໍ້ມູນ ແລະ ໄຟລ໌ໃນໜ່ວຍຄວາມຈຳ ຢູ່ເທິງສຸດ. ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຊື່ອງພວກມັນ ຈົນທ່ານກົດປຸ່ມ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_SOURCE_NAME: ຊື່ແຫຼ່ງ
  RIPPS2_STATUS: ສະຖານະ
  RIPPS2_SOURCE: ແຫຼ່ງ
  HINT_RIPPS2_SOURCE_NAME: 'ຊື່ແຫຼ່ງ ເທິງເກມ (ທຸກເກມ, ເກມ HDD ແລະ ອື່ນໆ). ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຮັດໃຫ້ມັນຈາງ ພ້ອມແຖບໝວດ; ປາກົດຂຶ້ນທັນທີ ສະແດງມັນໃຫຍ່ ກາງໜ້າແທນ, ຄືທີ່ L3 ບອກຊື່ລາຍຊື່, ໃນລາຍຊື່ທຳອິດ ຫຼັງເປີດເຄື່ອງ ແລະ ທຸກເທື່ອທີ່ແຫຼ່ງປ່ຽນ, ແລ້ວຈາງໄປ. ທີມ ເຮັດໃຫ້ ປາກົດຂຶ້ນທັນທີ ເປັນ ສະແດງ ຂອງມັນໄດ້. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_RECENTS: ສະແດງ ຫຼ້າສຸດ
  HINT_RIPPS2_RECENTS: ສູງສຸດເທົ່ານີ້ ຂອງເກມທີ່ເປີດຫຼ້າສຸດ ຢູ່ເທິງ ເກມທີ່ມັກ, ໃໝ່ສຸດກ່ອນ. 0 ປິດມັນ.
  RIPPS2_CATEGORY_ORDER: ລຳດັບໝວດ
  HINT_RIPPS2_CATEGORY_ORDER: 'ໄຟລ໌ໃນໜ່ວຍຄວາມຈຳ ກ່ອນ ແລະ ເປີດແຜ່ນ ທ້າຍ. ເຮັດສຳລັບ RIPFLOW (ໜ້າຕາ > ທີມ). ທີມ: ທີມຕັດສິນ.'
  RIPPS2_MUSIC: ເພງ
  HINT_RIPPS2_MUSIC: ຫຼິ້ນໄຟລ໌ bgm ໃນໂຟນເດີ AUDIO ຂ້າງ RIPPS2 ແລະ ໃນໂຟນເດີ AUDIO ຂອງ OPL ເທິງແຕ່ລະໄດຣຟ໌ທີ່ເລີ່ມ (Ogg ທີ່ບໍ່ມີແທັກ, ຫຼື WAV 16-bit); ອັນທີ່ຊື່ Menu ຫຼິ້ນກ່ອນ. ເພງຂອງທີມເອງ ຫຼິ້ນແທນ ຖ້າມີ.
  RIPPS2_BIOS_SOUNDS: ສຽງ BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'ຂຽນສຽງເມນູ ຂອງເຄື່ອງນີ້ເອງ ຈາກ BIOS ຂອງມັນ ໃສ່ໂຟນເດີ AUDIO ເປັນສຽງຂອງ RIPPS2 (ຕ່ຳກວ່າ 1 MB). ເພງເມນູ ແມ່ນການຖອດ ແຍກຕ່າງຫາກ: ເພງ BIOS.'
  RIPPS2_RIP: ຖອດ
  RIPPS2_HINTS_GLYPHS: ຄຳແນະນຳ ແລະ ສັນຍາລັກ
  HINT_RIPPS2_HINTS_GLYPHS: ຄຳແນະນຳປຸ່ມ ແລະ ສັນຍາລັກ ເບິ່ງຄືແນວໃດ. ແຕ່ລະແຖວ ເລີ່ມທີ່ ທີມ, ສິ່ງທີ່ທີມເລືອກ; ການເລືອກອື່ນ ເປັນຂອງທ່ານ ແລະ ມີສິດກ່ອນ ທຸກທີມ.
  RIPPS2_HINT_LAYOUT: ການຈັດ ຄຳແນະນຳ
  HINT_RIPPS2_STARSIDE: 'ບ່ອນທີ່ດາວຂອງເກມທີ່ມັກ ຢູ່ໃນລາຍຊື່. ຊ້າຍ: ຖັນຂອງມັນເອງ ຢູ່ຕົ້ນທຸກແຖວ. ຂວາ: ຫຼັງຊື່. ເຊື່ອງ: ບໍ່ມີດາວ. ທີມ: ຕາມທີ່ທີມກຳນົດ. ໄອຄອນແຖວຂອງທີມ ຈະຍ້າຍໄປອີກປາຍ ເພື່ອບໍ່ໃຫ້ຊ້ອນກັນ.'
  HINT_RIPPS2_HINT_LAYOUT: 'ແຖວ: ຄຳແນະນຳ ໃນແຖວດຽວ. ຖັນ: ໜຶ່ງຄຳແນະນຳ ຕໍ່ແຖວ, ລາຍການ ຢູ່ຂ້າງ, ເລີ່ມຈາກບ່ອນ ທີ່ທີມວາງຄຳແນະນຳ.'
  RIPPS2_HINT_LABELS: ປ້າຍ ຄຳແນະນຳ
  HINT_RIPPS2_HINT_LABELS: ສັນຍາລັກ ຢ່າງດຽວ ແຕ້ມແຕ່ປຸ່ມ, ສຳລັບສັນຍາລັກ ທີ່ມີຄຳຂອງມັນເອງ. ປ້າຍ ວາງສັນຍາລັກ ແລະ ຫົວຂໍ້ ຂອງແຕ່ລະຄຳແນະນຳ ນຳກັນ ເທິງປ້າຍດຽວ.
  RIPPS2_HINT_MENU: ຄຳແນະນຳ ເມນູ (START)
  RIPPS2_HINT_REFRESH: ຄຳແນະນຳ ເອີ້ນຄືນໃໝ່ (SELECT)
  RIPPS2_HINT_STAR: ຄຳແນະນຳ ໂປດ (R3)
  RIPPS2_HINT_VIEW: ຄຳແນະນຳ ມຸມມອງ (L3)
  HINT_RIPPS2_HINT_SHOW: ສະແດງ ຫຼື ເຊື່ອງ ຄຳແນະນຳນີ້. ປຸ່ມຂອງມັນ ເຮັດວຽກ ທັງສອງແບບ.
  RIPPS2_GLYPH_SET: ຊຸດສັນຍາລັກ
  HINT_RIPPS2_GLYPH_SET: 'ສັນຍາລັກປຸ່ມ ໃນທຸກໜ້າ: ຂອງທີມເອງ, ຂອງ RIPPS2, ມາດຕະຖານ (ປຸ່ມສີເຂັ້ມ, ສັນຍາລັກມີສີ) ຫຼື ຂາວ (ຂາວລ້ວນ).'
  RIPPS2_HINT_ORDER: ລຳດັບ ຄຳແນະນຳ
  HINT_RIPPS2_HINT_ORDER: ຈັດລຳດັບ ຄຳແນະນຳ. ທີມ ເກັບລຳດັບຂອງທີມ; ລຳດັບຂອງທ່ານ ແມ່ນອັນທີ່ຕັ້ງຢູ່ນີ້.
  RIPPS2_HINT_ORDER_FOLLOW: ລຳດັບ
  RIPPS2_GRID_LAYOUT: ການຈັດ ຕາຕະລາງ
  HINT_RIPPS2_GRID_LAYOUT: ໜ້າຕາຕະລາງ ໃສ່ໜ້າປົກໄດ້ ຈັກອັນ, ດ້ວຍໄລຍະຫ່າງ ຂອງ RIPPS2. ທີມ ເກັບອັນຂອງທີມເອງ.
  RIPPS2_LAUNCH_DISC: ແຜ່ນ ຕອນເປີດເກມ
  HINT_RIPPS2_LAUNCH_DISC: ແຜ່ນຂອງເກມ ເຂົ້າມາ ເມື່ອມັນເລີ່ມ. ປາກົດຂຶ້ນທັນທີ ຢຸດ ແລະ ຈາງ; ໝູນ ໝູນໄວຂຶ້ນເລື້ອຍໆ ຈົນເກມເລີ່ມ.
  RIPPS2_TRANSITION: ການປ່ຽນໜ້າ
  HINT_RIPPS2_TRANSITION: 'ໜ້າໃໝ່ ເຂົ້າມາແນວໃດ ເມື່ອທ່ານໄປໝວດອື່ນ: ຈາກສີພື້ນຫຼັງ ຂອງທີມ, ຫຼື ຈາກການກະພິບ. ທີມ ເກັບການເລືອກຂອງທີມ.'
  HINT_RIPPS2_VIGNETTE: ເຮັດໃຫ້ຂອບ ຂອງທຸກໜ້າປົກ ມືດລົງ ຍົກເວັ້ນອັນທີ່ເລືອກ, ເພື່ອໃຫ້ອັນທີ່ເລືອກ ເດັ່ນ. ອ່ອນ ແມ່ນເຄິ່ງໜຶ່ງ ຂອງ ເຕັມ.
  RIPPS2_GRID_WIDE: ການຈັດຕາຕະລາງ ຈໍກວ້າງ
  HINT_RIPPS2_GRID_WIDE: ໜ້າຕາຕະລາງ ເທິງພາບ 16:9 ເທົ່ານັ້ນ (ຈໍກວ້າງ, 720p, 1080i), ບ່ອນທີ່ໜ້າປົກ ແຄບລົງ ແລະ ໃສ່ໄດ້ຫຼາຍຂຶ້ນ. ທີມ ໃຊ້ອັນຂອງທີມ; ຄືກັນ ເຮັດຕາມ ການຈັດຕາຕະລາງ.
  RIPPS2_BGBLUR: ຄວາມມົວ ພື້ນຫຼັງ
  HINT_RIPPS2_BGBLUR: ແກ້ວຝ້າ ເຮັດໃຫ້ຮູບພື້ນຫຼັງ ຂອງເກມ ມົວແຮງປານໃດ. ທີມ ໃຊ້ຄ່າຂອງທີມເອງ (ອ່ອນ ເທິງ RIPGRID ແລະ Adapt).
  HINT_RIPPS2_HINT_SLOT: ຄຳແນະນຳ ໃນບ່ອນນີ້. ຄຳແນະນຳ ທີ່ເຄີຍຢູ່ນີ້ ຍ້າຍໄປບ່ອນເກົ່າ ຂອງຄຳແນະນຳທີ່ເລືອກ.
  PS1_SAVE_GUIDANCE: ເຊບ PS1 ຂຶ້ນກັບ Ember ຫຼື POPSTARTER; ການຕັ້ງຄ່າ VMC ຂອງ PS2 ບໍ່ໃຊ້.
  NEUTRINO_SHOW_ARGS: ສະແດງ ອາກິວເມັນເລີ່ມ
  HINT_NEUTRINO_SHOW_ARGS: ກ່ອນເລີ່ມ Neutrino ແຕ່ລະເທື່ອ, ສະແດງທຸກອາກິວເມັນ ທີ່ Neutrino ຈະໄດ້ຮັບ ແລະ ຖາມວ່າ ສືບຕໍ່ ບໍ. ກັບຄືນ ກັບໄປເມນູ ໂດຍບໍ່ເລີ່ມ.
  NEUTRINO_ARGS_CONFIRM: Neutrino ຈະເລີ່ມ ດ້ວຍອາກິວເມັນເຫຼົ່ານີ້. ເລີ່ມ ບໍ?
  HINT_NARGS_EXTRA: ແຟລັກ Neutrino ອື່ນ, ແຍກດ້ວຍຍະຫວ່າງ, ສົ່ງຫຼັງທຸກຢ່າງ ຂ້າງເທິງ. RIPPS2 ເພີ່ມສະເໝີ -bsd ແລະ -dvd ສຳລັບໄດຣຟ໌ ແລະ ISO ຂອງເກມ, -mc0 ແລະ -mc1 ສຳລັບ VMC ຂອງມັນ, -gsm ສຳລັບໂໝດວິດີໂອ ຂອງມັນ, ແລະ ໂໝດຄວາມເຂົ້າກັນໄດ້ ຂອງເກມເອງ. ແຟລັກທີ່ມີແຖວ ຂອງມັນເອງ ຂ້າງເທິງ (ເຊັ່ນ -logo) ຍ້າຍໄປແຖວນັ້ນ ຕອນບັນທຶກ, ແລະ ຍັງຖືກສົ່ງ.
  HINT_RIPPS2_THEME: ໜ້າຕາ ຂອງທຸກໜ້າ. ໃນລາຍຊື່ເກມ, ກົດ SELECT ຄ້າງໄວ້ 4.2 ວິນາທີ ເພື່ອປ່ຽນໄປທີມຕໍ່ໄປ; ການກົດ SELECT ໄວໆ ຍັງເອີ້ນລາຍຊື່ຄືນໃໝ່.
  GAME_TYPE_LABELS: ສະແດງປ້າຍ [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: ບັນທຶກລາຍການສູດໂກງ ໃສ່ໂຟນເດີ Neutrino ບໍ່ໄດ້, ດັ່ງນັ້ນ Neutrino ໃຊ້ມັນບໍ່ໄດ້. ເລີ່ມ ໂດຍບໍ່ມີສູດໂກງ ບໍ?
  AUTO_CREATE_VMC: ສ້າງ VMC ຕອນເປີດເທື່ອທຳອິດ
  HINT_AUTO_CREATE_VMC: ການເປີດເກມ PS2 ທີ່ບໍ່ມີ VMC ໃນຊ່ອງ 1 ຈະສ້າງກາດ 8 MB ເທິງອຸປະກອນຂອງເກມ, ຕັ້ງຊື່ຕາມ ທີ່ໜ້າ VMC ແນະນຳ (ໃຊ້ຮ່ວມກັນ ທຸກແຜ່ນ ຂອງເກມ), ແລະ ກຳນົດມັນ. ບໍ່ແມ່ນສຳລັບ HDD ພາຍໃນ ພາຍໃຕ້ Neutrino.
  AUTO_VMC_CREATING: ກຳລັງສ້າງ VMC ຂອງເກມນີ້...
  AUTO_VMC_FAILED: ສ້າງ VMC ຂອງເກມນີ້ ບໍ່ໄດ້. ເກມເລີ່ມ ໂດຍບໍ່ມີມັນ.
  RIPPS2_BIOS_MUSIC: ເພງ BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'ຂຽນເພງເມນູ ຂອງເຄື່ອງນີ້ (ເພງບັນຍາກາດ ຂອງໂຕທ່ອງ, ປະມານ 15 MB ເປັນ WAV) ໃສ່ໂຟນເດີ AUDIO ທີ່ທ່ານເລືອກ: ຂ້າງ RIPPS2, ຫຼື ຂອງ OPL ເທິງໄດຣຟ໌ທີ່ເລີ່ມ. ໃຫຍ່ເກີນ ສຳລັບເມມໂມຣີກາດ. ຂະໜາດຂອງມັນ ສະແດງກ່ອນ.'
  SAVE_ICONS: ໄອຄອນເຊບ 3D
  HINT_SAVE_ICONS: ສະແດງໄອຄອນເຊບ ຂອງເກມທີ່ເລືອກ, ໝູນຢູ່, ບ່ອນທີ່ທີມມີບ່ອນໃຫ້ມັນ. ອ່ານ VMC ຂອງເກມເອງ ກ່ອນ, ແລ້ວ ເມມໂມຣີກາດ.
  NETBOOT_RESTART_NOW: ໂປໂຕຄອນເຄືອຂ່າຍ ປ່ຽນ ຫຼັງເລີ່ມໃໝ່. ບັນທຶກການຕັ້ງຄ່າ ແລະ ເລີ່ມ OPL ໃໝ່ ດຽວນີ້ ບໍ?
  HINT_NET_PROTOCOL: 'ບໍລິການເຄືອຂ່າຍ ທີ່ RiptOPL ໃຊ້: ແຊ SMB, UDPFS, UDPBD ຫຼື HTTP. ການຕັ້ງຄ່າດຽວກັນ ກັບໃນ ແຫຼ່ງເກມ. ການປ່ຽນຈາກອັນທີ່ກຳລັງເຮັດວຽກ ຕ້ອງເລີ່ມໃໝ່.'
  HINT_UDPFS_ACCESS: UDPFS ເທົ່ານັ້ນ. ໄຟລ໌ ອ່ານ ISO ແຍກ ຈາກໂຟນເດີເກມ ຂອງເຊີບເວີ; IMG ອ່ານຮູບດິສ ເປັນໄດຣຟ໌. SMB ແລະ HTTP ໃຊ້ ໄຟລ໌ ສະເໝີ, UDPBD ໃຊ້ IMG ສະເໝີ.
  HINT_SMB_VERSION: ເວີຊັນ SMB ທີ່ໃຊ້ ສື່ສານກັບແຊ ຂອງ PC.
  HINT_NET_ADVANCED: ປົດລັອກ ໂໝດລິ້ງ Ethernet ແລະ ພອດ SMB ເພື່ອແກ້ໄຂ.
  HINT_ETH_LINK_MODE: ບັງຄັບ ຄວາມໄວ ແລະ duplex ຂອງລິ້ງເຄືອຂ່າຍ. ປ່ອຍເປັນ Auto ເວັ້ນແຕ່ລິ້ງ ຂາດເລື້ອຍໆ.
  HINT_IP_ADDR_TYPE: ຄົງທີ່ ໃຊ້ທີ່ຢູ່ ຂ້າງລຸ່ມ; DHCP ຖາມ ເຣົາເຕີ ຂອງທ່ານ. UDPFS ແລະ UDPBD ໃຊ້ ຄົງທີ່ ສະເໝີ.
  HINT_PS2_IP: ທີ່ຢູ່ IP ຂອງ PS2 ເອງ. ເລືອກອັນທີ່ບໍ່ມີອຸປະກອນອື່ນໃຊ້, ໃນຊ່ວງດຽວກັນ ກັບ PC ຂອງທ່ານ.
  HINT_NETMASK: Subnet mask, ປົກກະຕິ 255.255.255.0.
  HINT_GATEWAY: ທີ່ຢູ່ ເຣົາເຕີຂອງທ່ານ, ປົກກະຕິ ສາມຕົວເລກທຳອິດ ຄືກັນ ລົງທ້າຍດ້ວຍ .1.
  HINT_DNS: ທີ່ຢູ່ ເຊີບເວີ DNS. ປົກກະຕິ ຄືກັບ gateway.
