  : ' RIPPS2 ຕິດຕັ້ງ BIBLE ໄດ້, ຄື PS2BBL 1.2.0 ທີ່ຕັ້ງໃຫ້ເລີ່ມ RIPPS2, ເທິງເມມໂມຣີກາດ; ສິ່ງທີ່ເລີ່ມຈາກມັນດຽວນີ້ ຈະຖືກເກັບໄວ້ ໃນໂຟນເດີສຳຮອງ. ຕິດຕັ້ງ BIBLE ບໍ?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' ໂປຣແກຣມບູດເກົ່າ ຂອງ HDD ຖືກເກັບໄວ້ (ຈັດການ > ກູ້ຄືນ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' ເຄື່ອງ ບໍ່ຮັບການຕັ້ງຄ່າ ທີ່ເລີ່ມ HDD ຂອງມັນ ຕອນເປີດເຄື່ອງ: ຕັ້ງມັນດ້ວຍເຄື່ອງມື HDD, ຫຼື ຕິດຕັ້ງໃໝ່.'
  ' What was there before is kept in mc%d:/%s%s.': ' ສິ່ງທີ່ເຄີຍຢູ່ນັ້ນ ຖືກເກັບໄວ້ໃນ mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' ການຕັ້ງຄ່າ PS2BBL ຂອງທ່ານເອງ ຖືກເກັບໄວ້ (%s), ຕັ້ງ BOOT LOCK ໃນມັນແລ້ວ: ປຸ່ມຕ່າງໆ ຂອງມັນ ຄືທີ່ທ່ານຕັ້ງ.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' ການຕັ້ງຄ່າ PS2BBL ຂອງທ່ານເອງ ຖືກເກັບໄວ້, ຕັ້ງ BOOT LOCK ໃນມັນແລ້ວ.'
  ? '(Removed a SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it.)

    '
  : '(ໄດ້ລົບ SYS-CONF/PS2BBL.INI ທີ່ບິວ 68 ຂຽນໄວ້ ສຳລັບໂຕໂຫຼດ ທີ່ບໍ່ເຄີຍອ່ານມັນ.)

    '
  ', for another console model': ', ສຳລັບເຄື່ອງ ລຸ້ນອື່ນ'
  ', starts at power on': ', ເລີ່ມ ຕອນເປີດເຄື່ອງ'
  ', then ': ', ແລ້ວ '
  ? '- %s (%s) moves to a backup folder first, whole.

    '
  : '- %s (%s) ຖືກຍ້າຍ ທັງໝົດ ໄປໂຟນເດີສຳຮອງ ກ່ອນ.

    '
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- ເຄື່ອງ ຜູກ PS2BBL 1.2.0 ກັບກາດນີ້ ແລະ ຂຽນເປັນ %s/%s.

    - ການຕັ້ງຄ່າຂອງມັນ, mc%d:/PS2BBL/CONFIG.INI, ເລີ່ມ RIPPS2 ຈາກ %s, BOOT LOCK ເປີດ.

    ໂປຣເຊັສເຊີ I/O ຈະເລີ່ມໃໝ່ ສຳລັບສິ່ງນີ້; ເພງ ແລະ ໄດຣຟ໌ ກັບມາຫຼັງຈາກນັ້ນ. ໃສ່ກາດໄວ້ ແລະ ເປີດເຄື່ອງໄວ້ ຈົນກວ່າຈະຂຶ້ນວ່າ ແລ້ວ.'
  ? '- RIPPS2 is copied to %s.

    '
  : '- RIPPS2 ຖືກສຳເນົາໄປ %s.

    '
  A COPY ON MEMORY CARD %d: ສຳເນົາ ເທິງເມມໂມຣີກາດ %d
  A COPY ON MX4SIO: ສຳເນົາ ເທິງ MX4SIO
  A COPY ON THE USB DRIVE: ສຳເນົາ ເທິງ USB
  BIBLE could not be written to memory card %d, so the card was put back as it was. Check its free space, then try again.: ຂຽນ BIBLE ໃສ່ເມມໂມຣີກາດ %d ບໍ່ໄດ້, ດັ່ງນັ້ນ ກາດຖືກຄືນເປັນຄືເກົ່າ. ກວດບ່ອນວ່າງ ຂອງມັນ, ແລ້ວລອງໃໝ່.
  BIBLE could not copy RIPPS2 to %s. Check the space and that it is not write protected. Nothing else was changed.: BIBLE ສຳເນົາ RIPPS2 ໄປ %s ບໍ່ໄດ້. ກວດບ່ອນວ່າງ ແລະ ວ່າມັນບໍ່ໄດ້ຖືກປ້ອງກັນການຂຽນ. ບໍ່ມີຫຍັງອື່ນ ຖືກປ່ຽນ.
  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE ສຳເນົາ RIPPS2 ໄປພາທິຊັນ %s ຂອງ HDD ບໍ່ໄດ້. ກວດບ່ອນວ່າງ ຂອງມັນ. ບໍ່ມີຫຍັງອື່ນ ຖືກປ່ຽນ.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE ເກັບສຳເນົາ ໂປຣແກຣມບູດ ຂອງ HDD ບໍ່ໄດ້, ດັ່ງນັ້ນ ມັນຢຸດ ກ່ອນປ່ຽນມັນ. RIPPS2 ຖືກສຳເນົາ ໄປ HDD ແລ້ວ; ບໍ່ມີຫຍັງອື່ນ ຖືກປ່ຽນ.
  BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed.: BIBLE ຍ້າຍ %s ອອກ ເພື່ອເກັບມັນ ບໍ່ໄດ້, ດັ່ງນັ້ນ ມັນຢຸດຢູ່ນັ້ນ. ບໍ່ມີຫຍັງ ເທິງກາດ ຖືກປ່ຽນ.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE ຂຽນການຕັ້ງຄ່າຂອງມັນ ບໍ່ໄດ້ (%s). ໂປຣແກຣມບູດ ບໍ່ໄດ້ຖືກປ່ຽນ.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE ຂຽນໂປຣແກຣມບູດ ຂອງ HDD ບໍ່ໄດ້ (ຂັ້ນ %d). %s
  ? 'BIBLE is installed on memory card %d (mc%d:/%s/%s) and BOOT LOCK is on: at power on the console starts RIPPS2 from %s, at once.'
  : 'BIBLE ຖືກຕິດຕັ້ງ ເທິງເມມໂມຣີກາດ %d (mc%d:/%s/%s) ແລະ BOOT LOCK ເປີດ: ຕອນເປີດເຄື່ອງ ເຄື່ອງຈະເລີ່ມ RIPPS2 ຈາກ %s, ທັນທີ.'
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE ຖືກຕິດຕັ້ງ ເທິງ HDD ພາຍໃນ ແລະ BOOT LOCK ເປີດ: ຕອນເປີດເຄື່ອງ ເຄື່ອງຈະເລີ່ມ RIPPS2 ຈາກ %s%s%s%s, ທັນທີ. ການຕັ້ງຄ່າ: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE ຢູ່ເທິງເມມໂມຣີກາດ %d, ແຕ່ຂຽນການຕັ້ງຄ່າຂອງມັນ (%s) ບໍ່ໄດ້, ດັ່ງນັ້ນ ມັນເລີ່ມໂຕທ່ອງ. ເຮັດໃຫ້ມີບ່ອນວ່າງ ແລ້ວ ເປີດ ຈັດການ ອີກຄັ້ງ ເພື່ອໃຫ້ແລ້ວ.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE ໜ່ວຍຄວາມຈຳໝົດ ກ່ອນມັນເລີ່ມ. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE ໜ່ວຍຄວາມຈຳໝົດ. ບໍ່ມີຫຍັງ ເທິງເມມໂມຣີກາດ ຖືກປ່ຽນ.
  'BIBLE: binding PS2BBL to the memory card': 'BIBLE: ກຳລັງຜູກ PS2BBL ກັບເມມໂມຣີກາດ'
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: ກຳລັງສຳເນົາ RIPPS2 ໄປ %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: ກຳລັງເກັບ ໂປຣແກຣມບູດ ຂອງ HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: ກຳລັງໃສ່ ໂປຣແກຣມບູດ ຂອງ HDD ຄືນ'
  'BIBLE: restarting the I/O processor with the security module': 'BIBLE: ກຳລັງເລີ່ມໂປຣເຊັສເຊີ I/O ໃໝ່ ດ້ວຍໂມດູນຄວາມປອດໄພ'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: ກຳລັງຂຽນ PS2BBL ໃສ່ພື້ນທີ່ບູດ ຂອງ HDD'
  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK ຂຽນການຕັ້ງຄ່າ PS2BBL ບໍ່ໄດ້. ກວດວ່າ ເມມໂມຣີກາດ ຫຼື ໄດຣຟ໌ ບໍ່ໄດ້ຖືກປ້ອງກັນການຂຽນ, ແລ້ວລອງໃໝ່.
  BOOT LOCK found no PS2BBL config to change.: BOOT LOCK ບໍ່ພົບການຕັ້ງຄ່າ PS2BBL ທີ່ຈະປ່ຽນ.
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: BOOT LOCK ປິດ. PS2BBL ເລີ່ມສິ່ງທີ່ມັນເຄີຍເລີ່ມ (%s).
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK ເປີດ. PS2BBL ດຽວນີ້ເລີ່ມ RIPPS2 ຕອນເປີດເຄື່ອງ (%s). ກົດປຸ່ມລັດ PS2BBL ຄ້າງໄວ້ ຕອນເຄື່ອງເລີ່ມ ເພື່ອໄປສິ່ງອື່ນ.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK ເຮັດວຽກຜ່ານ PS2BBL (PlayStation 2 Basic BootLoader), ແລະ ບໍ່ມີເທິງເມມໂມຣີກາດໃດ ຢູ່ນີ້.
  INSTALL BIBLE: ຕິດຕັ້ງ BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'ຕິດຕັ້ງ BIBLE ເທິງເມມໂມຣີກາດ %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'ຕິດຕັ້ງ BIBLE ເທິງ HDD ພາຍໃນ

    - RIPPS2 ຖືກສຳເນົາໄປ %s.

    - ໂປຣແກຣມບູດຂອງ HDD ທີ່ຢູ່ໃນ __mbr ດຽວນີ້ ຖືກອ່ານ ແລະ ເກັບໄວ້ໃນ %s/RIPPS2 (ກູ້ຄືນ ໃສ່ມັນຄືນ).

    - ບິວ HDD ຂອງ PS2BBL 1.2.0 ຖືກຂຽນແທນທີ່, ແລະ ເຄື່ອງຖືກຕັ້ງໃຫ້ເລີ່ມມັນ ຕອນເປີດເຄື່ອງ.

    - ການຕັ້ງຄ່າຂອງມັນ (%s) ເລີ່ມ RIPPS2 ຈາກ %s ກ່ອນ%s%s, BOOT LOCK ເປີດ.

    ສິ່ງນີ້ ຕ້ອງການເຄື່ອງທີ່ບູດຈາກ HDD ຂອງມັນ (PS2 ລຸ້ນໜາ ທີ່ມີອະແດັບເຕີເຄືອຂ່າຍ). ເປີດເຄື່ອງໄວ້ ຈົນກວ່າຈະຂຶ້ນວ່າ ແລ້ວ.'
  INTERNAL HDD  (its boot area): HDD ພາຍໃນ  (ພື້ນທີ່ບູດ ຂອງມັນ)
  MEMORY CARD %d  (%s): ເມມໂມຣີກາດ %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'ເມມໂມຣີກາດ 0: %s

    ເມມໂມຣີກາດ 1: %s

    %s

    BIBLE ແມ່ນ PS2BBL 1.2.0 ໂດຍ El Isra, ຕັ້ງໂດຍ RIPPS2: ບໍ່ຕ້ອງລໍຖ້າ ຕອນເປີດເຄື່ອງ, RIPPS2 ກ່ອນ, ແລະ ປຸ່ມທີ່ກົດຄ້າງໄວ້ ຕອນເປີດເຄື່ອງ ຍັງພາໄປ ໂຕທ່ອງ (ສາມຫຼ່ຽມ), ແຜ່ນ (START) ແລະ ສິ່ງທີ່ເຄີຍຢູ່ (ວົງມົນ). ຕິດຕັ້ງ ຫຼື ສ້ອມແປງມັນ ເທິງເມມໂມຣີກາດ ຫຼື HDD ພາຍໃນ ບໍ?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: ເມມໂມຣີກາດ %d ມີບ່ອນວ່າງ %d KB, ແລະ BIBLE ຕ້ອງການ %d KB ຢູ່ນັ້ນ. ເຮັດໃຫ້ມີບ່ອນວ່າງ, ແລ້ວລອງໃໝ່.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: ເມມໂມຣີກາດ %d ມີບ່ອນວ່າງ %d KB, ແລະ ສຳເນົາ RIPPS2 ຕ້ອງການ %d KB. ເຮັດໃຫ້ມີບ່ອນວ່າງ ຫຼື ເລືອກບ່ອນອື່ນ.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: ເມມໂມຣີກາດ %d ເລີ່ມ %s ຕອນເປີດເຄື່ອງ, ແລະ BOOT LOCK ເຮັດວຽກ ຜ່ານ PS2BBL ເທົ່ານັ້ນ.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 ເລີ່ມ RIPPS2 ຈາກບ່ອນທີ່ມັນຢູ່ດຽວນີ້ ບໍ່ໄດ້ (ມັນເຂົ້າເຖິງ ເມມໂມຣີກາດ, USB ແລະ MX4SIO). ໂຕໂຫຼດບູດ > ຈັດການ ສຳເນົາ RIPPS2 ໄປເມມໂມຣີກາດ ຫຼື USB ໃຫ້ມັນໄດ້.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL ເລີ່ມໂປຣແກຣມ ຈາກເມມໂມຣີກາດ, USB ຫຼື MX4SIO, ແລະ RIPPS2 ອ່ານໂຕເອງ ເພື່ອສຳເນົາໄປນັ້ນ ບໍ່ໄດ້. ເລີ່ມ RIPPS2 ຈາກອັນໃດອັນໜຶ່ງ ໃນນັ້ນ, ແລ້ວລອງໃໝ່.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ໃສ່ ໂປຣແກຣມບູດເກົ່າ ຂອງ HDD ຄືນ

    ອັນທີ່ BIBLE ເກັບໄວ້ (RIPPS2/MBR-BACKUP.KELF ເທິງ HDD) ກັບໄປ __mbr, ແທນທີ່ BIBLE. RIPPS2 ແລະ ການຕັ້ງຄ່າ PS2BBL ຢູ່ບ່ອນເກົ່າ.'
  RESTORE: ກູ້ຄືນ
  RESTORE THE HDD'S OLD BOOT PROGRAM: ກູ້ຄືນ ໂປຣແກຣມບູດເກົ່າ ຂອງ HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 ບອກພາກພື້ນ ຂອງເຄື່ອງນີ້ ຈາກ ROM ຂອງມັນ ບໍ່ໄດ້, ດັ່ງນັ້ນ ມັນບໍ່ຮູ້ວ່າ ອ່ານໂຟນເດີອັບເດດລະບົບ ອັນໃດ. ບໍ່ໄດ້ຕິດຕັ້ງ BIBLE.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 ເປີດພາທິຊັນ __sysconf ຫຼື __common ຂອງ HDD ບໍ່ໄດ້ (ຂໍ້ຜິດພາດ %d), ດັ່ງນັ້ນ BIBLE ບໍ່ມີບ່ອນເກັບ RIPPS2 ແລະ ການຕັ້ງຄ່າຂອງມັນ ຢູ່ນັ້ນ. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 ອ່ານໂປຣແກຣມບູດ ທີ່ເກັບໄວ້ ບໍ່ໄດ້. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 ຂຽນໂປຣແກຣມບູດ ຄືນ ບໍ່ໄດ້. ລອງໃໝ່; ສຳເນົາທີ່ເກັບໄວ້ ບໍ່ຖືກແຕະຕ້ອງ.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 ກຳລັງອ່ານໄດຣຟ໌ຢູ່ ແລະ ເລີ່ມໂປຣເຊັສເຊີ I/O ໃໝ່ ບໍ່ໄດ້. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ: ລອງໃໝ່ ໃນອີກຈັກໜ່ອຍ.'
  Reading the memory cards: ກຳລັງອ່ານ ເມມໂມຣີກາດ
  The HDD partition BIBLE uses went away. Nothing was changed.: ພາທິຊັນ HDD ທີ່ BIBLE ໃຊ້ ຫາຍໄປ. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: ໂປຣແກຣມບູດເກົ່າ ຂອງ HDD ກັບມາແລ້ວ. BIBLE ບໍ່ເລີ່ມຈາກ HDD ອີກ.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : ເຄື່ອງ ບໍ່ຍອມຜູກ BIBLE ກັບເມມໂມຣີກາດ %d (ຂັ້ນ MagicGate ລົ້ມເຫຼວ). ບໍ່ມີຫຍັງ ເທິງກາດ ຖືກປ່ຽນ. ກາດທີ່ບໍ່ແມ່ນຂອງແທ້ ຫຼື ບໍ່ເຂົ້າກັບ MagicGate ເກັບອັບເດດລະບົບ ບໍ່ໄດ້.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'ອັນທີ່ເຄີຍຢູ່ ຖືກເກັບໄວ້ໃນ RIPPS2/MBR-BACKUP.KELF ເທິງ HDD: ໂຕໂຫຼດບູດ > ຈັດການ > ກູ້ຄືນ ໃສ່ມັນຄືນ.'
  The security module would not start on this console. Nothing on the memory card was changed.: ໂມດູນຄວາມປອດໄພ ບໍ່ຍອມເລີ່ມ ເທິງເຄື່ອງນີ້. ບໍ່ມີຫຍັງ ເທິງເມມໂມຣີກາດ ຖືກປ່ຽນ.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'ບໍ່ມີ ເມມໂມຣີກາດ PS2 ທີ່ຟໍແມັດແລ້ວ ໃນຊ່ອງໃດ, ແລະ ບໍ່ມີ HDD ພາຍໃນ. BIBLE ຢູ່ເທິງ ເມມໂມຣີກາດ ຫຼື HDD: ໃສ່ກາດ, ແລ້ວລອງໃໝ່.'
  There is no kept boot program on this HDD. Nothing was changed.: ບໍ່ມີ ໂປຣແກຣມບູດທີ່ເກັບໄວ້ ເທິງ HDD ນີ້. ບໍ່ມີຫຍັງ ຖືກປ່ຽນ.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
