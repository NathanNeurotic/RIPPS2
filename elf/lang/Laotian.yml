  NEUTRINO_DVR_QUICKBOOT: ການເລີ່ມ DVR ຕ້ອງການ ການປ່ຽນໄປໂໝດ PSX. ເອົາ -qb ອອກ ຈາກອາກິວເມັນ Neutrino ລວມ ແລະ ຂອງແຕ່ລະເກມ.
  NEUTRINO_DVR_FILE_MISSING: 'ການຕິດຕັ້ງ Neutrino ສຳລັບ DVR ບໍ່ຄົບ. ຂາດໄຟລ໌ທີ່ຕ້ອງການ:'
