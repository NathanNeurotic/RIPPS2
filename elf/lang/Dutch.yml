  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'BIBLE INSTALLEREN OP DE INTERNE HDD

    - RIPPS2 wordt gekopieerd naar %s.

    - Het opstartprogramma van de HDD dat nu in __mbr staat, wordt uitgelezen en bewaard in %s/RIPPS2 (HERSTELLEN zet het terug).

    - De HDD-build van PS2BBL 1.2.0 wordt op die plek geschreven en de console wordt ingesteld om hem bij aanzetten te starten.

    - De configuratie ervan (%s) start RIPPS2 eerst vanaf %s%s%s, BOOT LOCK aan.

    Hiervoor is een console nodig die vanaf de HDD opstart (een dikke PS2 met de netwerkadapter). Laat hem aan tot er klaar staat.'
