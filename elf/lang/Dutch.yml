  : 'GEHEUGENKAART 0: %s

    GEHEUGENKAART 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 van El Isra, ingesteld door RIPPS2: geen wachttijd bij aanzetten, eerst RIPPS2, en een knop die je bij aanzetten ingedrukt houdt, bereikt nog steeds de browser (DRIEHOEK), een schijf (START) en wat er eerst stond (CIRKEL). Installeren of repareren op een geheugenkaart of de interne HDD?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Geheugenkaart %d heeft %d KB vrij en BIBLE heeft daar %d KB nodig. Maak wat ruimte vrij en probeer het opnieuw.
