  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Geheugenkaart %d start %s bij aanzetten, en BOOT LOCK werkt alleen via PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 kan RIPPS2 niet starten vanaf de plek waar het nu staat (het bereikt geheugenkaarten, USB-sticks en MX4SIO). OPSTARTLADER > BEHEREN kan RIPPS2 ervoor naar een geheugenkaart of USB-stick kopiëren.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL start programma's vanaf een geheugenkaart, een USB-stick of MX4SIO, en RIPPS2 kon zichzelf niet lezen om daarheen te kopiëren. Start RIPPS2 vanaf een van die en probeer het opnieuw.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'HET OUDE OPSTARTPROGRAMMA VAN DE HDD TERUGZETTEN

    Het programma dat BIBLE bewaarde (RIPPS2/MBR-BACKUP.KELF op de HDD) gaat terug in __mbr, op de plek van BIBLE. RIPPS2 en de PS2BBL-configuratie blijven waar ze zijn.'
