  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 weet niet waar zijn map is, dus er is geen plek voor de geluiden.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 speelt de menumuziek van deze console, het sfeerstuk van de browser (%d:%02d), af met de eigen noten van de BIOS en schrijft die als WAV van %s naar %s; geen geheugenkaart heeft er ruimte voor. Een %s die er al staat, wordt vervangen. Het duurt een minuut of twee.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 speelt de menumuziek van deze console, het sfeerstuk van de browser (%d:%02d), af met de eigen noten van de BIOS en schrijft die als WAV van %s; geen geheugenkaart heeft er ruimte voor. Bevestigen schrijft hem naar %s, naast RIPPS2. START schrijft hem naar %s, de resources van OPL op die schijf. Een %s die er al staat, wordt vervangen. Het duurt een minuut of twee.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 leest de geluiden uit de eigen BIOS van deze console en schrijft ze als zijn eigen geluiden naar %s: cursor, bevestigen, annuleren, pagina''s, categorie, berichten, schijf, fout, opslaan, schijven en willekeurig, plus de opstart- en gamestartmuziek, gespeeld met de eigen noten van de BIOS. Bestanden met die namen die er al staan, worden vervangen.'
