  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: موسيقى القائمة (%s) موجودة في %s باسم %s. تظهر في إعدادات الصوت > الموسيقى باسم Menu؛ وتُعزف عندما لا يُختار أي مقطع آخر.
  The menu music could not be written to %s (%s). Is the drive full?: تعذّرت كتابة موسيقى القائمة في %s (%s). هل المحرك ممتلئ؟
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'موسيقى القائمة ملف WAV بحجم %s، ولا توجد بطاقة ذاكرة تتسع لها. يعمل RIPPS2 هنا من بطاقة ذاكرة ولا يوجد محرك مشغّل به مجلد OPL: شغّل محركاً من التخزين، ثم استخرج الموسيقى إليه.'
  The sounds could not be written to %s. Is the drive full or write-protected?: تعذّرت كتابة الأصوات في %s. هل المحرك ممتلئ أو محمي من الكتابة؟
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: موسيقى قائمة هذا الـ BIOS ليست التي يعرفها RIPPS2. لم يُكتب شيء.
