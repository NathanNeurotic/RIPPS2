  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' اضغط مطولاً على المثلث للمتصفح، وSTART للقرص. الإعدادات: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL 1.2.0 set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' يستطيع RIPPS2 تثبيت BIBLE، وهو PS2BBL 1.2.0 مضبوط لتشغيل RIPPS2، على بطاقة ذاكرة؛ وما يُشغَّل منها الآن يُحفظ في مجلد نسخة احتياطية. هل تريد تثبيت BIBLE؟'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' يُحتفظ ببرنامج الإقلاع القديم للقرص الصلب (إدارة > استعادة).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' لم يقبل الجهاز الإعداد الذي يشغّل قرصه الصلب عند التشغيل: اضبطه بأداة القرص الصلب، أو ثبّت مجدداً.'
  ' What was there before is kept in mc%d:/%s%s.': ' ما كان موجوداً سابقاً محفوظ في mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' أُبقي على إعدادات PS2BBL الخاصة بك (%s)، وضُبط فيها BOOT LOCK: أزرارها كما ضبطتها.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' أُبقي على إعدادات PS2BBL الخاصة بك، وضُبط فيها BOOT LOCK.'
  ? '(Removed a SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it.)

    '
  : '(أُزيل ملف SYS-CONF/PS2BBL.INI الذي كتبه البناء 68 لمحمّل لا يقرؤه أبداً.)

    '
  ', for another console model': ، لطراز جهاز آخر
  ', starts at power on': ، يبدأ عند التشغيل
  ', then ': '، ثم '
  ? '- %s (%s) moves to a backup folder first, whole.

    '
  : '- يُنقل %s (%s) أولاً بالكامل إلى مجلد نسخة احتياطية.

    '
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- يربط الجهاز PS2BBL 1.2.0 بهذه البطاقة ويُكتب باسم %s/%s.

    - إعداداته، mc%d:/PS2BBL/CONFIG.INI، تشغّل RIPPS2 من %s، مع تفعيل BOOT LOCK.

    يُعاد تشغيل معالج الإدخال/الإخراج لذلك؛ وتعود الموسيقى والمحركات بعده. أبقِ البطاقة في مكانها والجهاز مشغلاً حتى تظهر كلمة تم.'
  ? '- RIPPS2 is copied to %s.

    '
  : '- يُنسخ RIPPS2 إلى %s.

    '
  A COPY ON MEMORY CARD %d: نسخة على بطاقة الذاكرة %d
  A COPY ON MX4SIO: نسخة على MX4SIO
  A COPY ON THE USB DRIVE: نسخة على ذاكرة USB
  BIBLE could not be written to memory card %d, so the card was put back as it was. Check its free space, then try again.: تعذّرت كتابة BIBLE على بطاقة الذاكرة %d، لذا أُعيدت البطاقة كما كانت. افحص مساحتها الحرة، ثم حاول مرة أخرى.
  BIBLE could not copy RIPPS2 to %s. Check the space and that it is not write protected. Nothing else was changed.: تعذّر على BIBLE نسخ RIPPS2 إلى %s. افحص المساحة وتأكد أنه غير محمي من الكتابة. لم يتغير شيء آخر.
  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: تعذّر على BIBLE نسخ RIPPS2 إلى قسم %s في القرص الصلب. افحص مساحته الحرة. لم يتغير شيء آخر.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : تعذّر على BIBLE الاحتفاظ بنسخة من برنامج إقلاع القرص الصلب، فتوقف قبل تغييره. نُسخ RIPPS2 إلى القرص الصلب؛ ولم يتغير شيء آخر.
  BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed.: تعذّر على BIBLE نقل %s جانباً للاحتفاظ به، فتوقف هناك. لم يتغير شيء على البطاقة.
  BIBLE could not write its config (%s). The boot program was not changed.: تعذّر على BIBLE كتابة إعداداته (%s). لم يتغير برنامج الإقلاع.
  BIBLE could not write the HDD's boot program (step %d). %s: تعذّر على BIBLE كتابة برنامج إقلاع القرص الصلب (الخطوة %d). %s
  ? 'BIBLE is installed on memory card %d (mc%d:/%s/%s) and BOOT LOCK is on: at power on the console starts RIPPS2 from %s, at once.'
  : 'BIBLE مثبّت على بطاقة الذاكرة %d (mc%d:/%s/%s) وBOOT LOCK مفعّل: عند التشغيل يبدأ الجهاز RIPPS2 من %s فوراً.'
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE مثبّت على القرص الصلب الداخلي وBOOT LOCK مفعّل: عند التشغيل يبدأ الجهاز RIPPS2 من %s%s%s%s فوراً. الإعدادات: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE موجود على بطاقة الذاكرة %d، لكن تعذّرت كتابة إعداداته (%s)، لذا يشغّل المتصفح. حرّر بعض المساحة وشغّل إدارة مجدداً لإكمال العملية.
  BIBLE ran out of memory before it started. Nothing was changed.: نفدت ذاكرة BIBLE قبل أن يبدأ. لم يتغير شيء.
  BIBLE ran out of memory. Nothing on the memory card was changed.: نفدت ذاكرة BIBLE. لم يتغير شيء على بطاقة الذاكرة.
  'BIBLE: binding PS2BBL to the memory card': 'BIBLE: ربط PS2BBL ببطاقة الذاكرة'
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: نسخ RIPPS2 إلى %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: الاحتفاظ ببرنامج إقلاع القرص الصلب'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: إعادة برنامج إقلاع القرص الصلب'
  'BIBLE: restarting the I/O processor with the security module': 'BIBLE: إعادة تشغيل معالج الإدخال/الإخراج مع وحدة الأمان'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: كتابة PS2BBL في منطقة إقلاع القرص الصلب'
  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: تعذّر على BOOT LOCK كتابة إعدادات PS2BBL. تأكد أن بطاقة الذاكرة أو المحرك غير محمي من الكتابة، ثم حاول مرة أخرى.
  BOOT LOCK found no PS2BBL config to change.: لم يجد BOOT LOCK إعدادات PS2BBL لتغييرها.
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: BOOT LOCK معطّل. يشغّل PS2BBL ما كان يشغّله سابقاً (%s).
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK مفعّل. يشغّل PS2BBL الآن RIPPS2 عند التشغيل (%s). اضغط مطولاً على أحد اختصارات PS2BBL أثناء بدء الجهاز للوصول إلى أي شيء آخر.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: يعمل BOOT LOCK عبر PS2BBL (PlayStation 2 Basic BootLoader)، ولا يوجد أي منه على بطاقات الذاكرة هنا.
  INSTALL BIBLE: تثبيت BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'تثبيت BIBLE على بطاقة الذاكرة %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'تثبيت BIBLE على القرص الصلب الداخلي

    - يُنسخ RIPPS2 إلى %s.

    - يُقرأ برنامج إقلاع القرص الصلب الموجود الآن في __mbr ويُحفظ في %s/RIPPS2 (الاستعادة تعيده).

    - يُكتب إصدار القرص الصلب من PS2BBL 1.2.0 مكانه، ويُضبط الجهاز لتشغيله عند التشغيل.

    - إعداداته (%s) تشغّل RIPPS2 من %s أولاً%s%s، مع تفعيل BOOT LOCK.

    يتطلب ذلك جهازاً يُقلع من قرصه الصلب (PS2 كبير الحجم مع محوّل الشبكة). أبقِه مشغلاً حتى تظهر كلمة تم.'
  INTERNAL HDD  (its boot area): القرص الصلب الداخلي  (منطقة إقلاعه)
  MEMORY CARD %d  (%s): بطاقة الذاكرة %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'بطاقة الذاكرة 0: %s

    بطاقة الذاكرة 1: %s

    %s

    BIBLE هو PS2BBL 1.2.0 من El Isra، مضبوط بواسطة RIPPS2: دون انتظار عند التشغيل، وRIPPS2 أولاً، والزر المضغوط مطولاً عند التشغيل لا يزال يصل إلى المتصفح (المثلث)، والقرص (START)، وما كان موجوداً سابقاً (الدائرة). هل تريد تثبيته أو إصلاحه على بطاقة ذاكرة أو على القرص الصلب الداخلي؟'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: بطاقة الذاكرة %d فيها %d كيلوبايت حرة، ويحتاج BIBLE إلى %d كيلوبايت عليها. حرّر بعض المساحة، ثم حاول مرة أخرى.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: بطاقة الذاكرة %d فيها %d كيلوبايت حرة، وتحتاج نسخة RIPPS2 إلى %d كيلوبايت. حرّر بعض المساحة أو اختر مكاناً آخر.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: بطاقة الذاكرة %d تشغّل %s عند التشغيل، وBOOT LOCK يعمل عبر PS2BBL فقط.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : لا يستطيع PS2BBL 1.2.0 تشغيل RIPPS2 من مكانه الحالي (فهو يصل إلى بطاقات الذاكرة وذاكرات USB وMX4SIO). يستطيع محمّل الإقلاع > إدارة نسخ RIPPS2 إلى بطاقة ذاكرة أو ذاكرة USB من أجله.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : يشغّل PS2BBL البرامج من بطاقة ذاكرة أو ذاكرة USB أو MX4SIO، وتعذّر على RIPPS2 قراءة نفسه لينسخ نفسه إلى هناك. شغّل RIPPS2 من أحدها، ثم حاول مرة أخرى.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'إعادة برنامج الإقلاع القديم للقرص الصلب

    البرنامج الذي احتفظ به BIBLE (RIPPS2/MBR-BACKUP.KELF على القرص الصلب) يعود إلى __mbr، مكان BIBLE. يبقى RIPPS2 وإعدادات PS2BBL في مكانهما.'
  RESTORE: استعادة
  RESTORE THE HDD'S OLD BOOT PROGRAM: استعادة برنامج الإقلاع القديم للقرص الصلب
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : لا يستطيع RIPPS2 معرفة منطقة هذا الجهاز من ذاكرة ROM الخاصة به، لذا لا يعرف أي مجلد تحديث نظام يقرؤه. لم يُثبَّت BIBLE.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : تعذّر على RIPPS2 فتح قسم __sysconf أو __common في القرص الصلب (خطأ %d)، لذا لا يجد BIBLE مكاناً لحفظ RIPPS2 وإعداداته هناك. لم يتغير شيء.
  RIPPS2 could not read the kept boot program. Nothing was changed.: تعذّر على RIPPS2 قراءة برنامج الإقلاع المحفوظ. لم يتغير شيء.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: تعذّر على RIPPS2 إعادة كتابة برنامج الإقلاع. حاول مرة أخرى؛ النسخة المحفوظة لم تُمس.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'كان RIPPS2 مشغولاً بقراءة محرك ولم يستطع إعادة تشغيل معالج الإدخال/الإخراج. لم يتغير شيء: حاول مرة أخرى بعد قليل.'
  Reading the memory cards: جارٍ قراءة بطاقات الذاكرة
  The HDD partition BIBLE uses went away. Nothing was changed.: اختفى قسم القرص الصلب الذي يستخدمه BIBLE. لم يتغير شيء.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: عاد برنامج الإقلاع القديم للقرص الصلب. لم يعد BIBLE يبدأ من القرص الصلب.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : لم يربط الجهاز BIBLE ببطاقة الذاكرة %d (فشلت خطوة MagicGate). لم يتغير شيء على البطاقة. البطاقة غير الأصلية أو غير المتوافقة مع MagicGate لا يمكنها حمل تحديث للنظام.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'ما كان موجوداً محفوظ في RIPPS2/MBR-BACKUP.KELF على القرص الصلب: محمّل الإقلاع > إدارة > استعادة يعيده.'
  The security module would not start on this console. Nothing on the memory card was changed.: لم تبدأ وحدة الأمان على هذا الجهاز. لم يتغير شيء على بطاقة الذاكرة.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'لا توجد بطاقة ذاكرة PS2 مهيأة في أي من المنفذين، ولا يوجد قرص صلب داخلي. يعيش BIBLE على بطاقة ذاكرة أو على القرص الصلب: أدخل بطاقة، ثم حاول مرة أخرى.'
  There is no kept boot program on this HDD. Nothing was changed.: لا يوجد برنامج إقلاع محفوظ على هذا القرص الصلب. لم يتغير شيء.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : لا يحتوي هذا القرص الصلب على قسم __sysconf، لذا يجب أن توضع إعدادات BIBLE على بطاقة ذاكرة (يقرأ PS2BBL البطاقة أولاً)، ولا توجد بطاقة في أي من المنفذين. أدخل واحدة، ثم حاول مرة أخرى.
  WHERE IT IS NOW (%.40s): مكانه الحالي (%.40s)
  a boot loader RIPPS2 does not know: محمّل إقلاع لا يعرفه RIPPS2
  memory card %d: بطاقة الذاكرة %d
  no boot loader: لا يوجد محمّل إقلاع
  no memory card: لا توجد بطاقة ذاكرة
  the HDD: القرص الصلب
  the USB drive: ذاكرة USB
  '%d OF %d COPIED TO %s': نُسخ %d من %d إلى %s
  '%d WRITTEN, %d ALREADY THERE': كُتب %d، و%d موجود بالفعل
  '%d WRITTEN, %d THERE, %d FAILED': كُتب %d، و%d موجود، و%d فشل
  '%s   %d %s   %u KB FREE': '%s   %d %s   %u كيلوبايت حرة'
  '%s   NOT FORMATTED': '%s   غير مهيأة'
  '%u KB': '%u كيلوبايت'
  ACTIONS: الإجراءات
  BACK UP THE CARD TO A VMC: نسخ البطاقة احتياطياً إلى VMC
  BACKED UP %d TO %s: نُسخ %d احتياطياً إلى %s
  BACKUP STOPPED: توقف النسخ الاحتياطي
  CARD MANAGER: مدير البطاقات
  COPYING %d OF %d: جارٍ نسخ %d من %d
  COULD NOT DELETE %s: تعذّر حذف %s
  COULD NOT FORMAT (%d): تعذّرت التهيئة (%d)
  COULD NOT MAKE THE CARD IMAGE (%d): تعذّر إنشاء صورة البطاقة (%d)
  Copy the whole card into an 8 MB VMC on a drive? The card stays as it is. It takes a minute or two.: نسخ البطاقة كاملة إلى VMC بحجم 8 ميغابايت على محرك؟ تبقى البطاقة كما هي. يستغرق ذلك دقيقة أو دقيقتين.
  DELETE: حذف
  DELETE %.30s: حذف %.30s
  DELETED %s: حُذف %s
  DELETING: جارٍ الحذف
  Delete the save %s from %s? It cannot be brought back.: حذف ملف الحفظ %s من %s؟ لا يمكن استعادته.
  ERASE: مسح
  ERASE EVERY GAME SAVE: مسح كل ملفات حفظ الألعاب
  ERASED EVERY GAME SAVE: مُسحت كل ملفات حفظ الألعاب
  ERASED, %d COULD NOT GO: تم المسح، وتعذّر حذف %d
  ERASING %.32s: جارٍ مسح %.32s
  Erase all %d game saves on %s? Boot loaders, RIPPS2 and other folders that are not saves stay.: مسح جميع ملفات حفظ الألعاب وعددها %d على %s؟ تبقى محمّلات الإقلاع وRIPPS2 والمجلدات الأخرى التي ليست ملفات حفظ.
  FORMAT: تهيئة
  FORMAT IT TO USE IT: هيّئها لتستخدمها
  FORMAT THE CARD: تهيئة البطاقة
  FORMATTED: تمت التهيئة
  FORMATTING: جارٍ التهيئة
  'Format the card? Everything on it goes: saves, boot loaders, homebrew.': 'تهيئة البطاقة؟ سيزول كل ما عليها: ملفات الحفظ ومحمّلات الإقلاع والبرامج المنزلية.'
  KEPT %s: أُبقي %s
  KEPT BY ERASE: أبقاه المسح
  Last check. Every game save goes for good. Press START to erase them.: تحقق أخير. ستزول كل ملفات حفظ الألعاب نهائياً. اضغط START لمسحها.
  Last check. The card will be blank and nothing can bring it back. Press START to format it.: تحقق أخير. ستصبح البطاقة فارغة ولا شيء يمكنه استعادتها. اضغط START لتهيئتها.
  Last check. The save goes for good. Press START to delete it.: تحقق أخير. سيزول ملف الحفظ نهائياً. اضغط START لحذفه.
  MAKING THE CARD IMAGE  %d%%: جارٍ إنشاء صورة البطاقة  %d%%
  MEMORY CARD %d: بطاقة الذاكرة %d
  NO GAME SAVES TO ERASE: لا توجد ملفات حفظ لمسحها
  NO SAVES: لا توجد ملفات حفظ
  No drive is started to put the backup on. Start the drives first (START DRIVES in Memory Files).: لا يوجد محرك مشغّل لوضع النسخة الاحتياطية عليه. شغّل المحركات أولاً (تشغيل المحركات في ملفات الذاكرة).
  PFS0:/ (INTERNAL HDD): PFS0:/ (القرص الصلب الداخلي)
