  : يعزف RIPPS2 موسيقى الشاشة الحمراء لهذا الجهاز، المقطوعة المحيطية لتحذير القرص (%d:%02d)، من نغمات BIOS نفسه ويكتبها كملف WAV بحجم %s؛ لا توجد بطاقة ذاكرة تتسع لها. القبول يكتبها في %s، بجانب RIPPS2. START يكتبها في %s، موارد OPL على ذلك المحرك. سيُستبدل %s الموجود هناك. يستغرق ذلك دقيقة أو دقيقتين.
