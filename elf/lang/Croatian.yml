  : BIBLE nije mogao sačuvati kopiju programa za pokretanje HDD-a, pa je stao prije nego što ga je promijenio. RIPPS2 je kopiran na HDD; ništa drugo nije promijenjeno.
  BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed.: BIBLE nije mogao skloniti %s da ga sačuva, pa je ondje stao. Ništa na kartici nije promijenjeno.
