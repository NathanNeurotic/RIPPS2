  It could not be finished (%s). What it wrote was removed; the game is as it was.: Nije moglo biti dovršeno (%s). Ono što je zapisano uklonjeno je; igra je kakva je bila.
  List: Popis
  ? Make %s an ISO again? The ZSO stays until the ISO has been read back and checked, then RIPPS2 asks before it removes the ZSO. The drive needs room for both while it works; leave the console on until it finishes. Its saves, settings, art and cheats stay with it.
  : Ponovno napraviti %s kao ISO? ZSO ostaje dok se ISO ne pročita i provjeri, zatim RIPPS2 pita prije nego ukloni ZSO. Pogon treba mjesta za oboje dok radi; ostavite konzolu uključenu dok ne završi. Njezina spremanja, postavke, slike i varke ostaju s njom.
  Stop? What it has written so far is removed; the game stays as it was.: Zaustaviti? Ono što je dosad zapisano uklanja se; igra ostaje kakva je bila.
  THEMES: TEME
  There is not enough memory for this just now.: Trenutno nema dovoljno memorije za ovo.
  This image is not one RIPPS2 can compress or uncompress (its size is not whole 2 KB blocks).: Ovu sliku diska RIPPS2 ne može sažeti ni raspakirati (njezina veličina nije u cijelim blokovima od 2 KB).
