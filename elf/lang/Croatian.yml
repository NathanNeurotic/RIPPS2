  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK nije mogao zapisati PS2BBL konfiguraciju. Provjeri da memorijska kartica ili pogon nisu zaštićeni od pisanja, pa pokušaj ponovno.
  BOOT LOCK found no PS2BBL config to change.: BOOT LOCK nije pronašao PS2BBL konfiguraciju za promjenu.
