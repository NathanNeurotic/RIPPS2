  ? Compress %s? The ISO stays until the ZSO has been read back and checked, then RIPPS2 asks before it removes the ISO. The drive needs room for both while it works; leave the console on until it finishes. A ZSO starts with the OPL core only (not Neutrino); its saves, settings, art and cheats stay with it, and it can be made an ISO again at any time.
  : Sažeti %s? ISO ostaje dok se ZSO ne pročita i provjeri, zatim RIPPS2 pita prije nego ukloni ISO. Pogon treba mjesta za oboje dok radi; ostavite konzolu uključenu dok ne završi. ZSO se pokreće samo s OPL jezgrom (ne Neutrino); njezina spremanja, postavke, slike i varke ostaju s njom, a u bilo kojem trenutku može ponovno postati ISO.
  Compress to ZSO: Sažmi u ZSO
