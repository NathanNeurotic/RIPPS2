  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 ne može utvrditi gdje je njegova mapa, pa nema kamo spremiti zvukove.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 reproducira glazbu izbornika ove konzole, ambijentalni komad njezina preglednika (%d:%02d), iz vlastitih nota BIOS-a i zapisuje je kao WAV od %s u %s; nijedna memorijska kartica nema mjesta za nju. %s koji je već ondje bit će zamijenjen. Traje minutu ili dvije.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 reproducira glazbu izbornika ove konzole, ambijentalni komad njezina preglednika (%d:%02d), iz vlastitih nota BIOS-a i zapisuje je kao WAV od %s; nijedna memorijska kartica nema mjesta za nju. Prihvati je zapisuje u %s, uz RIPPS2. START je zapisuje u %s, OPL-ove resurse na tom pogonu. %s koji je već ondje bit će zamijenjen. Traje minutu ili dvije.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 čita zvukove iz vlastitog BIOS-a ove konzole i zapisuje ih u %s kao svoje zvukove: pokazivač, potvrda, odustajanje, stranice, kategorija, poruke, disk, pogreška, spremanje, pogoni i nasumično, te glazbu pri pokretanju i pri pokretanju igre, reproduciranu iz vlastitih nota BIOS-a. Datoteke tih naziva koje su već ondje bit će zamijenjene.'
