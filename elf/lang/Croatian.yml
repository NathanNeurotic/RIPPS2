  The HDD partition BIBLE uses went away. Nothing was changed.: Particija HDD-a koju BIBLE koristi je nestala. Ništa nije promijenjeno.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Stari program za pokretanje HDD-a je vraćen. BIBLE se više ne pokreće s HDD-a.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Konzola nije htjela vezati BIBLE za memorijsku karticu %d (njezin MagicGate korak nije uspio). Ništa na kartici nije promijenjeno. Kartica koja nije originalna ili kompatibilna s MagicGateom ne može sadržavati ažuriranje sustava.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Onaj koji je bio ondje čuva se u RIPPS2/MBR-BACKUP.KELF na HDD-u: UČITAVAČ > UPRAVLJAJ > VRATI ga vraća.'
  The security module would not start on this console. Nothing on the memory card was changed.: Sigurnosni modul se nije htio pokrenuti na ovoj konzoli. Ništa na memorijskoj kartici nije promijenjeno.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
