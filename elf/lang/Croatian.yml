  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE nije mogao kopirati RIPPS2 na particiju %s HDD-a. Provjeri njezin slobodan prostor. Ništa drugo nije promijenjeno.
