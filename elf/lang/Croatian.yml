  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK je uključen. PS2BBL sada pokreće RIPPS2 pri uključivanju (%s). Drži PS2BBL prečac dok se konzola pokreće da dođeš do bilo čega drugog.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK radi preko PS2BBL-a (PlayStation 2 Basic BootLoader), a ovdje ga nema ni na jednoj memorijskoj kartici.
  INSTALL BIBLE: INSTALIRAJ BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'INSTALIRAJ BIBLE NA MEMORIJSKU KARTICU %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALIRAJ BIBLE NA UNUTARNJI HDD

    - RIPPS2 se kopira na %s.

    - Program za pokretanje HDD-a koji je sada u __mbr čita se i čuva u %s/RIPPS2 (VRATI ga vraća).

    - Na njegovo mjesto zapisuje se HDD izgradnja PS2BBL 1.2.0, a konzola se postavlja da ga pokreće pri uključivanju.

    - Njegova konfiguracija (%s) pokreće RIPPS2 najprije s %s%s%s, BOOT LOCK uključen.

    Za ovo treba konzola koja se pokreće sa svog HDD-a (debeli PS2 s mrežnim adapterom). Drži je uključenom dok ne piše gotovo.'
  INTERNAL HDD  (its boot area): UNUTARNJI HDD  (njegovo područje za pokretanje)
  MEMORY CARD %d  (%s): MEMORIJSKA KARTICA %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'MEMORIJSKA KARTICA 0: %s

    MEMORIJSKA KARTICA 1: %s

    %s

    BIBLE je PS2BBL 1.2.0 autora El Isra, postavljen od RIPPS2: bez čekanja pri uključivanju, RIPPS2 prvi, a tipka držana pri uključivanju i dalje vodi do preglednika (TROKUT), diska (START) i onoga što je prije bilo ondje (KRUG). Instalirati ga ili popraviti na memorijskoj kartici ili unutarnjem HDD-u?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Memorijska kartica %d ima %d KB slobodno, a BIBLE ondje treba %d KB. Oslobodi malo prostora, pa pokušaj ponovno.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Memorijska kartica %d ima %d KB slobodno, a kopija RIPPS2 treba %d KB. Oslobodi malo prostora ili odaberi drugo mjesto.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Memorijska kartica %d pri uključivanju pokreće %s, a BOOT LOCK radi samo preko PS2BBL-a.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 ne može pokrenuti RIPPS2 odande gdje je sada (doseže memorijske kartice, USB pogone i MX4SIO). UČITAVAČ > UPRAVLJAJ može za njega kopirati RIPPS2 na memorijsku karticu ili USB pogon.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL pokreće programe s memorijske kartice, USB pogona ili MX4SIO, a RIPPS2 nije mogao pročitati sam sebe da se ondje kopira. Pokreni RIPPS2 s jednog od njih, pa pokušaj ponovno.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'VRATI STARI PROGRAM ZA POKRETANJE HDD-a

    Onaj koji je BIBLE sačuvao (RIPPS2/MBR-BACKUP.KELF na HDD-u) vraća se u __mbr, na mjesto BIBLE-a. RIPPS2 i PS2BBL konfiguracija ostaju gdje jesu.'
  RESTORE: VRATI
  RESTORE THE HDD'S OLD BOOT PROGRAM: VRATI STARI PROGRAM ZA POKRETANJE HDD-a
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 ne može iz ROM-a utvrditi regiju ove konzole, pa ne zna koju mapu za ažuriranje sustava čita. BIBLE nije instaliran.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
