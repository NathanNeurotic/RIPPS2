  There is no kept boot program on this HDD. Nothing was changed.: Na ovom HDD-u nema sačuvanog programa za pokretanje. Ništa nije promijenjeno.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Ovaj HDD nema particiju __sysconf, pa konfiguracija BIBLE-a mora ići na memorijsku karticu (PS2BBL najprije čita karticu), a nema je ni u jednom utoru. Umetni jednu, pa pokušaj ponovno.
