  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 nije mogao pročitati sačuvani program za pokretanje. Ništa nije promijenjeno.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 nije mogao vratiti program za pokretanje. Pokušaj ponovno; sačuvana kopija je netaknuta.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 je bio zauzet čitanjem pogona i nije mogao ponovno pokrenuti I/O procesor. Ništa nije promijenjeno: pokušaj ponovno za trenutak.'
