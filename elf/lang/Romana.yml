  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 cântă muzica de meniu a acestei console, piesa ambientală a browserului ei (%d:%02d), din notele proprii ale BIOS-ului și o scrie ca WAV de %s în %s; niciun card de memorie nu are loc pentru ea. Un %s deja existent acolo este înlocuit. Durează un minut sau două.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 cântă muzica de meniu a acestei console, piesa ambientală a browserului ei (%d:%02d), din notele proprii ale BIOS-ului și o scrie ca WAV de %s; niciun card de memorie nu are loc pentru ea. Confirmă o scrie în %s, lângă RIPPS2. START o scrie în %s, resursele OPL de pe acea unitate. Un %s deja existent acolo este înlocuit. Durează un minut sau două.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 citește sunetele din BIOS-ul propriu al acestei console și le scrie în %s ca sunetele sale: cursor, confirmare, anulare, pagini, categorie, mesaje, disc, eroare, salvare, unități și aleatoriu, plus muzica de pornire și de lansare a jocului, cântate din notele proprii ale BIOS-ului. Fișierele cu aceste nume deja existente acolo sunt înlocuite.'
