  HINT_CFG_TITLES: Arată Titlul din CFG-ul fiecărui joc în locul numelui fișierului și sortează după el. Citește fiecare CFG când se reîmprospătează o listă, așa că listele se încarcă mai încet. Doar afișare.
  AUTO_VMC_INVALID: Fișierul VMC al acestui joc există, dar nu este un card de memorie valid, așa că nu a fost folosit sau înlocuit. Jocul pornește fără el; verifică-l în meniul VMC.
  AUTO_VMC_STILL_RUNNING: VMC-ul acestui joc încă se creează. Lansează jocul din nou peste o clipă.
  NEUTRINO_DVR_QUICKBOOT: Lansarea DVR necesită trecerea în modul PSX. Elimină -qb din argumentele Neutrino globale și per joc.
  NEUTRINO_DVR_FILE_MISSING: 'Instalarea Neutrino pentru DVR este incompletă. Lipsește fișierul necesar:'
  LOGOART: Imagini siglă
  HINT_LOGOART: Arată sigla unui joc (<ID>_LGO) când tema o folosește. Oprit ascunde și imaginea ei implicită, dar păstrează coperțile, imaginile de disc și fundalurile.
  PARENLOCK_GAME: Control parental
  PARENLOCK_GAME_HINT: Cere parola de control parental ca să pornești acest joc.
  PARENLOCK_GAME_NO_PASSWORD: Setează o parolă de control parental, altfel acest joc nu va fi blocat.
  HINT_ENABLE_PCCF: CompactFlash pe PC CARD pentru primele PS2 japoneze. Doar jocuri PS2 native; CF are nevoie de acces exclusiv la PC CARD. Repornește ca să îl eliberezi.
  PCCF_GAMES: Jocuri PC CARD CF
  PCCF_UNAVAILABLE: 'CF indisponibil: necesită un PS2 japonez timpuriu cu PC CARD, un card compatibil și niciun driver DEV9/HDD/rețea activ.'
  PCCF_UNSUPPORTED_GAME: CF acceptă deocamdată doar jocuri PS2 native. VMC pe CF, încărcarea PS1 și realizările prin rețea nu sunt disponibile.
  HINT_ENABLE_DVR: Descoperire experimentală a ISO-urilor DESR DVR. Necesită sursa HDD pornită; lansarea jocurilor necesită un Neutrino extern cu suport DVR.
  HINT_RIPPS2_IGR_PAGE: Meniul în joc, RIPSHOT și cum se developează cadrele.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Capturi din meniul în joc, în ART pentru temele tale sau în MEDIA.
  RIPPS2_DEVELOP_SHOTS: Developează cadrele
  HINT_RIPPS2_DEVELOP_SHOTS: Cum cadrele în așteptare pe rola fiecărui joc devin PNG.
  RIPPS2_SETTINGS_HOME: Salvează setările pe
  HINT_RIPPS2_SETTINGS_HOME: 'Unde își ține RIPPS2 setările: în salvarea proprie pe un card de memorie, într-un dosar RIPPS2 pe o unitate (HDD-ul intern, USB, MX4SIO, iLink sau MMCE) sau într-un dosar pe care îl scrii.'
  RIPPS2_LAUNCHERS: Lansatoare
  RIPPS2_LOOK_NOW: Caută acum
  HINT_RIPPS2_LOOK_NOW: RIPPS2 caută pe unitățile pornite POPSTARTER, fișierele POPS, Ember, BIOS-ul lui Ember și Neutrino, și ține minte unde e fiecare. Fiecare lansare le citește de acolo.
  RIPPS2_HIDE_GAME: Ascunde jocul
  RIPPS2_HIDDEN_GAMES: Jocuri ascunse
  HINT_RIPPS2_HIDDEN_GAMES: Jocurile ascunse cu Ascunde jocul, pe unitățile pornite. Arată unul din nou, sau șterge-l. Fiecare unitate își ține propria listă.
  HINT_RIPPS2_BDM_DEVICES: 'Unitățile de pe care BDM citește jocuri: USB, MX4SIO, un PC Card CF, unitatea DVR a unui DESR și iLink. HDD-ul intern urmează modul de pornire HDD.'
  HINT_RIPPS2_SCREEN: 'Imaginea meniului: modul video, ecranul lat, locul ei pe televizor (H-POS, V-POS) și overscan.'
  HINT_RIPPS2_LAYOUT: Unde stau categoriile și cum intră o pagină, apoi coperțile RIPFLOW și grila RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Grosimea textului, tema de culoare, trecerea de culori și fiecare culoare.
  HINT_RIPPS2_TEXT_WEIGHT: 'Cât de gros este textul propriu al RIPPS2: sfaturile din setări, STARE și Despre. Obișnuit este ca înainte; Mediu și Aldin se citesc mai bine pe o imagine moale.'
  HINT_RIPPS2_HDD_START: 'HDD-ul intern, APA sau exFAT: RIPPS2 îl citește oricum ar fi și îl arată o dată, ca jocuri HDD. Oprit îl lasă în pace.'
