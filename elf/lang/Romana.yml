  HINT_RIPPS2_SWEEP: Cinci culori prin care trece tema, încet și lin. Curcubeu, o trecere făcută din fiecare temă de culoare sau a dumneavoastră. Oprit ține tema nemișcată.
  HINT_RIPPS2_SWEEP_COLORS: Cele cinci culori ale trecerii și viteza ei. Schimbați una de-a RIPPS2 și se păstrează ca a dumneavoastră, cu numele dat.
  HINT_RIPPS2_SWEEP_NAME: Cum se numește trecerea dumneavoastră în lista Trecere de culori.
  HINT_RIPPS2_SWEEP_COLOR: Una dintre cele cinci culori prin care trece trecerea, în ordine.
