  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- A consola vincula PS2BBL 1.2.0 a esta tarxeta e escríbeo como %s/%s.

    - A súa configuración, mc%d:/PS2BBL/CONFIG.INI, inicia RIPPS2 desde %s, con BOOT LOCK activado.

    O procesador de E/S reiníciase para isto; a música e as unidades volven despois. Manteña a tarxeta posta e a consola acesa ata que diga feito.'
