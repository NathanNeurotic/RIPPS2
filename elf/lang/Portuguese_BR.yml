  ? Compress %s? The ISO stays until the ZSO has been read back and checked, then RIPPS2 asks before it removes the ISO. The drive needs room for both while it works; leave the console on until it finishes. A ZSO starts with the OPL core only (not Neutrino); its saves, settings, art and cheats stay with it, and it can be made an ISO again at any time.
  : Compactar %s? O ISO fica até o ZSO ser lido de volta e verificado; depois o RIPPS2 pergunta antes de remover o ISO. O drive precisa de espaço para os dois enquanto trabalha; deixe o console ligado até terminar. Um ZSO só inicia com o núcleo OPL (não Neutrino); seus saves, configurações, imagens e cheats ficam com ele, e ele pode virar ISO de novo a qualquer momento.
