  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: O RIPPS2 não sabe onde está a pasta dele, então não há onde colocar os sons.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : O RIPPS2 toca a música do menu deste console, a peça ambiente do navegador dele (%d:%02d), a partir das próprias notas da BIOS e grava como um WAV de %s em %s; nenhum cartão de memória tem espaço para ela. Um %s que já esteja lá é substituído. Leva um ou dois minutos.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : O RIPPS2 toca a música do menu deste console, a peça ambiente do navegador dele (%d:%02d), a partir das próprias notas da BIOS e grava como um WAV de %s; nenhum cartão de memória tem espaço para ela. Aceitar grava em %s, ao lado do RIPPS2. START grava em %s, os recursos do OPL nessa unidade. Um %s que já esteja lá é substituído. Leva um ou dois minutos.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'O RIPPS2 lê os sons da própria BIOS deste console e os grava em %s como os sons dele: cursor, confirmar, cancelar, páginas, categoria, mensagens, disco, erro, salvar, unidades e aleatório, e as músicas de inicialização e de início de jogo, tocadas a partir das próprias notas da BIOS. Arquivos com esses nomes que já estejam lá são substituídos.'
