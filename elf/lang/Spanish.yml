  : 'TARJETA DE MEMORIA 0: %s

    TARJETA DE MEMORIA 1: %s

    %s

    BIBLE es PS2BBL 1.2.0 de El Isra, preparado por RIPPS2: sin espera al encender, RIPPS2 primero, y un botón mantenido al encender sigue llegando al navegador (TRIÁNGULO), a un disco (START) y a lo que había antes (CÍRCULO). ¿Instalarlo o repararlo en una tarjeta de memoria o en el disco duro interno?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: La tarjeta de memoria %d tiene %d KB libres, y BIBLE necesita %d KB en ella. Libera espacio e inténtalo de nuevo.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: La tarjeta de memoria %d tiene %d KB libres, y la copia de RIPPS2 necesita %d KB. Libera espacio o elige otro lugar.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: La tarjeta de memoria %d inicia %s al encender, y BOOT LOCK solo funciona a través de PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 no puede iniciar RIPPS2 desde donde está ahora (llega a tarjetas de memoria, memorias USB y MX4SIO). CARGADOR DE ARRANQUE > GESTIONAR puede copiar RIPPS2 en una tarjeta de memoria o una memoria USB para él.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL inicia programas desde una tarjeta de memoria, una memoria USB o MX4SIO, y RIPPS2 no pudo leerse a sí mismo para copiarse allí. Inicia RIPPS2 desde uno de ellos e inténtalo de nuevo.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'DEVOLVER EL ANTIGUO PROGRAMA DE ARRANQUE DEL DISCO DURO

    El que guardó BIBLE (RIPPS2/MBR-BACKUP.KELF en el disco duro) vuelve a __mbr, en el lugar de BIBLE. RIPPS2 y la configuración de PS2BBL se quedan donde están.'
