  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 no pudo volver a escribir el programa de arranque. Inténtalo de nuevo; la copia guardada está intacta.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 estaba ocupado leyendo una unidad y no pudo reiniciar el procesador de E/S. No se cambió nada: inténtalo de nuevo en un momento.'
