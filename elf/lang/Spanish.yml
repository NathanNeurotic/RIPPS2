  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Ejecuta el cliente xeRAbora en un PC de la misma red, con la sesión iniciada en tu cuenta de RetroAchievements. Después, para un juego en USB, MMCE, SMB o el disco duro: abre su menú (TRIÁNGULO) y COMPRUEBA SU COMPATIBILIDAD. Un juego con seguimiento recibe la insignia RA; con la TELEMETRÍA activada, inícialo y los desbloqueos aparecen sobre el juego. Para un disco en la bandeja, usa COMPROBAR EL DISCO y luego JUGAR EL DISCO CON LOGROS. Los juegos iniciados con Neutrino, POPSTARTER o Ember aún no tienen seguimiento.'
