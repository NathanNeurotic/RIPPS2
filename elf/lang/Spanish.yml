  This drive is %s, which keeps no file of 4 GB or more, and the new image would be %s.: Esta unidad es %s, que no guarda archivos de 4 GB o más, y la nueva imagen ocuparía %s.
  '%s, %s clusters, %s free of %s': '%s, clústeres de %s, %s libres de %s'
  Delete This Sweep: Borrar esta transición
  Delete %s? RIPPS2's own sweeps stay as they are.: ¿Borrar %s? Las transiciones propias de RIPPS2 se quedan como están.
  Sweep: Transición
  Badges mark the games with achievements in your lists, with how many you have unlocked. They need TELEMETRY on.: Las insignias marcan los juegos con logros en tus listas, con cuántos has desbloqueado. Necesitan la TELEMETRÍA activada.
labels:
  HINT_NEUTRINO_AUTO_ELF: Pasa el ELF de arranque del juego a Neutrino para buscar su configuración por título. Activado por defecto; una opción Boot ELF puesta a mano tiene prioridad.
  HINT_POPSTARTER_PATH: Dónde está POPSTARTER.ELF. Si lo dejas vacío, RIPPS2 pone uno que encuentre en una unidad; escribe encima para usar otro, como usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Los argumentos de Neutrino superan la longitud que se puede guardar. Acorta un campo antes de guardar.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Los argumentos de inicio de Neutrino superan el límite seguro. Acorta los argumentos globales o los del juego.
  NEUTRINO_AUTO_ELF: Boot ELF automático (-elf)
  HINT_NEUTRINO_PATH: '¿Dónde está neutrino.elf? <sin definir> = Unidad del juego -> mc0/mc1. Una ruta completa personalizada se prueba primero. Ejemplos: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Visualización de juegos PS2/PS1
  HINT_GAME_VIEW_MODE: Todo muestra juntos los juegos de PS2 y PS1, y L3 alterna entre Todo, PS1 y PS2. PS2 o PS1 muestra solo ese tipo y desactiva L3. APPS y Juegos favoritos tienen sus propias reglas.
  VIEW_MIXED: Mostrando juegos de PS2 + PS1
  VIEW_PS1_ELF: Mostrando apps PS1 ELF
  APPS_DISPLAY: Visualización de aplicaciones
  HINT_APPS_DISPLAY: Todo muestra cada ELF en una sola lista APPS con L3 desactivado. Apps / PS1ELF lleva los títulos con [PS1] a una segunda página de L3; el inicio no cambia.
  VIEW: Vista
  VIEW_PS2: Mostrando juegos de PS2 favoritos
  VIEW_PS1: Mostrando juegos de PS1 favoritos
  VIEW_ELF: Mostrando ELF favoritos
  VIEW_ALL: Mostrando todos los juegos favoritos
  VMC_FRAGMENTED_ON_CREATE: VMC creada, pero está fragmentada. La emulación de tarjeta de memoria necesita un archivo continuo, así que esta VMC se omitirá al iniciar y se usará la tarjeta real. Libera espacio y créala de nuevo, o copia una desde otro dispositivo.
  KEYB_MOVE_CURSOR: Mover el cursor
  TITLECOLOR: Color del título del juego
  RA_CHECK_GAME: Comprobar compatibilidad con RetroAchievements
  RA_TEST_LINK: Probar la conexión de RetroAchievements con el PC
  RA_CHECKING_IMAGE: Comprobando la imagen, tarda unos segundos...
  RA_CHECK_RUNNING: Ya hay una comprobación de imagen en curso
  RA_LOOKING_FOR_PC: Buscando el cliente del PC...
  RA_UL_UNSUPPORTED: Los juegos UL/USBExtreme aún no se pueden comprobar
  RA_UL_UNSUPPORTED2: Solo se admiten imágenes .iso normales en DVD/ o CD/
  RA_UNKNOWN_IMAGE: RetroAchievements no conoce esta imagen
  RA_STILL_IDENTIFYING: El PC aún está identificando la imagen
  RA_TRY_AGAIN: Inténtalo de nuevo en unos segundos
  RA_NO_SOCKET: La consola no pudo abrir un socket de red
  RA_NO_SOCKET2: Reinicia la consola, o revisa el dispositivo ETH en los ajustes
  RA_TEST_NO_SOCKET2: Revisa el cable y ETH en los ajustes; si la red funciona, reinicia la consola
  RA_PC_NO_ANSWER: El cliente del PC no respondió
  RA_PC_NO_ANSWER2: Comprueba que xeRAbora esté en marcha, o prueba la conexión con el PC
  RA_SUPPORTED: Compatible con RetroAchievements
  RA_START_TO_TRACK: Inicia el juego para seguir los logros
  RA_ACHIEVEMENTS: '%d logros'
  RA_ACHIEVEMENTS_FULL: '%d logros -- %d desbloqueados, %d no compatibles'
  RA_HASH_FAILED: No se pudo calcular el hash de la imagen
  RA_HASH_FAILED2: Mira RA/hashes.txt junto a los juegos para ver el motivo
  RA_NET_BUSY: La red la está usando un transporte UDP
  RA_NET_BUSY2: RA necesita la pila SMB -- cambia de protocolo, o crea el .wl en el PC
  RA_NET_BUSY_HASH: El hash está en RA/hashes.txt -- xeRAbora puede crear el .wl con él
  RA_NO_IP: La consola no tiene dirección IP
  RA_NO_IP2: Revisa el DHCP o la dirección fija en los ajustes de red
  RA_TEST_NO_ANSWER: Ningún cliente del PC respondió en 3 segundos
  RA_TEST_NO_ANSWER2: Consola%s. Comprueba que xeRAbora esté en marcha y el puerto UDP 18194 abierto
  RA_TEST_FOUND: Cliente del PC encontrado%s%s %s
  RA_TEST_FOUND2: Respuesta en %u ms, consola%s
  RA_NA_NEUTRINO: El seguimiento RA necesita el núcleo <OPL> -- los inicios con Neutrino nunca cargan ee_core
  RA_NA_UDPFS: El seguimiento RA no está disponible en UDPFS -- los juegos se inician con Neutrino
  RA_NA_PS1: El seguimiento RA no está disponible para juegos de PS1
  RA_NA_HDD: Información de juego APA o carpeta de ajustes del disco duro no disponible
  RA_NA_HDD2: Define una carpeta de ajustes válida en el disco duro y actualiza antes de comprobar la compatibilidad
  RA_TELEMETRY: Telemetría de RetroAchievements
  RA_BADGES: Insignias de RetroAchievements
  HTTP_GAMES: Juegos HTTP
  HTTP_SERVER: Servidor HTTP
  HTTP_PORT: Puerto HTTP
  HTTP_BASE_PATH: Ruta base HTTP
  HTTP_TEST: Probar el servidor HTTP
  HTTP_TEST_OK: Servidor OK -- juegos listados
  HTTP_TEST_EMPTY: El catálogo está vacío -- es válido, pero no demuestra nada sobre los rangos de bytes
  HTTP_TEST_NO_ISO: El catálogo no tiene ninguna imagen compatible para probar un rango de bytes
  HTTP_ERR_CONNECT: No se puede contactar con el servidor HTTP
  HTTP_ERR_CATALOG: games.csv falta, no se puede leer o es demasiado grande
  HTTP_ERR_RANGE: El servidor no devolvió exactamente los bytes pedidos
  HTTP_LAUNCH_UNAVAILABLE: El inicio por HTTP aún no está implementado -- el catálogo solo se puede explorar
  HTTP_ERR_COMPRESSED: Las imágenes comprimidas (.zso) aún no se admiten por HTTP
  HTTP_NO_VMC: Las tarjetas de memoria virtuales no están disponibles por HTTP -- usa una tarjeta física
  HTTP_TAB_HINT: HTTP lee games.csv de tu servidor. Pon la dirección, el puerto y la ruta base en los ajustes de red y usa Probar.
  RA_DISC_CHECK: 'RA: comprobar compatibilidad del disco'
  RA_DISC_LAUNCH: 'RA: iniciar el disco'
  RA_DISC_CHECKING: Comprobando el disco para RetroAchievements
  RA_DISC_HASH_FAILED: No se pudo calcular el hash del disco -- mira RA/hashes.txt en la carpeta de ajustes
  RA_DISC_HOME_ERROR: La carpeta de ajustes no se puede usar para las listas de seguimiento de discos
  RA_DISC_ENABLE: Activa primero la telemetría de RetroAchievements en los ajustes de red
  RA_DISC_CHECK_FIRST: 'No hay lista de seguimiento para este disco -- usa primero RA: comprobar compatibilidad del disco'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: disco duro encontrado, pero su tabla de particiones APA no se puede leer. No lo formatees -- puede que tus juegos se puedan recuperar.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: una unidad no se montó porque sus sectores no son de 512 bytes (por ejemplo, un disco de sectores de 4K). OPL solo puede leer sectores de 512 bytes.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Este título es su propia partición APA, y OPL nunca edita la tabla de particiones. Cámbiale el nombre en un PC.
  POPS_SETTINGS_UNREADABLE: No se pudieron leer los ajustes de POPSTARTER -- la tarjeta de memoria está ocupada o no se puede leer. Inténtalo de nuevo cuando termine la carga.
  GLOBAL_PS_EMULATION_SETTINGS: Ajustes globales de emulación de PS
  RA_NO_LINK_UNTRACKED: Red no disponible -- esta vez se inicia sin RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: La ruta del IGR está en USB, pero faltan USBD.IRX y USBHDFSD.IRX en %s, que la consola necesita para llegar al USB tras un In-Game Reset. Sin ellos, el IGR vuelve al navegador de PS2. ¿Copiar ahora los controladores de RiptOPL? FMCB, OpenTuna y otros exploits también cargan estos archivos y pueden comportarse distinto con ellos. Los archivos existentes nunca se reemplazan. Solo USB FAT32.
  IGR_USB_DRIVERS_FAILED: No se pudieron copiar los controladores USB en %s (tarjeta llena o sin permiso de escritura). El IGR volverá al navegador de PS2.
  OFFICIAL_CFG_NOTIFICATION: Ajustes oficiales de OPL cargados desde %s
  CFM_VMODE_HOLD_KEEP: Mantén para conservar
  BDM_PS2_FOLDERS_UNREADABLE: No se pudo abrir la carpeta CD o DVD en %s (error %d), así que esa unidad no muestra juegos de PS2. Pulsa SELECT en su página para reintentarlo.
  NEUTRINO_BD_NO_DEVICE_NUMBER: El sistema de archivos de Neutrino está en bd, pero esta unidad nunca informó de su número de dispositivo, así que Neutrino no puede apuntar a ella. Pon el sistema de archivos de Neutrino de este juego en Auto o exfat.
  CFM_VMODE_REVERT_IN: Se revierte en %d s
  EMBER_DITHER: Tramado de Ember
  HINT_EMBER_DITHER: Tramado de Ember (activado o desactivado), escrito en EMBER/settings.txt de la unidad de inicio. Un valor por juego tiene prioridad.
  EMBER_SHADING: Sombreado de Ember
  HINT_EMBER_SHADING: 'Profundidad de color de Ember: 15 bits, o 24 bits (experimental). Se escribe en EMBER/settings.txt de la unidad de inicio. Un valor por juego tiene prioridad.'
  EMBER_CONTROLLER: Mando de Ember
  HINT_EMBER_CONTROLLER: 'Modo de mando de Ember: Auto, Analógico o D2A. Normalmente es mejor ponerlo por juego (Triángulo > Ajustes de juego de Ember), que tiene prioridad.'
  EMBER_480P_CONFIRM: Ember en 480p no muestra imagen por compuesto. ¿Usar 480p?
  EMBER_SHADING_24: 24 bits (experimental)
  EMBER_GAME_SETTINGS: Ajustes de juego de Ember
  HINT_EMBER_GAME_SETTING: Solo este juego. Pulsa OK para escribir EMBER/games/<nombre>/settings.txt antes de iniciar. Un Predeterminado sin tocar conserva el valor del archivo; volver un valor a Predeterminado quita su ajuste propio.
  EMBER_TIMING: Sincronización de Ember
  HINT_EMBER_TIMING: 'Sincronización de vídeo de Ember: Auto sigue la región del disco, NTSC fuerza 60 Hz, PAL fuerza 50 Hz. Se escribe en EMBER/settings.txt de la unidad de inicio.'
  EMBER_GLOBAL_WARNING: Estos ajustes de Ember se aplican a todos los juegos de PS1, y algunos juegos fallan con ellos. Para cambiar solo un juego, usa Triángulo > Ajustes de juego de Ember en ese juego.
  RIPPS2_RANDOM: Aleatorio
  RIPPS2_ALL: Todo
  RIPPS2_RANDOM_GAME: Juego aleatorio
  HINT_RIPPS2_RANDOM_GAME: L2 y R2 a la vez saltan a un juego al azar. Al arrancar también abre cada lista en un juego al azar.
  RIPPS2_ALL_GAMES: Todos los juegos
  RIPPS2_SET_METADATA: Definir metadatos
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: Inicia RIPPS2 al encender a través de PS2BBL. Desactivado devuelve lo que PS2BBL iniciaba antes. ¿Aún no tienes PS2BBL? Cargador de arranque instala BIBLE.
  HINT_COLORS_TEXT: El color del texto de la lista de juegos. Los temas tienen el suyo; esto lo cambia en los temas integrados.
  HINT_COLORS_SELECTED: El color del juego elegido y de la fila elegida en las páginas de ajustes.
  HINT_COLORS_DIALOG: El color de las páginas de ajustes y de los cuadros de mensaje.
  HINT_COLORS_TITLE: El color del nombre de un juego en su página de información.
  HINT_COLORS_BACKGROUND: El color detrás de todo cuando no se dibujan imágenes ni torres.
  HINT_COLORS_PLASMA: El color hacia el que tiende el antiguo fondo de plasma de OPL (el tema <OPL>).
  HINT_COLORS_RESET: Devuelve los seis colores de arriba a los del tema.
  HINT_COVERFLOW_COUNT: Cuántas carátulas muestra RIPFLOW a cada lado de la elegida.
  HINT_COVERFLOW_SCALE: El tamaño de la carátula elegida en RIPFLOW respecto a las demás.
  HINT_COVERFLOW_ANIM: La velocidad a la que se deslizan las carátulas al moverte por el flujo.
  HINT_NARGS_QB: 'Quick Boot: salta la pantalla de inicio de Neutrino. Activado aquí, se envía para cada juego; desactivado, RIPPS2 lo envía igualmente por su cuenta para los juegos en USB, iLink y red, donde hace falta.'
  HINT_NARGS_DBC: 'Colores de depuración: Neutrino llena la pantalla de un color en cada paso de la carga, para que una foto muestre dónde se detiene un juego.'
  HINT_NARGS_LOGO: Muestra el logotipo de PS2 antes del juego (un segundo reinicio del IOP, que algunas unidades iLink necesitan). Desactivado aquí, RIPPS2 sigue Inicio de juegos > Logotipo de PS2, y nunca lo envía para juegos en MMCE o red.
  HINT_NARGS_CWD: 'La carpeta que el juego ve como suya. Vacío: la predeterminada de Neutrino.'
  HINT_NARGS_CFG: 'Un archivo de configuración de Neutrino propio (-cfg). Vacío: el de Neutrino.'
  HINT_NARGS_ELF: 'Inicia este ELF en lugar del archivo de arranque que indica el disco. Vacío: el del juego.'
  HINT_NARGS_ATA0: Una imagen de disco duro que Neutrino monta como disco duro interno de la consola, para los juegos que lo usan (-ata0).
  HINT_NARGS_ATA0ID: El archivo de identificación que acompaña a esa imagen de disco duro (-ata0id).
  HINT_NARGS_ATA1: Una segunda imagen de disco duro (-ata1).
  RIPPS2_LAST_USED: Último usado
  RIPPS2_PAGE_BUTTONS: Botones de página
  HINT_RIPPS2_PAGE_BUTTONS: 'Qué gatillos pasan las páginas de la lista de juegos. L2 / R2: pasan las páginas y L1 / R1 cambian de categoría. L1 / R1: pasan las páginas y L2 / R2 cambian de categoría. Tema: decide el tema; sin uno, L2 va al principio y R2 al final. L2 + R2 a la vez siempre eligen un juego al azar.'
  RIPPS2_IGR_MENU: Menú dentro del juego
  HINT_RIPPS2_IGR_MENU: 'Activado: L1+L2+R1+R2+SELECT+START pausa el juego: continuar, salir, hacer una captura, ver logros o apagar. Desactivado: la combinación sale del juego al instante, como antes.'
  RIPPS2_BOOT_LOADER: Cargador de arranque
  HINT_RIPPS2_BOOT_LOADER: Muestra lo que inicia cada tarjeta de memoria al encender, e instala BIBLE (PS2BBL preparado para RIPPS2). Los antiguos archivos de arranque de la tarjeta se conservan.
  RIPPS2_MANAGE: Gestionar
  RIPPS2_ACHIEVEMENTS: Logros
  RIPPS2_NBD_SERVER: Servidor NBD
  HINT_RIPPS2_NBD_SERVER: Comparte el disco duro con un PC por la red. Una pantalla de estado se queda visible mientras funciona.
  RIPPS2_START: Iniciar
  RIPPS2_COVER_ART: Carátulas
  HINT_RIPPS2_COVER_ART: Descarga una carátula para cada juego de PS2 de tus listas iniciadas que no la tenga, en la carpeta ART de esa unidad, desde ps2-covers de xlenore en GitHub. Necesita el cable de red e Internet.
  RIPPS2_DOWNLOAD: Descargar
  RIPPS2_GLYPHS: Iconos de la cruceta
  HINT_RIPPS2_GLYPHS: 'Los iconos de la cruceta junto a los nombres de unidades y formaciones. Aparecer los muestra al cambiar; Desvanecer los muestra al abrir una página. Tema: decide el tema.'
  RIPPS2_COLOR_THEME: Color del tema
  HINT_RIPPS2_COLOR_THEME: 'Un color para las torres, los orbes, el cristal, el reproductor de CD y el navegador de archivos, en las tres pestañas. Tema: decide el tema (azul RIPPS2 si no).'
  RIPPS2_HINTS: Ayuda de botones
  HINT_RIPPS2_HINTS: 'La ayuda de botones de la parte inferior. Desvanecer en reposo la oculta hasta que pulses un botón. Tema: decide el tema.'
  RIPPS2_CATEGORY_BAR: Barra de categorías
  HINT_RIPPS2_CATEGORY_BAR: 'INICIAR DISCO, ALMACENAMIENTO y ARCHIVOS DE MEMORIA en la parte superior. Desvanecer en reposo las oculta hasta que pulses un botón. Tema: decide el tema.'
  RIPPS2_SOURCE_NAME: Nombre del origen
  RIPPS2_STATUS: Estado
  RIPPS2_SOURCE: Origen
  HINT_RIPPS2_SOURCE_NAME: 'El nombre del origen sobre los juegos (TODOS LOS JUEGOS, JUEGOS HDD, etc.). Desvanecer en reposo lo desvanece con la barra de categorías; Emergente lo muestra grande en el centro de la página, como L3 nombra la lista, en la primera lista tras el arranque y cada vez que cambia el origen, y luego se desvanece. Los temas pueden hacer de Emergente su Visible. Tema: decide el tema.'
  RIPPS2_RECENTS: Mostrar recientes
  HINT_RIPPS2_RECENTS: Hasta este número de tus últimos juegos iniciados arriba de Juegos favoritos, del más nuevo al más antiguo. 0 lo desactiva.
  RIPPS2_CATEGORY_ORDER: Orden de categorías
  HINT_RIPPS2_CATEGORY_ORDER: 'Archivos de memoria primero e Iniciar disco al final. Pensado para RIPFLOW (Interfaz > Tema). Tema: decide el tema.'
  RIPPS2_MUSIC: Música
  HINT_RIPPS2_MUSIC: Reproduce los archivos bgm de la carpeta AUDIO junto a RIPPS2 y de la carpeta AUDIO de OPL en cada unidad iniciada (Ogg sin etiquetas, o WAV de 16 bits); el llamado Menu suena primero. La música propia de un tema suena en su lugar.
  RIPPS2_BIOS_SOUNDS: Sonidos de la BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Guarda los sonidos de menú de esta consola, sacados de su BIOS, en la carpeta AUDIO como sonidos de RIPPS2 (menos de 1 MB). La música del menú tiene su propia extracción: Música de la BIOS.'
  RIPPS2_RIP: Extraer
  RIPPS2_HINTS_GLYPHS: Ayuda e iconos
  HINT_RIPPS2_HINTS_GLYPHS: El aspecto de la ayuda de botones y de los iconos. Cada fila empieza en Tema, lo que eligió el tema; cualquier otra elección es tuya y se impone a todos los temas.
  RIPPS2_HINT_LAYOUT: Disposición de la ayuda
  HINT_RIPPS2_STARSIDE: 'Dónde se ve la estrella de un juego favorito en la lista. Izquierda: su propia columna al inicio de cada fila. Derecha: tras el título. Oculta: sin estrella. Tema: lo que diga el tema. El icono de fila del tema pasa al otro extremo, así nunca se solapan.'
  HINT_RIPPS2_HINT_LAYOUT: 'Fila: la ayuda en una línea. Columna: una ayuda por línea, en lista a un lado, empezando donde el tema pone su ayuda.'
  RIPPS2_HINT_LABELS: Etiquetas de la ayuda
  HINT_RIPPS2_HINT_LABELS: Solo icono dibuja solo los botones, para iconos que llevan sus propias palabras. Insignias junta el icono y el título de cada ayuda en una misma insignia.
  RIPPS2_HINT_MENU: Ayuda de Menú (START)
  RIPPS2_HINT_REFRESH: Ayuda de Actualizar (SELECT)
  RIPPS2_HINT_STAR: Ayuda de Favorito (R3)
  RIPPS2_HINT_VIEW: Ayuda de Vista (L3)
  HINT_RIPPS2_HINT_SHOW: Muestra u oculta esta ayuda. Su botón funciona igual.
  RIPPS2_GLYPH_SET: Juego de iconos
  HINT_RIPPS2_GLYPH_SET: 'Los iconos de los botones en cada página: los del tema, los de RIPPS2, Estándar (botones oscuros, símbolos en color) o Blanco (blanco sólido).'
  RIPPS2_HINT_ORDER: Orden de la ayuda
  HINT_RIPPS2_HINT_ORDER: Ordena la ayuda. Tema mantiene el orden del tema; Tu orden es el que se pone aquí.
  RIPPS2_HINT_ORDER_FOLLOW: Orden
  RIPPS2_GRID_LAYOUT: Disposición de la cuadrícula
  HINT_RIPPS2_GRID_LAYOUT: Cuántas carátulas caben en una página de la cuadrícula, con el espaciado de RIPPS2. Tema mantiene la del tema.
  RIPPS2_LAUNCH_DISC: Disco al iniciar
  HINT_RIPPS2_LAUNCH_DISC: El disco de un juego aparece al iniciarlo. Emergente se posa y se desvanece; Giro gira cada vez más rápido hasta que empieza el juego.
  RIPPS2_TRANSITION: Transición de página
  HINT_RIPPS2_TRANSITION: 'Cómo llega una página nueva al pasar a otra categoría: desde el color de fondo del tema, o desde un destello. Tema mantiene la elección del tema.'
  RIPPS2_CATEGORY_LAYOUT: Disposición de categorías
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Dónde van las tres categorías: sus nombres arriba, o iconos a lo largo de la barra lateral, cada una con un cajón de sus páginas (Izquierda en una lista lleva allí). Tema mantiene la del tema.'
  RIPPS2_CACHE: Caché
  HINT_RIPPS2_CACHE: 'Cómo se guarda la lista de juegos de cada origen para que su página se abra al momento: Fast Cache, la lista del disco duro interno y la Actualización automática.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: Cada origen guarda su última lista de juegos (RIPPS2.LST junto a sus carpetas CD y DVD) y la muestra en cuanto el origen responde; después vuelve a leer el origen en segundo plano. Desactivado lee cada lista primero de su origen, como antes.
  HINT_RIPPS2_VIGNETTE: Oscurece los bordes de cada carátula excepto la elegida, para que destaque. Débil es la mitad de Completo.
  RIPPS2_GRID_WIDE: Disposición de la cuadrícula en panorámico
  HINT_RIPPS2_GRID_WIDE: La página de la cuadrícula solo con imagen 16:9 (Panorámico, 720p, 1080i), donde las carátulas son más estrechas y caben más. Tema usa la del tema; Igual sigue la Disposición de la cuadrícula.
  RIPPS2_BGBLUR: Desenfoque del fondo
  HINT_RIPPS2_BGBLUR: La intensidad con que el cristal esmerilado desenfoca la imagen de fondo del juego. Tema usa el del tema (Débil en RIPGRID y Adapt).
  HINT_RIPPS2_HINT_SLOT: La ayuda en esta posición. La que estaba aquí pasa a la antigua posición de la elegida.
  PS1_SAVE_GUIDANCE: Las partidas de PS1 dependen de Ember o POPSTARTER; los ajustes de VMC de PS2 no se aplican.
  NEUTRINO_SHOW_ARGS: Mostrar los argumentos de inicio
  HINT_NEUTRINO_SHOW_ARGS: Antes de cada inicio con Neutrino, muestra todos los argumentos que recibirá Neutrino y pregunta si continuar. Atrás vuelve al menú sin iniciar.
  NEUTRINO_ARGS_CONFIRM: Neutrino se iniciará con estos argumentos. ¿Iniciar?
