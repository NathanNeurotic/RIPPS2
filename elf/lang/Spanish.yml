  There is no kept boot program on this HDD. Nothing was changed.: No hay ningún programa de arranque guardado en este disco duro. No se cambió nada.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Este disco duro no tiene partición __sysconf, así que la configuración de BIBLE debe ir en una tarjeta de memoria (PS2BBL lee primero la de una tarjeta), y no hay ninguna en ninguna ranura. Inserta una e inténtalo de nuevo.
