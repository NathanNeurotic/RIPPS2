  The security module would not start on this console. Nothing on the memory card was changed.: El módulo de seguridad no quiso iniciarse en esta consola. No se cambió nada en la tarjeta de memoria.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
