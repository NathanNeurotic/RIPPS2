  HINT_RIPPS2_HIDDEN_GAMES: Los juegos ocultos con Ocultar juego, en las unidades iniciadas. Vuelve a mostrar uno, o bórralo. Cada unidad guarda su propia lista.
  HINT_RIPPS2_BDM_DEVICES: 'Las unidades de las que BDM lee juegos: USB, MX4SIO, una PC Card CF, la unidad DVR de un DESR e iLink. El disco duro interno sigue el inicio del disco duro.'
  HINT_RIPPS2_SCREEN: 'La imagen del menú: modo de vídeo, pantalla ancha, dónde queda en el televisor (H-POS, V-POS) y overscan.'
  HINT_RIPPS2_LAYOUT: Dónde van las categorías y cómo entra una página, luego las portadas de RIPFLOW y la cuadrícula de RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Grosor del texto, el color del tema, la transición de colores y cada color.
  HINT_RIPPS2_TEXT_WEIGHT: 'Lo grueso que es el texto propio de RIPPS2: las ayudas de los ajustes, ESTADO y Acerca de. Normal es como antes; Medio y Negrita se leen mejor en una imagen suave.'
  HINT_RIPPS2_HDD_START: 'El disco duro interno, APA o exFAT: RIPPS2 lo lee sea cual sea y lo muestra una sola vez, como juegos del disco duro. Desactivado lo deja en paz.'
  HINT_RIPPS2_THEME_COLOR: El color propio del tema. Elige Personalizado como color del tema para elegirlo tú, como los colores del texto.
  HINT_RIPPS2_SWEEP: Cinco colores por los que pasa el tema, despacio y con suavidad. Arcoíris, una transición hecha de cada color de tema o la tuya. Desactivado deja el tema quieto.
  HINT_RIPPS2_SWEEP_COLORS: Los cinco colores de la transición y su velocidad. Cambia una de RIPPS2 y se guarda como tuya, con el nombre que le pongas.
  HINT_RIPPS2_SWEEP_NAME: Cómo se llama tu transición en la lista Transición de colores.
  HINT_RIPPS2_SWEEP_COLOR: Uno de los cinco colores por los que pasa la transición, en orden.
  HINT_RIPPS2_SWEEP_SPEED: 'Cuánto dura cada color antes de que entre el siguiente. Incluso Vivo sigue suave: los colores nunca parpadean.'
  RIPPS2_HIDE_COMPRESS: Ocultar juego y compresión
  HINT_RIPPS2_SELECT_HOLD: 'SELECT mantenido 4.2 s en una lista de juegos. Lista: los temas en un panel, elige uno. Rotación: el tema siguiente. Desactivado: nada (una pulsación sigue actualizando).'
