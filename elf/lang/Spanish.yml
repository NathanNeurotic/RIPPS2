  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 toca la música del menú de esta consola, la pieza ambiental de su navegador (%d:%02d), a partir de las propias notas de la BIOS y la guarda como un WAV de %s en %s; ninguna tarjeta de memoria tiene sitio para ella. Un %s que ya esté ahí se reemplaza. Tarda uno o dos minutos.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 toca la música del menú de esta consola, la pieza ambiental de su navegador (%d:%02d), a partir de las propias notas de la BIOS y la guarda como un WAV de %s; ninguna tarjeta de memoria tiene sitio para ella. Aceptar la guarda en %s, junto a RIPPS2. START la guarda en %s, los recursos de OPL en esa unidad. Un %s que ya esté ahí se reemplaza. Tarda uno o dos minutos.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 lee los sonidos de la propia BIOS de esta consola y los guarda en %s como sus sonidos: cursor, confirmar, cancelar, páginas, categoría, mensajes, disco, error, guardar, unidades y aleatorio, y la música de arranque y de inicio de juego, tocada a partir de las propias notas de la BIOS. Los archivos con esos nombres que ya estén ahí se reemplazan.'
