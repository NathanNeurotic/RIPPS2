    - Su configuración, mc%d:/PS2BBL/CONFIG.INI, inicia RIPPS2 desde %s, con BOOT LOCK activado.

    El procesador de E/S se reinicia para esto; la música y las unidades vuelven después. Deja la tarjeta puesta y la consola encendida hasta que diga que ha terminado.'
