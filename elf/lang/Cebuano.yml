  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Padagana ang xeRAbora client sa PC sa samang network, naka-sign in sa imong RetroAchievements account. Unya, alang sa dula sa USB, MMCE, SMB o HDD: ablihi ang game menu niini (TRIANGLE) ug pilia ang CHECK GAME SUPPORT. Makakuha og RA badge ang gisubay nga dula; kung naka-on ang TELEMETRY, sugdi kini ug mogawas ang mga unlock sa ibabaw sa dula. Alang sa disc sa tray, gamita ang SUSIHA ANG DISC, unya DULAA ANG DISC UBAN ANG MGA ACHIEVEMENT. Ang mga dula nga gisugdan pinaagi sa Neutrino, POPSTARTER o Ember wala pa masubay.'
