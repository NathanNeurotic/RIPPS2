  : 'Naka-install ang BIBLE sa memory card %d (mc%d:/%s/%s) ug naka-on ang BOOT LOCK: sa pag-on, dayon sugdan sa console ang RIPPS2 gikan sa %s.'
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'Naka-install ang BIBLE sa internal HDD ug naka-on ang BOOT LOCK: sa pag-on, dayon sugdan sa console ang RIPPS2 gikan sa %s%s%s%s. Config: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : Anaa ang BIBLE sa memory card %d, apan dili masulat ang config niini (%s), mao nga ang browser ang gisugdan niini. Pagbakante og lugar ug padagana pag-usab ang DUMALAHA aron mahuman.
  BIBLE ran out of memory before it started. Nothing was changed.: Nahutdan og memory ang BIBLE sa wala pa kini nagsugod. Walay giusab.
  BIBLE ran out of memory. Nothing on the memory card was changed.: Nahutdan og memory ang BIBLE. Walay giusab sa memory card.
  'BIBLE: binding PS2BBL to the memory card': 'BIBLE: gihigot ang PS2BBL sa memory card'
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: gikopya ang RIPPS2 sa %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: gitipigan ang boot program sa HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: gibalik ang boot program sa HDD'
  'BIBLE: restarting the I/O processor with the security module': 'BIBLE: gi-restart ang I/O processor uban ang security module'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: gisulat ang PS2BBL sa boot area sa HDD'
  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: Dili masulat sa BOOT LOCK ang PS2BBL config. Susiha nga dili naka-write-protect ang memory card o drive, unya sulayi pag-usab.
  BOOT LOCK found no PS2BBL config to change.: Walay nakit-ang PS2BBL config ang BOOT LOCK nga usbon.
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: Gipalong ang BOOT LOCK. Gisugdan sa PS2BBL ang gisugdan niini kaniadto (%s).
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : Gibuksan ang BOOT LOCK. Gisugdan na sa PS2BBL ang RIPPS2 sa pag-on (%s). Pindota og dugay ang usa ka PS2BBL hotkey samtang nagsugod ang console aron makaadto sa uban.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: Molihok ang BOOT LOCK pinaagi sa PS2BBL (PlayStation 2 Basic BootLoader), ug walay ingon niana sa bisan unsang memory card dinhi.
  INSTALL BIBLE: I-INSTALL ANG BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'I-INSTALL ANG BIBLE SA MEMORY CARD %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'I-INSTALL ANG BIBLE SA INTERNAL HDD

    - Gikopya ang RIPPS2 sa %s.

    - Gibasa ang boot program sa HDD nga anaa karon sa __mbr ug gitipigan sa %s/RIPPS2 (ibalik kini sa IBALIK).

    - Isulat ang HDD build sa PS2BBL 1.2.0 puli niini, ug i-set ang console aron sugdan kini sa pag-on.

    - Ang config niini (%s) mosugod una sa RIPPS2 gikan sa %s%s%s, naka-on ang BOOT LOCK.

    Kinahanglan niini ang console nga mo-boot gikan sa HDD niini (tambok nga PS2 nga adunay network adapter). Ayaw kini palonga hangtod moingon nga humana.'
  INTERNAL HDD  (its boot area): INTERNAL HDD  (ang boot area niini)
  MEMORY CARD %d  (%s): MEMORY CARD %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    Ang BIBLE mao ang PS2BBL 1.2.0 ni El Isra, nga gi-set up sa RIPPS2: walay paghulat sa pag-on, RIPPS2 una, ug ang button nga gipindot og dugay sa pag-on modala gihapon sa browser (TRIANGLE), sa disc (START) ug sa naa didto kaniadto (CIRCLE). I-install o ayohon kini sa memory card o sa internal HDD?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Ang memory card %d adunay %d KB nga libre, ug kinahanglan sa BIBLE ang %d KB didto. Pagbakante og lugar, unya sulayi pag-usab.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Ang memory card %d adunay %d KB nga libre, ug kinahanglan sa kopya sa RIPPS2 ang %d KB. Pagbakante og lugar o pagpili og laing dapit.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Gisugdan sa memory card %d ang %s sa pag-on, ug molihok lang ang BOOT LOCK pinaagi sa PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : Dili masugdan sa PS2BBL 1.2.0 ang RIPPS2 gikan sa kinahimutangan niini karon (maabot niini ang mga memory card, USB drive ug MX4SIO). Makakopya ang BOOT LOADER > DUMALAHA sa RIPPS2 ngadto sa memory card o USB drive alang niini.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : Gisugdan sa PS2BBL ang mga program gikan sa memory card, USB drive o MX4SIO, ug dili mabasa sa RIPPS2 ang iyang kaugalingon aron makopya didto. Sugdi ang RIPPS2 gikan sa usa niana, unya sulayi pag-usab.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'IBALIK ANG DAAN NGA BOOT PROGRAM SA HDD

    Ang gitipigan sa BIBLE (RIPPS2/MBR-BACKUP.KELF sa HDD) mobalik sa __mbr, puli sa BIBLE. Magpabilin ang RIPPS2 ug ang PS2BBL config kung asa sila.'
  RESTORE: IBALIK
  RESTORE THE HDD'S OLD BOOT PROGRAM: IBALIK ANG DAAN NGA BOOT PROGRAM SA HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : Dili mahibal-an sa RIPPS2 ang region niining console gikan sa ROM niini, mao nga wala kini mahibalo kung unsang system-update folder ang basahon niini. Wala na-install ang BIBLE.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : Dili maablihan sa RIPPS2 ang __sysconf o __common partition sa HDD (error %d), mao nga walay katipigan ang BIBLE sa RIPPS2 ug sa config niini didto. Walay giusab.
  RIPPS2 could not read the kept boot program. Nothing was changed.: Dili mabasa sa RIPPS2 ang gitipigang boot program. Walay giusab.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: Dili masulat pagbalik sa RIPPS2 ang boot program. Sulayi pag-usab; wala nahilabti ang gitipigang kopya.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'Busy ang RIPPS2 sa pagbasa sa drive ug dili ma-restart ang I/O processor. Walay giusab: sulayi pag-usab sa makadiyot.'
  Reading the memory cards: Gibasa ang mga memory card
  The HDD partition BIBLE uses went away. Nothing was changed.: Nawala ang HDD partition nga gigamit sa BIBLE. Walay giusab.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Nibalik na ang daan nga boot program sa HDD. Dili na mosugod ang BIBLE gikan sa HDD.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Dili ihigot sa console ang BIBLE sa memory card %d (napakyas ang MagicGate step niini). Walay giusab sa card. Ang card nga dili tinuod o dili tugma sa MagicGate dili makabaton og system update.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Ang naa didto gitipigan sa RIPPS2/MBR-BACKUP.KELF sa HDD: ibalik kini sa BOOT LOADER > DUMALAHA > IBALIK.'
  The security module would not start on this console. Nothing on the memory card was changed.: Dili mosugod ang security module niining console. Walay giusab sa memory card.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Walay naka-format nga PS2 memory card sa bisan unsang slot, ug walay internal HDD. Nagpuyo ang BIBLE sa memory card o sa HDD: pagsulod og card, unya sulayi pag-usab.'
  There is no kept boot program on this HDD. Nothing was changed.: Walay gitipigang boot program niining HDD. Walay giusab.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Walay __sysconf partition kining HDD, mao nga kinahanglan ibutang ang config sa BIBLE sa memory card (basahon una sa PS2BBL ang card), ug walay card sa bisan unsang slot. Pagsulod og usa, unya sulayi pag-usab.
