  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: Dili mahibal-an sa RIPPS2 kung asa ang folder niini, mao nga walay mabutangan sa mga tunog.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : Gitugtog sa RIPPS2 ang menu music niining console, ang ambient piece sa browser niini (%d:%02d), gikan sa kaugalingong nota sa BIOS ug gisulat kini isip WAV nga %s sa %s; walay memory card nga adunay lugar niini. Ilisan ang %s nga anaa na didto. Molungtad kini og usa o duha ka minuto.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : Gitugtog sa RIPPS2 ang menu music niining console, ang ambient piece sa browser niini (%d:%02d), gikan sa kaugalingong nota sa BIOS ug gisulat kini isip WAV nga %s; walay memory card nga adunay lugar niini. Isulat kini sa Accept sa %s, tupad sa RIPPS2. Isulat kini sa START sa %s, ang resources sa OPL niadtong drive. Ilisan ang %s nga anaa na didto. Molungtad kini og usa o duha ka minuto.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'Gibasa sa RIPPS2 ang mga tunog gikan sa kaugalingong BIOS niining console ug gisulat kini sa %s isip iyang mga tunog: cursor, confirm, cancel, mga page, category, mga mensahe, disc, error, save, mga drive ug random, ug ang musika sa pag-boot ug paglansad sa dula, gitugtog gikan sa kaugalingong nota sa BIOS. Ilisan ang mga file nga ingon niana og ngalan nga anaa na didto.'
