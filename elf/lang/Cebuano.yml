  HINT_COLORS_PLASMA: Ang kolor nga gisagolan sa daan nga OPL plasma background (ang <OPL> nga tema).
  HINT_COLORS_RESET: Ibalik ang unom ka kolor sa ibabaw sa kaugalingong kolor sa tema.
  HINT_COVERFLOW_COUNT: Pila ka cover ang gipakita sa RIPFLOW sa matag kilid sa gipili.
  HINT_COVERFLOW_SCALE: Unsa kadako gidrowing sa RIPFLOW ang gipiling cover kumpara sa uban.
  HINT_COVERFLOW_ANIM: Unsa kapaspas mo-slide ang mga cover samtang naglihok ka sa flow.
  HINT_NARGS_QB: 'Quick Boot: laktawan ang kaugalingong start-up screen sa Neutrino. Kung naka-on dinhi, ipadala kini sa matag dula; kung naka-off, ipadala gihapon kini sa RIPPS2 alang sa USB, iLink ug network nga dula, diin kini kinahanglan.'
  HINT_NARGS_DBC: 'Debug Colors: pun-on sa Neutrino ang screen og kolor sa matag lakang sa pag-load, mao nga makita sa litrato kung asa mihunong ang dula.'
  HINT_NARGS_LOGO: Ipakita ang PS2 logo sa dili pa ang dula (ikaduhang IOP reboot, nga kinahanglan sa pipila ka iLink drive). Kung naka-off dinhi, sundan sa RIPPS2 ang Game Launching > PS2 Logo, ug dili gyud kini ipadala alang sa MMCE o network nga dula.
  HINT_NARGS_CWD: 'Ang folder nga makita sa dula isip iyaha. Blangko: default sa Neutrino.'
  HINT_NARGS_CFG: 'Imong kaugalingong Neutrino config file (-cfg). Blangko: ang sa Neutrino.'
  HINT_NARGS_ELF: 'Sugdan kining ELF puli sa boot file nga ginganlan sa disc. Blangko: ang sa dula mismo.'
  HINT_NARGS_ATA0: HDD image nga i-mount sa Neutrino isip internal HDD sa console, alang sa mga dula nga mogamit sa HDD (-ata0).
  HINT_NARGS_ATA0ID: Ang ID file nga kauban niadtong HDD image (-ata0id).
  HINT_NARGS_ATA1: Ikaduhang HDD image (-ata1).
  RIPPS2_LAST_USED: Katapusang gigamit
  RIPPS2_PAGE_BUTTONS: Mga button sa page
  HINT_RIPPS2_PAGE_BUTTONS: 'Unsang shoulder button ang mobalhin sa page sa lista sa dula. L2 / R2: sila ang mobalhin sa page ug ang L1 / R1 mobalhin sa category. L1 / R1: sila ang mobalhin sa page ug ang L2 / R2 mobalhin sa category. Tema: ang tema ang modesisyon; kung wala, moadto sa taas ang L2 ug sa katapusan ang R2. Ang L2 + R2 nga dungan kanunay mopili og random nga dula.'
  RIPPS2_IGR_MENU: Menu sulod sa dula
  HINT_RIPPS2_IGR_MENU: 'Naka-on: ang L1+L2+R1+R2+SELECT+START mo-pause sa dula: padayon, gawas, pagkuha og screenshot, tan-awa ang achievements, o palonga. Gipalong: ang combo mogawas dayon sa dula, sama kaniadto.'
  RIPPS2_BOOT_LOADER: Boot Loader
  HINT_RIPPS2_BOOT_LOADER: Ipakita kung unsa ang gisugdan sa matag memory card sa pag-on, ug mag-install og BIBLE (PS2BBL nga gi-set alang sa RIPPS2). Gitipigan ang daang boot file sa card.
  RIPPS2_MANAGE: Dumalaha
  RIPPS2_ACHIEVEMENTS: Mga achievement
  RIPPS2_NBD_SERVER: NBD server
  HINT_RIPPS2_NBD_SERVER: Ipaambit ang hard drive sa PC pinaagi sa network. Magpabilin ang status screen samtang nagdagan kini.
  RIPPS2_START: Sugdi
  RIPPS2_COVER_ART: Mga cover
  HINT_RIPPS2_COVER_ART: Mag-download og cover alang sa matag PS2 nga dula sa imong gisugdang mga lista nga wala pay cover, ngadto sa ART folder niadtong drive, gikan sa ps2-covers ni xlenore sa GitHub. Kinahanglan ang network cable ug internet.
  RIPPS2_DOWNLOAD: I-download
  RIPPS2_GLYPHS: Mga D-pad glyph
  HINT_RIPPS2_GLYPHS: 'Mga D-pad glyph tupad sa ngalan sa drive ug formation. Ipakita sila sa Fade In kung mobalhin ka; ipakita sila sa Fade Out samtang maabli ang page. Tema: ang tema ang modesisyon.'
  RIPPS2_COLOR_THEME: Kolor sa tema
  HINT_RIPPS2_COLOR_THEME: 'Usa ka kolor alang sa mga tore, orb, glass, CD player ug file browser, sa tulo ka tab. Tema: ang tema ang modesisyon (asul sa RIPPS2 kung dili kini modesisyon).'
  RIPPS2_HINTS: Mga hint sa button
  HINT_RIPPS2_HINTS: 'Ang mga hint sa button sa ubos. Itago sila sa Fade When Idle hangtod mopindot ka og button. Tema: ang tema ang modesisyon.'
  RIPPS2_CATEGORY_BAR: Category bar
  HINT_RIPPS2_CATEGORY_BAR: 'SUGDI ANG DISC, STORAGE ug MEMORY FILES sa taas. Itago sila sa Fade When Idle hangtod mopindot ka og button. Tema: ang tema ang modesisyon.'
  RIPPS2_SOURCE_NAME: Ngalan sa source
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Source
  HINT_RIPPS2_SOURCE_NAME: 'Ang ngalan sa source ibabaw sa mga dula (TANANG DULA, HDD GAMES ug uban pa). I-fade kini sa Fade When Idle uban sa category bar; ipakita kini sa Pop In nga dako sa tunga sa page, sama sa pagngalan sa L3 sa lista, sa unang lista human sa pag-boot ug matag usab sa source, unya mawala. Mahimo sa mga tema nga ang Pop In ang ilang Shown. Tema: ang tema ang modesisyon.'
  RIPPS2_RECENTS: Ipakita ang bag-o lang
  HINT_RIPPS2_RECENTS: Hangtod niining gidaghanon sa imong katapusang gilansad nga dula sa taas sa Mga Paborito, ang pinakabag-o una. Ang 0 mopalong niini.
  RIPPS2_CATEGORY_ORDER: Han-ay sa category
  HINT_RIPPS2_CATEGORY_ORDER: 'Memory Files una ug Sugdi ang Disc sa katapusan. Gihimo alang sa RIPFLOW (Interface > Theme). Tema: ang tema ang modesisyon.'
  RIPPS2_MUSIC: Musika
  HINT_RIPPS2_MUSIC: Gitugtog ang mga bgm file sa AUDIO folder tupad sa RIPPS2 ug sa AUDIO folder sa OPL sa matag nasugdang drive (Ogg nga walay tag, o 16-bit nga WAV); una nga motugtog ang ginganlan og Menu. Ang kaugalingong musika sa tema ang motugtog kung naa.
  RIPPS2_BIOS_SOUNDS: Mga tunog sa BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Isulat ang kaugalingong menu sound niining console gikan sa BIOS niini ngadto sa AUDIO folder isip mga tunog sa RIPPS2 (ubos sa 1 MB). Lahi nga rip ang menu music: BIOS Music.'
  RIPPS2_RIP: I-rip
  RIPPS2_HINTS_GLYPHS: Mga hint ug glyph
  HINT_RIPPS2_HINTS_GLYPHS: Ang dagway sa mga hint sa button ug glyph. Magsugod ang matag row sa Tema, ang gipili sa tema; bisan unsang laing pagpili imo ug mas una sa matag tema.
  RIPPS2_HINT_LAYOUT: Layout sa hint
  HINT_RIPPS2_STARSIDE: 'Asa ibutang ang bitoon sa starred nga dula sa lista. Wala: kaugalingong column sa sinugdanan sa matag row. Tuo: human sa titulo. Tago: walay bitoon. Theme: sumala sa theme. Mobalhin sa pikas tumoy ang row icon sa theme aron dili sila magpatong.'
  HINT_RIPPS2_HINT_LAYOUT: 'Row: ang mga hint sa usa ka linya. Column: usa ka hint matag linya, lista sa kilid, sugod kung asa ibutang sa tema ang mga hint niini.'
  RIPPS2_HINT_LABELS: Mga label sa hint
  HINT_RIPPS2_HINT_LABELS: Gidrowing ra sa Glyph ra ang mga button, alang sa mga glyph nga adunay kaugalingong pulong. Gihiusa sa Mga badge ang glyph ug titulo sa matag hint sa usa ka badge.
  RIPPS2_HINT_MENU: Hint sa menu (START)
  RIPPS2_HINT_REFRESH: Hint sa refresh (SELECT)
  RIPPS2_HINT_STAR: Hint sa paborito (R3)
  RIPPS2_HINT_VIEW: Hint sa view (L3)
  HINT_RIPPS2_HINT_SHOW: Ipakita o itago kining hint. Molihok gihapon ang button niini.
  RIPPS2_GLYPH_SET: Glyph set
  HINT_RIPPS2_GLYPH_SET: 'Ang mga glyph sa button sa matag page: ang sa tema, ang sa RIPPS2, Standard (ngitngit nga button, kolor nga simbolo) o Puti (tibuok puti).'
  RIPPS2_HINT_ORDER: Han-ay sa hint
  HINT_RIPPS2_HINT_ORDER: Gihan-ay ang mga hint. Gitipigan sa Tema ang han-ay sa tema; ang Imong pagkasunod mao ang gi-set dinhi.
  RIPPS2_HINT_ORDER_FOLLOW: Han-ay
  RIPPS2_GRID_LAYOUT: Grid layout
  HINT_RIPPS2_GRID_LAYOUT: Pila ka cover ang masulod sa usa ka Grid page, uban ang spacing sa RIPPS2. Gitipigan sa Tema ang kaugalingong layout sa tema.
  RIPPS2_LAUNCH_DISC: Disc sa paglansad
  HINT_RIPPS2_LAUNCH_DISC: Mosulod ang disc sa dula samtang ilansad kini. Mohunong ug mawala ang Pop In; motuyok og mas paspas ang Tuyok hangtod magsugod ang dula.
  RIPPS2_TRANSITION: Transition sa page
  HINT_RIPPS2_TRANSITION: 'Giunsa pagsulod ang bag-ong page kung moadto ka sa laing category: gikan sa kolor sa background sa tema, o gikan sa flash. Gitipigan sa Tema ang gipili sa tema.'
  RIPPS2_CATEGORY_LAYOUT: Layout sa category
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Asa makita ang tulo ka category: ang ilang mga ngalan sa ibabaw, o mga icon paubos sa sidebar, matag usa adunay drawer sa iyang mga page (ang Wala sa usa ka lista moadto didto). Gitipigan sa Tema ang kaugalingong layout sa tema.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Giunsa pagtipig ang lista sa dula sa matag tinubdan aron dayon maabli ang iyang page: Fast Cache, ang lista sa internal HDD ug ang Automatic Refresh.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: Ang matag tinubdan magtipig sa iyang katapusang lista sa dula (RIPPS2.LST tupad sa iyang CD ug DVD nga mga folder) ug ipakita kini dayon sa pagtubag sa tinubdan, unya basahon pag-usab ang tinubdan sa background. Kung Off, basahon una ang matag lista gikan sa tinubdan, sama kaniadto.
  HINT_RIPPS2_VIGNETTE: Ngitngitan ang mga ngilit sa matag cover gawas sa gipili, aron mabantog ang gipili. Ang Huyang tunga sa Puno.
  RIPPS2_GRID_WIDE: Widescreen grid layout
  HINT_RIPPS2_GRID_WIDE: Ang Grid page sa 16:9 nga hulagway ra (Widescreen, 720p, 1080i), diin mas niwang ang mga cover ug mas daghan ang masulod. Gigamit sa Tema ang layout sa tema; gisundan sa Pareho ang Grid layout.
  RIPPS2_BGBLUR: Blur sa background
  HINT_RIPPS2_BGBLUR: Unsa kakusog gi-blur sa frosted glass ang background art sa dula. Gigamit sa Tema ang kaugalingong value sa tema (Huyang sa RIPGRID ug Adapt).
  HINT_RIPPS2_HINT_SLOT: Ang hint niining dapit. Mobalhin ang hint nga ania dinhi sa daang dapit sa gipiling hint.
  PS1_SAVE_GUIDANCE: Nagdepende sa Ember o POPSTARTER ang mga PS1 save; dili magamit ang mga PS2 VMC setting.
  NEUTRINO_SHOW_ARGS: Ipakita ang mga launch argument
  HINT_NEUTRINO_SHOW_ARGS: Sa dili pa ang matag paglansad sa Neutrino, ipakita ang matag argument nga madawat sa Neutrino ug mangutana kung magpadayon. Mobalik sa menu ang Back nga walay paglansad.
  NEUTRINO_ARGS_CONFIRM: Magsugod ang Neutrino gamit kini nga mga argument. Ilansad?
  HINT_NARGS_EXTRA: Ubang Neutrino flag, gibulag sa espasyo, nga ipadala human sa tanan sa ibabaw. Kanunay idugang sa RIPPS2 ang -bsd ug -dvd alang sa drive ug ISO sa dula, -mc0 ug -mc1 alang sa mga VMC niini, -gsm alang sa video mode niini, ug ang kaugalingong compatibility mode sa dula. Ang flag nga adunay kaugalingong row sa ibabaw (sama sa -logo) mobalhin sa maong row sa pag-save, ug ipadala gihapon.
  HINT_RIPPS2_THEME: Ang dagway sa matag page. Sa lista sa dula, pindota og dugay ang SELECT sulod sa 4.2 ka segundo aron mobalhin sa sunod nga tema; ang paspas nga pindot sa SELECT mo-refresh gihapon sa lista.
  GAME_TYPE_LABELS: Ipakita ang mga label nga [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Dili ma-save ang cheat list sa Neutrino folder, mao nga dili kini magamit sa Neutrino. Ilansad nga walay cheat?
  AUTO_CREATE_VMC: Paghimo og VMC sa unang paglansad
  HINT_AUTO_CREATE_VMC: Ang paglansad sa PS2 nga dula nga walay VMC sa slot 1 mohimo og 8 MB nga card sa device sa dula, nga ginganlan sumala sa gisugyot sa VMC screen (gipaambit sa matag disc sa dula), ug itudlo kini. Dili alang sa internal HDD ilalom sa Neutrino.
  AUTO_VMC_CREATING: Gihimo ang VMC niining dula...
  AUTO_VMC_FAILED: Dili mahimo ang VMC niining dula. Magsugod ang dula nga wala niini.
  RIPPS2_BIOS_MUSIC: BIOS Music
  HINT_RIPPS2_BIOS_MUSIC: 'Isulat ang menu music niining console (ang ambient piece sa browser niini, mga 15 MB isip WAV) sa AUDIO folder nga imong pilion: tupad sa RIPPS2, o ang sa OPL sa nasugdang drive. Dako kaayo alang sa memory card. Unang ipakita ang gidak-on niini.'
  SAVE_ICONS: Mga 3D save icon
  HINT_SAVE_ICONS: Ipakita ang nagtuyok nga save icon sa gipiling dula, kung asa adunay lugar ang tema alang niini. Basahon una ang kaugalingong VMC sa dula, unya ang mga memory card.
  NETBOOT_RESTART_NOW: Mausab ang network protocol human sa restart. I-save ang settings ug i-restart ang OPL karon?
  HINT_NET_PROTOCOL: 'Unsang network service ang gigamit sa RiptOPL: SMB share, UDPFS, UDPBD o HTTP. Pareho nga setting sa Game Sources. Kinahanglan og restart aron mobalhin gikan sa nagdagan na.'
  HINT_UDPFS_ACCESS: UDPFS ra. Gibasa sa Files ang bulag nga mga ISO gikan sa games folder sa server; gibasa sa IMG ang disk image isip drive. Kanunay Files ang SMB ug HTTP, kanunay IMG ang UDPBD.
  HINT_SMB_VERSION: Unsang bersyon sa SMB ang gamiton sa PC share.
  HINT_NET_ADVANCED: I-unlock ang Ethernet Link Mode ug ang SMB Port aron ma-edit.
  HINT_ETH_LINK_MODE: Pugson ang katulin ug duplex sa network link. Biyai sa Auto gawas kung kanunay maputol ang link.
  HINT_IP_ADDR_TYPE: Gigamit sa Static ang address sa ubos; mangutana ang DHCP sa imong router. Kanunay Static ang UDPFS ug UDPBD.
  HINT_PS2_IP: Ang kaugalingong IP address sa PS2. Pagpili og wala gigamit sa ubang device, sa samang range sa imong PC.
  HINT_NETMASK: Subnet mask, kasagaran 255.255.255.0.
  HINT_GATEWAY: Address sa imong router, kasagaran pareho ang unang tulo ka numero ug matapos sa .1.
  HINT_DNS: Address sa DNS server. Kasagaran pareho sa gateway.
  HINT_SMB_ADDR_TYPE: Abton ang PC pinaagi sa IP address niini o sa NetBIOS (computer) name niini.
  HINT_SMB_ADDRESS: 'Ang PC nga nagpaambit sa imong mga dula: ang IP address niini, o ang computer name niini kung NetBIOS ang Address Type.'
  HINT_SMB_PORT: 'SMB port. Kinahanglan motugma sa PC: 1111 ang gamit sa PS2 Servers, 445 ang gamit sa Windows ug Samba share.'
  HINT_SMB_USER: SMB user name. Molihok ang guest sa kadaghanan sa share.
  HINT_HTTP_SERVER: IP address sa HTTP game server.
  HINT_HTTP_PORT: Port nga gipaminawan sa HTTP game server.
  HINT_HTTP_BASE: Folder sa HTTP server nga adunay games.csv. Ang / mao ang root sa server.
  HINT_HTTP_TEST: Sulayan ang HTTP server gamit ang mga value sa ibabaw ug ireport ang nakit-an niini.
  HINT_RA_TELEMETRY: Main switch alang sa RetroAchievements. Ilansad sa Off ang mga dula nga walay network stack o snapshot, sama sa normal nga build.
  HINT_RA_BADGES: Markahan sa lista ang mga dula nga adunay achievement. Magpabiling ngitngit samtang gipalong ang telemetry.
  HINT_POPS_NET_BUTTON: I-edit ang kaugalingong network file sa POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), nga kinahanglan sa mga PS1 nga dula sa SMB.
  HINT_POPS_IP_TYPE: 'Giunsa pagkuha sa PS2 ang address niini samtang nagdagan ang PS1 nga dula sa SMB: Static o DHCP.'
  HINT_POPS_IP: Ang IP address sa PS2 samtang nagdagan ang PS1 nga dula sa SMB.
  HINT_POPS_SMB_IP: IP address sa PC nga nagpaambit sa imong mga PS1 nga dula.
  HINT_POPS_SMB_SHARE: Ngalan sa share niadtong PC nga adunay POPS folder.
  HINT_LASTPLAYED: Magsugod sa dula nga imong gilansad sa katapusang higayon.
  HINT_LANGUAGE: Pinulongan sa menu. Pagdugang pa pinaagi sa pagbutang og mga lang_*.lng file sa LNG folder.
  HINT_GSM_DEFAULTS_BUTTON: Mga ayo sa video mode nga makuha sa matag dula gawas kung adunay kaugalingong GSM settings.
  HINT_DEFDEVICE: Ang page nga ablihan sa RiptOPL sa pag-boot.
  HINT_MMCE_MODE: Mga dula sa SD2PSX o MemCard PRO2. Mosugod ang Auto sa pag-boot, ang Manwal kung ablihan nimo ang page, itago kini sa Off.
  HINT_MMCE_SETTINGS_BUTTON: Mga opsyon sa slot, IGR bootcard, GameID ug timing alang sa MMCE.
  HINT_ENABLE_USB: I-load ang USB storage driver.
  HINT_ENABLE_MX4SIO: I-load ang driver sa MX4SIO SD card adapter.
  HINT_ENABLE_ILINK: I-load ang iLink (FireWire) storage driver.
  HINT_NETSTART: 'Sugdan ang network: Auto sa pag-boot, Manwal kung ablihan nimo ang page niini. Dili hilabtan sa Off ang network adapter.'
  HINT_APPMODE: Ang Apps page. Mosugod ang Auto sa pag-boot, ang Manwal kung ablihan nimo kini, itago kini sa Off.
  HINT_FAVMODE: Ang page sa Mga Paborito. Mosugod ang Auto sa pag-boot, ang Manwal kung ablihan nimo kini, itago kini sa Off.
  HINT_BDMA_BUTTON: Unsang exFAT driver ang gigamit sa POPSTARTER alang sa PS1 nga dula sa USB, MX4SIO, MMCE, HDD o iLink.
  HINT_VCD_LIST_BUTTON: 'Giunsa paglista ang PS1 nga dula: itago ang game ID, ipakita ra ang disc 1, ipakita ang HDD PP partition.'
  HINT_MMCE_SLOT: Asang memory card slot ang kabutangan sa MMCE device. Pangitaon kini sa Auto.
  HINT_MMCE_GAMEID: Sultihan ang MMCE device kung unsang dula ang nagsugod, aron makabalhin kini sa memory card sa maong dula.
  HINT_MMCE_COMM_BUTTON: Mga opsyon sa timing alang sa MMCE link. Usba lang kung mo-freeze o hinay mo-load ang mga dula.
  HINT_MMCE_PATH_BUTTON: Kung asa sa MMCE card ang mga game folder.
  HINT_MMCE_PREFIX: Subfolder sa MMCE card nga adunay CD, DVD ug ubang OPL folder. Ang root sa card ang gamiton kung blangko.
  HINT_GAME_TYPE_LABELS: Sugdan ang matag ngalan sa dula sa [PS1] o [PS2]. Pagpakita ra.
  HINT_MENU_VMODE: Video output alang sa menu. GSM ang gamit sa mga dula. Pindota og dugay ang Confirm aron tipigan ang bag-ong mode.
  HINT_THEME: Ang dagway sa menu. Basahon ang mga tema gikan sa THM folder sa matag device.
  HINT_COVERFLOW_BUTTON: Gidaghanon sa cover, gidak-on, animation ug pagngitngit alang sa Coverflow nga tema.
  HINT_ARTWORK_BUTTON: 'Unsang art ang i-load: mga cover, disc art, background ug save icon.'
  HINT_COLORS_BUTTON: Mga kolor sa text, highlight, dialog ug background.
  HINT_NOTIFICATIONS: Mubo nga pahibalo kung mag-load ang config, tema o language file.
  HINT_AUTOSORT: Han-ayon ang mga lista sa dula gikan A ngadto Z. Tipigan sa Off ang han-ay kung giunsa sila pagkakita.
  HINT_AUTOREFRESH: Idugang ang mga dula gikan sa bag-ong nakonektang device nga walay mano-manong refresh.
  HINT_COVERART: I-load ang cover art gikan sa ART folder.
  HINT_DISCART: Ipakita ang disc art (<ID>_ICO). Itago sa Off ang disc apan tipigan ang mga cover ug background.
  HINT_BGART: Ipakita ang background sa dula (<ID>_BG) kung gigamit kini sa tema.
  HINT_ART_TAR: Basahon usab ang art nga naka-pack sa ART/art.tar.
  HINT_ART_DELAY: Unsa kadugay mohunong ang cursor sa dula sa dili pa mo-load ang art niini. Laktawan sa mas taas ang art samtang paspas ka nga nag-scroll.
  HINT_TXTCOLOR: Kolor sa normal nga text sa menu.
  HINT_SELCOLOR: Kolor sa naka-highlight nga item.
  HINT_UICOLOR: Kolor sa background sa mga dialog box.
  HINT_TITLECOLOR: Kolor sa mga titulo sa dula sa lista.
  HINT_BGCOLOR: Kolor sa background sa menu.
  HINT_PLASCOLOR: Kolor nga gisagol sa animated nga background.
  HINT_RESETCOLOR: Ibalik ang built-in nga kolor sa RiptOPL, dili ang sa tema.
  HINT_WIDESCREEN: Drowingon ang menu alang sa 16:9 nga TV.
  HINT_XOFF: Ibalhin ang menu sa wala o tuo sa screen.
  HINT_YOFF: Ibalhin ang menu pataas o paubos sa screen.
  HINT_MENU_OVERSCAN: Pagamyon ang menu pasulod kung putlon sa TV ang mga ngilit niini.
  HINT_APPLYGAMEID: Magpakita og barcode samtang nagsugod ang dula, aron mobalhin og profile ang mga Pixel FX, RetroGEM ug PS2Digital device.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Path, video mode ug mga argument sa Neutrino alang sa matag dula.
  HINT_OSD_DEFAULTS_BUTTON: Pinulongan sa console, gidak-on sa screen ug video mode nga ihatag sa mga dula.
  HINT_ENWRITEOP: Tugotan ang pag-ilis sa ngalan ug pagpapas sa mga dula ug paghimo og mga VMC. Dili gyud hilabtan ang partition table sa HDD.
  HINT_DEBUG: 'Tabang alang sa developer: kolor nga screen samtang nag-boot ang dula, ug mga counter sa pag-load sa art sa menu.'
  HINT_BDMPREFIX: Subfolder sa USB, MX4SIO, iLink ug exFAT drive nga adunay mga game folder. Ang root sa drive ang gamiton kung blangko.
  HINT_ETHPREFIX: Subfolder sa SMB share nga adunay mga game folder. Ang root sa share ang gamiton kung blangko.
  HINT_HDDGAMELISTCACHE: Hinumdoman ang lista sa dula sa APA HDD aron mopaspas ang sunod nga mga scan.
  HINT_BDMCACHE: Read-ahead cache alang sa USB ug ubang BDM drive samtang nagdula. Ang mas dako makapahapsay sa streaming apan mogamit og mas daghang memory.
  HINT_HDDCACHE: Read-ahead cache alang sa internal HDD samtang nagdula.
  HINT_SMBCACHE: Read-ahead cache alang sa SMB samtang nagdula.
  HINT_CORE_LOADER: Core alang niining dula kung asa suportado ang duha. Neutrino ra ang UDPFS/UDPBD; <OPL> ra ang SMB/HTTP. Gisundan sa Default ang Game Launching.
  HINT_DMA_MODE: Transfer mode sa internal HDD alang niining dula. Paubsa kini kung mag-utal o mo-freeze ang dula.
  HINT_DNAS_GAMEID: Disc ID alang sa DNAS online nga dula. Basahon kini sa Load From Disc gikan sa orihinal nga disc.
  HINT_LOAD_FROM_DISC: Basahon ang DNAS ID gikan sa orihinal nga disc sa drive.
  HINT_ALTSTARTUP: I-boot kining ELF gikan sa disc image puli sa ginganlan sa SYSTEM.CNF.
  HINT_VMC_DEFINE: Pagpili, paghimo o usba ang gidak-on sa virtual memory card niining slot.
  HINT_VMC_ACTION: Hatagan sa Use Generic kining slot og gipaambit nga card; papason sa Reset ang pagpili.
  HINT_VMC_NAME: Ngalan sa card file, gitipigan sa VMC folder.
  HINT_VMC_CREATE: Himoon ang card, o ipadapat niini ang bag-ong gidak-on.
  HINT_VMC_DELETE: Papason kining card file.
  HINT_SETTINGS_SOURCE: Gigamit sa Global ang gipaambit nga settings; gitipigan sa Matag dula kini alang niining dula ra.
  HINT_PADMACRO_TOGGLE: Pahinayon sa While Button Pressed ang stick samtang gikuptan ra nimo ang button; i-on ug i-off kini sa Toggled By Button.
  HINT_SFX: Mga sound effect sa menu.
  HINT_BOOT_SND: Magpatugtog og tunog kung magsugod ang RiptOPL.
  HINT_BGM: Gitugtog ang musika sa tema, o ang imong Default Theme Music file.
  HINT_SFX_VOLUME: Kakusog sa mga sound effect sa menu.
  HINT_BOOT_SND_VOLUME: Kakusog sa tunog sa pagsugod.
  HINT_BGM_VOLUME: Kakusog sa background music.
  HINT_SCROLL: Unsa kapaspas mag-scroll ang mga lista samtang gikuptan nimo ang usa ka direksyon.
  HINT_SELECTBUTTON: 'Unsang button ang mokumpirma: Cross o Circle.'
  HINT_XSENSITIVITY: Unsa kadali ibalhin sa wala nga stick ang cursor sa wala ug tuo. Ibaliwala kini sa Off.
  HINT_YSENSITIVITY: Unsa kadali ibalhin sa wala nga stick ang cursor pataas ug paubos. Ibaliwala kini sa Off.
  HINT_PADEMU_GLOBAL: DualShock 3/4 sa USB o Bluetooth, ug multitap, alang sa matag dula.
  HINT_PADMACRO_GLOBAL: Pagpahinay sa stick, pag-invert sa axis ug turbo alang sa matag dula.
  HINT_COVERFLOW_DIM: Ngitngitan ang mga cover sa kilid.
  HINT_OSD_ENABLE: Ihatag sa dula ang mga setting sa ubos. Ang kaugalingong setting sa console ang gamit sa Off.
  HINT_OSD_TVASPECT: Porma sa TV nga ihatag sa dula.
  HINT_OSD_VMODE: Video mode nga ihatag sa dula.
  DNAS_ID: DNAS ID
  NEUTRINO_PADEMU_WARN: Dili magamit ang pad emulation sa Neutrino. Gamita ang PS2 controller o source nga mosuporta sa <OPL> core.
  RA_MODE: RA mode
  RA_HOST_IP: IP sa RA companion (0.0.0.0 = awtomatiko)
  HINT_RA_HOST_IP: Opsyonal nga gipahinungod nga IPv4 sa PC alang sa RetroAchievements. Gamita ang 0.0.0.0 alang sa daang SMB/HTTP fallback o Xerabora discovery. Dili kini mousab sa settings sa game server.
  HINT_RA_MODE: Pilia ang PC client. Xerabora ang default; susihon una sa Caduceus ang naka-sign-in nga session niini.
  RA_CADUCEUS_OFFLINE: Offline ang Caduceus RA session.
  RA_CADUCEUS_SIGN_IN: Pag-sign in sa RetroAchievements sa Caduceus, unya sulayi pag-usab.
  FAV_SAVING: Gi-save sa Mga Paborito...
  FAV_SAVED: Na-save sa Mga Paborito
  FAV_SAVE_FAILED: Dili ma-save sa Mga Paborito
  CAD_ACHIEVEMENTS: Mga achievement sa Caduceus
  CAD_VIEW_ACHIEVEMENTS: Tan-awa ang mga achievement
  CAD_USE_LIBRARY: I-browse kining dula pinaagi sa Caduceus achievements sa main menu.
  CAD_HASH_UNSUPPORTED: Dili ma-hash kining format. I-browse na lang ang library sa account.
  CAD_HEADING: MGA ACHIEVEMENT
  CAD_LIBRARY: Library sa RetroAchievements account
  CAD_FILTER_ALL: Tanan
  CAD_EARNED: Nakuha
  CAD_LOCKED: Naka-lock
  CAD_HARDCORE: Hardcore
  CAD_PROGRESS: '%d / %d nakuha  |  %s'
  CAD_ONE_GAME: '%d ka dula sa account'
  CAD_GAMES: '%d ka dula sa account'
  CAD_GAME_PROGRESS: '%d / %d ka achievement  |  %d hardcore'
  CAD_POINTS: '%d pts  |  %s'
  CAD_EMPTY_LIBRARY: Walay dula nga adunay progreso niining account.
  CAD_EMPTY_FILTER: Walay achievement nga motugma niining filter.
  CAD_LOADING: Gi-load ang mga achievement...
  CAD_PAIR: Pag-sign in sa Caduceus ug i-pair ang ART/CADUCEUS.KEY sa imong SMB share.
  CAD_UNKNOWN_GAME: Wala kining dula sa Caduceus catalog. I-refresh ang catalog sa PC.
  CAD_CONNECTION_ERROR: Dili makapangutana sa Caduceus. Susiha ang koneksyon, unya pindota ang Select aron sulayan pag-usab.
  CAD_BACK_REFRESH: Mobalik sa OPL ang Back. I-refresh sa Select kining page.
  CAD_LIBRARY_CONTROLS: 'L1/R1: page   Confirm: ablihi   Select: i-refresh'
  CAD_GAME_CONTROLS: 'L1/R1: page   Square: filter   Select: i-refresh'
  CAD_BACK: Balik
  CAD_UNTRACKED: Dili pa andam ang Caduceus. Ilansad nga walay achievement karon.
  PS1_RA_USB_REQUIRED: Kinahanglan sa PS1 achievements ang USB VCD pinaagi sa POPStarter
  PS1_RA_REMOVE_PREVIOUS: Dili matangtang ang miaging PS1 achievement module
  PS1_RA_PREPARE_FAILED: Dili maandam ang PS1 achievements. Tipigi o ibalhin ang POPS/MODULE_9.IRX ug susiha ang write access sa device.
  PS1_RA_CLEAN_DELETE: 'Wala gigamit nga RiptOPL RA module: POPS/MODULE_9.IRX. Papason alang sa limpyo nga paglansad?'
  PS1_RA_CLEAN_FAILED: Dili mapapas ang wala gigamit nga RA module.
  PS1_RA_CLEAN_CONTINUE: Padayon gihapon? Ang nahibilin nga RA module mahimong modagan og daan nga telemetry. Kanselahon sa Dili ang paglansad.
  FAV_REMOVED: Natangtang sa Mga Paborito
  FAV_REMOVE_FAILED: Dili matangtang sa Mga Paborito
  POPS_UDPFS_SETTINGS: Network settings sa POPS UDPFS
  POPS_UDPFS_DISCOVERY: I-save sa matag USB POPS folder. Discovery ang gamit sa server 0.0.0.0.
  POPS_UDPFS_NOT_READY: Kinahanglan sa POPS UDPFS ang magkatugma ug sakto nga IPCONFIG.DAT ug UDPFSCONFIG.DAT sa matag USB POPS folder. I-configure sila sa POPS Network Settings.
  HINT_POPS_UDPFS_IP: Static nga PS2 IP nga gigamit sa POPS UDPFS driver human sa IOP reset niini.
  POPS_UDPFS_ALL_USB_FOLDERS: Tanang USB POPS folder
  POPS_UDPFS_INVALID_SUFFIX: ' (dili sakto)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (kulang)'
  POPS_UDPFS_DRIVER_NOT_READY: Kinahanglan sa POPS UDPFS nga naka-install sa memory card ang .udpfs driver pair. Andama kini nga mano-mano o i-enable ang BDMA Apply on Launch.
  VMC_REPLACE_REQUIRES_DELETE: Mapapas ang mga save niini kung usbon ang gidak-on sa VMC. I-backup ang anaa nang VMC ug gamita ang Delete sa dili pa maghimo og bag-ong gidak-on.
  VMC_CREATE_FAILED: Dili mahimo ang VMC. Susiha ang device, koneksyon ug write access. Wala nailisan ang anaa nang mga save.
  RA_EXPERIMENTAL_CARDS: Mga eksperimental nga card sa Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Mga eksperimental nga achievement card sulod sa PS2 nga dula. Mahimong mokidlap o mo-freeze ang mga dula. Caduceus ra; gold pulse ang gamit sa Off. Magsugod kini sa sunod nga paglansad sa dula.
  RA_NEUTRINO_UNTRACKED: Dili magamit ang Neutrino RA alang niining paglansad. Susiha ang RA runtime, companion IP ug ang na-save nga watch list. Ilansad nga walay achievement.
  UDPFS_IP_CONFLICT: Adunay laing device sa imong network nga naggamit sa IP address niining PS2, mao nga didto moadto ang mga tubag sa UDPFS server. Pag-set og laing PS2 IP sa Network Settings.
  XERA_ACHIEVEMENTS: RetroAchievements library (xeRAbora)
  XERA_USE_LIBRARY: I-browse kining dula pinaagi sa RetroAchievements library sa main menu.
  XERA_OPEN_NETWORK: Dili maabot ang xeRAbora. I-on ang OPEN TO THE NETWORK sa settings niini, susiha ang RA companion IP ug ang firewall sa PC.
  XERA_UNKNOWN_GAME: Wala mailhi sa xeRAbora kining image. Padagana una ang RA check game support.
  XERA_NOT_PLAYED: Wala pa sa imong RetroAchievements library. Dulaa kini kausa uban ang achievement, unya pindota ang Select.
  XERA_CONNECTION_ERROR: Dili mabasa ang lista gikan sa xeRAbora. Pindota ang Select aron sulayan pag-usab.
  CAD_PAIR_UDPFS: Dili maabot ang Caduceus. I-pair ang ART/CADUCEUS.KEY sa folder nga gipaambit sa PS2-Servers, ug i-set ang RA companion IP.
  RA_WL_NOT_SAVED: Dili ma-save ang watch list. Siguroha nga masulatan ang device o share sa dula, unya susiha pag-usab.
  RA_UDPFS_LOAD_FIRST: Ablihi kausa ang UDPFS page aron mo-load ang network module niini, unya sulayi pag-usab.
  CAD_UDPFS_IMG: 'Kinahanglan sa Caduceus browser ang SMB o UDPFS Files: walay gipaambit nga folder ang UDPFS IMG alang sa key niini.'
  XERA_SET_CLOCK: Wala pa sa imong RetroAchievements library. I-set ang orasan sa console sa system settings aron makita ang tibuok lista niini, o dulaa kini kausa uban ang achievement.
  CFG_TITLES: Ipakita ang mga CFG title sa lista sa dula
  HINT_CFG_TITLES: Ipakita ang Title gikan sa CFG sa matag dula puli sa ngalan sa file niini, ug han-ayon pinaagi niini. Basahon ang matag CFG kung mo-refresh ang lista, mao nga mas hinay mo-load. Pagpakita ra.
  AUTO_VMC_INVALID: Anaa ang VMC file niining dula apan dili kini sakto nga memory card, mao nga wala kini gigamit o gi-ilisan. Magsugod ang dula nga wala niini; susiha kini sa VMC menu.
  AUTO_VMC_STILL_RUNNING: Gihimo pa ang VMC niining dula. Ilansad pag-usab ang dula sa makadiyot.
  NEUTRINO_DVR_QUICKBOOT: Kinahanglan sa DVR launch ang PSX-mode transition. Tangtanga ang -qb sa global ug per-game nga Neutrino argument.
  NEUTRINO_DVR_FILE_MISSING: 'Kulang ang DVR Neutrino installation. Nawala ang kinahanglanon nga file:'
  LOGOART: Logo artwork
  HINT_LOGOART: Ipakita ang logo sa dula (<ID>_LGO) kung gigamit kini sa tema. Itago usab sa Off ang default nga hulagway niini, apan tipigan ang mga cover, disc art ug background.
  PARENLOCK_GAME: Parental Lock
  PARENLOCK_GAME_HINT: Kinahanglan ang parental lock password aron masugdan kining dula.
  PARENLOCK_GAME_NO_PASSWORD: Pag-set og parental lock password, kay kung dili, dili ma-lock kining dula.
  HINT_ENABLE_PCCF: Sayo nga Japanese PS2 PC CARD CompactFlash. Native nga PS2 dula ra; kinahanglan sa CF ang eksklusibo nga access sa PC CARD. Pag-restart aron buhian kini.
  PCCF_GAMES: Mga dula sa PC CARD CF
  PCCF_UNAVAILABLE: 'Dili magamit ang CF: kinahanglan og sayo nga Japanese PC CARD PS2, tugma nga card, ug walay aktibo nga DEV9/HDD/network driver.'
  PCCF_UNSUPPORTED_GAME: Native nga PS2 dula ra ang suportado sa CF karon. Dili magamit ang CF VMC, pag-load sa PS1 ug network achievements.
  HINT_ENABLE_DVR: Eksperimental nga pagpangita sa DESR DVR ISO. Kinahanglan naka-enable ang HDD source; kinahanglan sa paglansad sa dula ang gawas nga Neutrino nga makahimo og DVR.
  HINT_RIPPS2_IGR_PAGE: Ang menu sulod sa dula, ang RIPSHOT, ug kung giunsa pag-develop ang mga kuha.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Mga screenshot gikan sa menu sulod sa dula, ngadto sa ART para sa imong mga tema o sa MEDIA.
  RIPPS2_DEVELOP_SHOTS: I-develop ang mga kuha
  HINT_RIPPS2_DEVELOP_SHOTS: Kung giunsa nga ang mga kuha nga naghulat sa rolyo sa matag dula mahimong PNG.
  RIPPS2_SETTINGS_HOME: I-save ang settings sa
  HINT_RIPPS2_SETTINGS_HOME: 'Asa gitago sa RIPPS2 ang settings niini: kaugalingong save sa usa ka memory card, usa ka RIPPS2 folder sa usa ka drive (internal HDD, USB, MX4SIO, iLink o MMCE), o usa ka folder nga imong isulat.'
