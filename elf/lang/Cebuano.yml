  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: Ang menu music (%s) anaa sa %s isip %s. Gilista kini sa Audio settings > Music isip Menu; motugtog kini kung walay laing track nga gipili.
  The menu music could not be written to %s (%s). Is the drive full?: Dili masulat ang menu music sa %s (%s). Puno na ba ang drive?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'Ang menu music usa ka WAV nga %s, ug walay memory card nga adunay lugar niini. Dinhi, nagdagan ang RIPPS2 gikan sa memory card ug walay drive nga adunay OPL folder nga nasugdan: sugdi ang usa sa Storage, unya i-rip ang musika didto.'
  The sounds could not be written to %s. Is the drive full or write-protected?: Dili masulat ang mga tunog sa %s. Puno ba o naka-write-protect ang drive?
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: Dili kini ang menu music nga nailhan sa RIPPS2 niining BIOS. Walay nasulat.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: Dili kini ang sound bank nga nailhan sa RIPPS2 niining BIOS. Walay nasulat.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : Walay SNDIMAGE ang BIOS niining console. Aduna niini ang mga console gikan sa SCPH-30000 pataas; lahi ang pagtipig sa tunog sa unang mga modelo, nga wala pa mabasa sa RIPPS2.
