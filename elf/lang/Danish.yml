  MEMORY CARD %d  (%s): MEMORYKORT %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'MEMORYKORT 0: %s

    MEMORYKORT 1: %s

    %s

    BIBLE er PS2BBL 1.2.0 af El Isra, indstillet af RIPPS2: ingen ventetid ved opstart, RIPPS2 først, og en knap, der holdes nede ved opstart, når stadig browseren (TREKANT), en disk (START) og det, der var der før (CIRKEL). Installer eller reparer den på et memorykort eller den interne HDD?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Memorykort %d har %d KB ledigt, og BIBLE skal bruge %d KB der. Frigør lidt plads, og prøv igen.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Memorykort %d har %d KB ledigt, og kopien af RIPPS2 skal bruge %d KB. Frigør lidt plads, eller vælg et andet sted.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Memorykort %d starter %s ved opstart, og BOOT LOCK virker kun gennem PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 kan ikke starte RIPPS2, hvor det ligger nu (den når memorykort, USB-nøgler og MX4SIO). OPSTARTSINDLÆSER > ADMINISTRER kan kopiere RIPPS2 til et memorykort eller en USB-nøgle for den.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL starter programmer fra et memorykort, en USB-nøgle eller MX4SIO, og RIPPS2 kunne ikke læse sig selv for at kopiere sig dertil. Start RIPPS2 fra et af dem, og prøv igen.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'SÆT HDD''ENS GAMLE STARTPROGRAM TILBAGE

    Det, BIBLE gemte (RIPPS2/MBR-BACKUP.KELF på HDD''en), går tilbage i __mbr i stedet for BIBLE. RIPPS2 og PS2BBL-konfigurationen bliver, hvor de er.'
  RESTORE: GENDAN
  RESTORE THE HDD'S OLD BOOT PROGRAM: GENDAN HDD'ENS GAMLE STARTPROGRAM
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 kan ikke se denne konsols region ud fra dens ROM, så det ved ikke, hvilken systemopdateringsmappe den læser. BIBLE blev ikke installeret.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 kunne ikke åbne HDD'ens partition __sysconf eller __common (fejl %d), så BIBLE har ingen steder at gemme RIPPS2 og sin konfiguration der. Intet blev ændret.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 kunne ikke læse det gemte startprogram. Intet blev ændret.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 kunne ikke skrive startprogrammet tilbage. Prøv igen; den gemte kopi er urørt.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 havde travlt med at læse et drev og kunne ikke genstarte I/O-processoren. Intet blev ændret: prøv igen om lidt.'
