  RetroAchievements, as xeRAbora had it at each game's last check: RetroAchievements, xeRAbora'nın her oyunun son kontrolünde gördüğü hâliyle
  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Aynı ağdaki bir PC''de xeRAbora istemcisini çalıştırın ve RetroAchievements hesabınıza giriş yapın. Sonra USB, MMCE, SMB veya HDD''deki bir oyun için: oyun menüsünü (ÜÇGEN) açın ve OYUN DESTEĞİNİ KONTROL ET''i seçin. İzlenen bir oyun RA rozetini alır; TELEMETRİ açıkken başlatın, açılan başarımlar oyunun üzerinde belirir. Tepsideki bir disk için DİSKİ KONTROL ET''i, ardından DİSKİ BAŞARIMLARLA OYNA''yı kullanın. Neutrino, POPSTARTER veya Ember ile başlatılan oyunlar henüz izlenmiyor.'
