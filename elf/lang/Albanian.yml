  RetroAchievements, as xeRAbora had it at each game's last check: RetroAchievements, siç i kishte xeRAbora në kontrollin e fundit të çdo loje
  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Ekzekuto klientin xeRAbora në një kompjuter në të njëjtin rrjet, i identifikuar në llogarinë tënde RetroAchievements. Pastaj, për një lojë në USB, MMCE, SMB ose HDD: hap menynë e saj (TREKËNDËSHI) dhe zgjidh KONTROLLO MBËSHTETJEN E LOJËS. Një lojë e ndjekur merr distinktivin RA; me TELEMETRINË ndezur, nise dhe zhbllokimet shfaqen mbi lojë. Për një disk në sirtar, përdor KONTROLLO DISKUN, pastaj LUAJ DISKUN ME ARRITJE. Lojërat e nisura përmes Neutrino, POPSTARTER ose Ember ende nuk ndiqen.'
