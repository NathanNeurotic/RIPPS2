  HINT_NEUTRINO_PATH: 'Ku ndodhet neutrino.elf? <not set> = Pajisja e lojës -> mc0/mc1. Një shteg i plotë i personalizuar provohet i pari. Shembuj: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
