  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK nuk mundi të shkruante konfigurimin PS2BBL. Kontrollo që karta e memories ose njësia të mos jenë të mbrojtura nga shkrimi, pastaj provo përsëri.
  BOOT LOCK found no PS2BBL config to change.: BOOT LOCK nuk gjeti asnjë konfigurim PS2BBL për të ndryshuar.
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: BOOT LOCK është fikur. PS2BBL nis atë që niste më parë (%s).
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK është ndezur. PS2BBL tani nis RIPPS2 në ndezje (%s). Mbaj një tast të shpejtë të PS2BBL ndërsa konsola niset për të arritur diçka tjetër.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK punon përmes PS2BBL (PlayStation 2 Basic BootLoader), dhe këtu nuk ka asnjë në asnjë kartë memorieje.
  INSTALL BIBLE: INSTALO BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'INSTALO BIBLE NË KARTËN E MEMORIES %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALO BIBLE NË HDD-NË E BRENDSHME

    - RIPPS2 kopjohet në %s.

    - Programi i nisjes së HDD që është tani në __mbr lexohet dhe ruhet në %s/RIPPS2 (RIKTHE e kthen).

    - Ndërtimi për HDD i PS2BBL 1.2.0 shkruhet në vend të tij, dhe konsola vendoset ta nisë në ndezje.

    - Konfigurimi i tij (%s) nis RIPPS2 së pari nga %s%s%s, me BOOT LOCK të ndezur.

    Kjo kërkon një konsolë që niset nga HDD-ja e saj (PS2 e trashë me përshtatësin e rrjetit). Mbaje ndezur derisa të thotë u krye.'
  INTERNAL HDD  (its boot area): HDD I BRENDSHËM  (zona e tij e nisjes)
  MEMORY CARD %d  (%s): KARTA E MEMORIES %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'KARTA E MEMORIES 0: %s

    KARTA E MEMORIES 1: %s

    %s

    BIBLE është PS2BBL 1.2.0 nga El Isra, i përgatitur nga RIPPS2: pa pritje në ndezje, RIPPS2 i pari, dhe një buton i mbajtur në ndezje të çon ende te shfletuesi (TREKËNDËSHI), te një disk (START) dhe te ajo që ishte atje më parë (RRETHI). Ta instalosh ose ta riparosh në një kartë memorieje ose në HDD-në e brendshme?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Karta e memories %d ka %d KB të lira, dhe BIBLE ka nevojë për %d KB atje. Liro pak hapësirë, pastaj provo përsëri.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Karta e memories %d ka %d KB të lira, dhe kopja e RIPPS2 ka nevojë për %d KB. Liro pak hapësirë ose zgjidh një vend tjetër.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Karta e memories %d nis %s në ndezje, dhe BOOT LOCK punon vetëm përmes PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 nuk mund ta nisë RIPPS2 nga vendi ku është tani (arrin kartat e memories, USB-të dhe MX4SIO). NGARKUESI I NISJES > MENAXHO mund ta kopjojë RIPPS2 në një kartë memorieje ose USB për të.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL nis programe nga një kartë memorieje, një USB ose MX4SIO, dhe RIPPS2 nuk mundi ta lexonte veten për t'u kopjuar atje. Nis RIPPS2 nga njëri prej tyre, pastaj provo përsëri.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'RIKTHE PROGRAMIN E VJETËR TË NISJES SË HDD

    Ai që ruajti BIBLE (RIPPS2/MBR-BACKUP.KELF në HDD) kthehet në __mbr, në vend të BIBLE. RIPPS2 dhe konfigurimi PS2BBL mbeten ku janë.'
  RESTORE: RIKTHE
  RESTORE THE HDD'S OLD BOOT PROGRAM: RIKTHE PROGRAMIN E VJETËR TË NISJES SË HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 nuk e kupton dot rajonin e kësaj konsole nga ROM-i i saj, ndaj nuk e di cilën dosje përditësimi sistemi lexon. BIBLE nuk u instalua.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
