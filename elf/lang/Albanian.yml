  HINT_NEUTRINO_AUTO_ELF: I jep Neutrino-s ELF-in e nisjes së lojës për të kërkuar konfigurimin e çdo titulli. Ndezur si parazgjedhje; opsioni ELF i nisjes i vendosur me dorë ka përparësi.
  HINT_POPSTARTER_PATH: Ku është POPSTARTER.ELF. Nëse lihet bosh, RIPPS2 vendos një që gjen në një njësi; shkruaj mbi të për të përdorur një tjetër, si usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Argumentet e Neutrino e kalojnë gjatësinë që mund të ruhet. Shkurto një fushë para ruajtjes.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Argumentet e nisjes së Neutrino e kalojnë kufirin e sigurt. Shkurto argumentet globale ose të lojës.
