  BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed.: BIBLE nuk mundi ta vinte mënjanë %s për ta ruajtur, ndaj ndaloi atje. Asgjë në kartë nuk ndryshoi.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE nuk mundi të shkruante konfigurimin e tij (%s). Programi i nisjes nuk ndryshoi.
