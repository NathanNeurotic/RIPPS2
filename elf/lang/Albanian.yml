  BIBLE could not be written to memory card %d, so the card was put back as it was. Check its free space, then try again.: BIBLE nuk u shkrua dot në kartën e memories %d, ndaj karta u kthye siç ishte. Kontrollo hapësirën e lirë, pastaj provo përsëri.
