  ? Compress %s? The ISO stays until the ZSO has been read back and checked, then RIPPS2 asks before it removes the ISO. The drive needs room for both while it works; leave the console on until it finishes. A ZSO starts with the OPL core only (not Neutrino); its saves, settings, art and cheats stay with it, and it can be made an ISO again at any time.
  : Сжать %s? ISO остаётся, пока ZSO не будет прочитан обратно и проверен, затем RIPPS2 спросит, прежде чем удалить ISO. Накопителю во время работы нужно место для обоих; не выключайте консоль, пока не закончится. ZSO запускается только ядром OPL (не Neutrino); её сохранения, настройки, обложки и читы остаются с ней, и её в любой момент можно снова сделать ISO.
