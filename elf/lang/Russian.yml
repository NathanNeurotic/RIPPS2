  PS1_RA_REMOVE_PREVIOUS: Не удаётся удалить прежний модуль достижений PS1
  PS1_RA_PREPARE_FAILED: Не удаётся подготовить достижения PS1. Сохраните или переместите POPS/MODULE_9.IRX и проверьте доступ на запись к накопителю.
  PS1_RA_CLEAN_DELETE: 'Неиспользуемый модуль RA RiptOPL: POPS/MODULE_9.IRX. Удалить для чистого запуска?'
  PS1_RA_CLEAN_FAILED: Не удаётся удалить неиспользуемый модуль RA.
  PS1_RA_CLEAN_CONTINUE: Всё равно продолжить? Оставшийся модуль RA может слать устаревшую телеметрию. «Нет» отменяет запуск.
  FAV_REMOVED: Удалено из «Избранных игр»
  FAV_REMOVE_FAILED: Не удалось удалить из «Избранных игр»
  POPS_UDPFS_SETTINGS: Настройки сети UDPFS для POPS
  POPS_UDPFS_DISCOVERY: Сохраняется в каждую папку POPS на USB. Сервер 0.0.0.0 использует автопоиск.
  POPS_UDPFS_NOT_READY: POPS UDPFS нужны согласованные корректные IPCONFIG.DAT и UDPFSCONFIG.DAT в каждой папке POPS на USB. Настройте их в «Настройках сети POPS».
  HINT_POPS_UDPFS_IP: Статический IP PS2, который драйвер UDPFS для POPS использует после перезапуска IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Все папки POPS на USB
  POPS_UDPFS_INVALID_SUFFIX: ' (неверно)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (неполно)'
  POPS_UDPFS_DRIVER_NOT_READY: 'POPS UDPFS нужна пара драйверов .udpfs на карте памяти. Установите её вручную или включите «BDMA: применять при запуске».'
  VMC_REPLACE_REQUIRES_DELETE: Смена размера VMC сотрёт её сохранения. Сделайте копию существующей VMC и используйте «Удалить» перед созданием нового размера.
  VMC_CREATE_FAILED: Не удалось создать VMC. Проверьте накопитель, подключение и доступ на запись. Существующие сохранения не заменены.
  RA_EXPERIMENTAL_CARDS: Экспериментальные карточки Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Экспериментальные карточки достижений в игре на PS2. Могут мерцать или подвешивать игры. Только Caduceus; «Выкл.» использует золотую пульсацию. Действует со следующего запуска игры.
  RA_NEUTRINO_UNTRACKED: RA для Neutrino недоступен в этом запуске. Проверьте модуль RA, IP компаньона и сохранённый список отслеживания. Запуск без достижений.
  UDPFS_IP_CONFLICT: Другое устройство в вашей сети использует IP-адрес этой PS2, поэтому ответы сервера UDPFS уходят ему. Задайте другой IP для PS2 в настройках сети.
  XERA_ACHIEVEMENTS: Библиотека RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Просматривайте эту игру через библиотеку RetroAchievements в главном меню.
  XERA_OPEN_NETWORK: xeRAbora недоступен. Включите OPEN TO THE NETWORK в его настройках, проверьте IP компаньона RA и брандмауэр ПК.
  XERA_UNKNOWN_GAME: xeRAbora не знает этот образ. Сначала выполните проверку поддержки RA.
  XERA_NOT_PLAYED: Игры ещё нет в вашей библиотеке RetroAchievements. Сыграйте в неё один раз с достижениями, затем нажмите Select.
  XERA_CONNECTION_ERROR: Не удаётся прочитать список из xeRAbora. Нажмите Select, чтобы повторить.
  CAD_PAIR_UDPFS: Caduceus недоступен. Свяжите ART/CADUCEUS.KEY в папке, которую раздаёт PS2-Servers, и задайте IP компаньона RA.
  RA_WL_NOT_SAVED: Не удалось сохранить список отслеживания. Убедитесь, что накопитель или общая папка игры доступны для записи, и проверьте снова.
  RA_UDPFS_LOAD_FIRST: Откройте один раз страницу UDPFS, чтобы загрузился её сетевой модуль, и попробуйте снова.
  CAD_UDPFS_IMG: 'Браузеру Caduceus нужен SMB или UDPFS «Файлы»: у UDPFS IMG нет общей папки для его ключа.'
  XERA_SET_CLOCK: Игры ещё нет в вашей библиотеке RetroAchievements. Установите часы консоли в системных настройках, чтобы увидеть полный список, или сыграйте в неё один раз с достижениями.
  CFG_TITLES: Показывать названия из CFG в списках игр
  HINT_CFG_TITLES: Показывает название из CFG каждой игры вместо имени файла и сортирует по нему. При обновлении списка читает каждый CFG, поэтому списки грузятся медленнее. Только отображение.
  AUTO_VMC_INVALID: Файл VMC этой игры есть, но это не корректная карта памяти, поэтому он не использован и не заменён. Игра запустится без него; проверьте его в меню VMC.
  AUTO_VMC_STILL_RUNNING: VMC этой игры ещё создаётся. Запустите игру снова через минуту.
  NEUTRINO_DVR_QUICKBOOT: Запуску DVR нужен переход в режим PSX. Уберите -qb из общих и игровых аргументов Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Установка DVR Neutrino неполная. Нет нужного файла:'
  PARENLOCK_GAME: Родительский контроль
  PARENLOCK_GAME_HINT: Требовать пароль родительского контроля для запуска этой игры.
  PARENLOCK_GAME_NO_PASSWORD: Задайте пароль родительского контроля, иначе эта игра не будет заблокирована.
  HINT_ENABLE_PCCF: CompactFlash в PC CARD ранних японских PS2. Только родные игры PS2; CF нужен монопольный доступ к PC CARD. Перезапустите, чтобы освободить её.
  PCCF_GAMES: Игры PC CARD CF
  PCCF_UNAVAILABLE: 'CF недоступна: нужна ранняя японская PS2 с PC CARD, совместимая карта и ни одного активного драйвера DEV9/HDD/сети.'
  PCCF_UNSUPPORTED_GAME: CF пока поддерживает только родные игры PS2. VMC на CF, загрузка PS1 и сетевые достижения недоступны.
  HINT_ENABLE_DVR: Экспериментальный поиск ISO DESR DVR. Нужен включённый источник HDD; для запуска игр нужен внешний Neutrino с поддержкой DVR.
  HINT_RIPPS2_IGR_PAGE: Игровое меню, RIPSHOT и проявка кадров.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Снимки экрана из игрового меню, в ART для ваших тем или в MEDIA.
  RIPPS2_DEVELOP_SHOTS: Проявка кадров
  HINT_RIPPS2_DEVELOP_SHOTS: Как кадры, ждущие на плёнке каждой игры, становятся PNG.
  RIPPS2_SETTINGS_HOME: Сохранять настройки на
  HINT_RIPPS2_SETTINGS_HOME: 'Где RIPPS2 хранит настройки: в собственном сохранении на карте памяти, в папке RIPPS2 на накопителе (внутреннем HDD, USB, MX4SIO, iLink или MMCE) или в указанной вами папке.'
  RIPPS2_LAUNCHERS: Загрузчики
  RIPPS2_LOOK_NOW: Искать сейчас
  HINT_RIPPS2_LOOK_NOW: RIPPS2 ищет на запущенных накопителях POPSTARTER, файлы POPS, Ember, BIOS для Ember и Neutrino и запоминает, где лежит каждый. Каждый запуск берёт их оттуда.
  RIPPS2_HIDE_GAME: Скрыть игру
  RIPPS2_HIDDEN_GAMES: Скрытые игры
  HINT_RIPPS2_HIDDEN_GAMES: Игры, скрытые через «Скрыть игру», на запущенных накопителях. Покажите одну снова или удалите её. У каждого накопителя свой список.
  HINT_RIPPS2_BDM_DEVICES: 'Накопители, с которых BDM читает игры: USB, MX4SIO, PC Card CF, DVR-накопитель DESR и iLink. Встроенный HDD следует запуску HDD.'
  HINT_RIPPS2_SCREEN: 'Картинка меню: видеорежим, широкий экран, её место на телевизоре (H-POS, V-POS) и overscan.'
  HINT_RIPPS2_LAYOUT: Где стоят категории и как входит страница, затем обложки RIPFLOW и сетка RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Толщина текста, цветовая тема, смена цветов и каждый цвет.
  HINT_RIPPS2_TEXT_WEIGHT: 'Насколько плотный собственный текст RIPPS2: подсказки настроек, СОСТОЯНИЕ и О программе. Обычный как раньше; Средний и Жирный лучше читаются на мягкой картинке.'
  HINT_RIPPS2_HDD_START: 'Встроенный HDD, APA или exFAT: RIPPS2 читает его, каким бы он ни был, и показывает один раз, как игры HDD. Выкл. оставляет его в покое.'
  HINT_RIPPS2_THEME_COLOR: Собственный цвет темы. Выберите Свой как цветовую тему, чтобы выбрать его самим, как цвета текста.
  HINT_RIPPS2_SWEEP: Пять цветов, через которые тема переходит медленно и плавно. Радуга, смена из каждой цветовой темы или ваша. Выкл. держит тему неподвижной.
  HINT_RIPPS2_SWEEP_COLORS: Пять цветов смены и её скорость. Измените одну из RIPPS2, и она сохранится как ваша, под данным вами именем.
  HINT_RIPPS2_SWEEP_NAME: Как называется ваша смена в списке Смена цветов.
  HINT_RIPPS2_SWEEP_COLOR: Один из пяти цветов, через которые смена проходит по порядку.
  HINT_RIPPS2_SWEEP_SPEED: 'Сколько длится каждый цвет, пока не войдёт следующий. Даже Живо остаётся плавным: цвета никогда не мигают.'
  RIPPS2_HIDE_COMPRESS: Скрыть игру и сжатие
  HINT_RIPPS2_SELECT_HOLD: 'SELECT удерживается 4.2 с на списке игр. Список: темы на панели, выберите одну. По кругу: следующая тема. Выкл.: ничего (нажатие по-прежнему обновляет).'
