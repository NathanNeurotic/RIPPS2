  ? RIPPS2 plays this console's red screen music, the disc warning's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 играет музыку красного экрана этой консоли, фоновую пьесу предупреждения о диске (%d:%02d), по нотам самого BIOS и записывает её как WAV размером %s; ни на одной карте памяти нет для неё места. Подтверждение записывает её в %s, рядом с RIPPS2. START записывает её в %s, ресурсы OPL на этом накопителе. Уже лежащий там %s заменяется. Это займёт минуту-другую.
  ? RIPPS2 plays this console's red screen music, the disc warning's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 играет музыку красного экрана этой консоли, фоновую пьесу предупреждения о диске (%d:%02d), по нотам самого BIOS и записывает её как WAV размером %s в %s; ни на одной карте памяти нет для неё места. Уже лежащий там %s заменяется. Это займёт минуту-другую.
  ? RIPPS2 plays this console's menu music (%d:%02d) and its red screen music (%d:%02d) from the BIOS's own notes and writes them as two WAVs, %s in all; no memory card has room for them. Accept writes them to %s, beside RIPPS2. START writes them to %s, OPL's resources on that drive. Files of those names already there are replaced. Each takes a minute or two.
  : RIPPS2 играет музыку меню этой консоли (%d:%02d) и музыку её красного экрана (%d:%02d) по нотам самого BIOS и записывает их как два WAV, всего %s; ни на одной карте памяти нет для них места. Подтверждение записывает их в %s, рядом с RIPPS2. START записывает их в %s, ресурсы OPL на этом накопителе. Уже лежащие там файлы с этими именами заменяются. Каждый займёт минуту-другую.
  ? RIPPS2 plays this console's menu music (%d:%02d) and its red screen music (%d:%02d) from the BIOS's own notes and writes them as two WAVs, %s in all, to %s; no memory card has room for them. Files of those names already there are replaced. Each takes a minute or two.
  : RIPPS2 играет музыку меню этой консоли (%d:%02d) и музыку её красного экрана (%d:%02d) по нотам самого BIOS и записывает их как два WAV, всего %s, в %s; ни на одной карте памяти нет для них места. Уже лежащие там файлы с этими именами заменяются. Каждый займёт минуту-другую.
