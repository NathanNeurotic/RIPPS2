labels:
  DS34BT_MODE: DualShock3/4 по Bluetooth
  HINT_NEUTRINO_AUTO_ELF: Передаёт загрузочный ELF игры в Neutrino, чтобы найти настройки для этой игры. Включено по умолчанию; заданный вручную параметр Boot ELF важнее.
  HINT_POPSTARTER_PATH: Где лежит POPSTARTER.ELF. Если оставить пустым, RIPPS2 подставит найденный на накопителе; впишите другой путь, например usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Аргументы Neutrino длиннее, чем можно сохранить. Сократите поле перед сохранением.
