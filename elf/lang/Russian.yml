  HINT_RIPPS2_HINT_SHOW: Показывает или скрывает эту подсказку. Её кнопка работает в любом случае.
  RIPPS2_GLYPH_SET: Набор значков
  HINT_RIPPS2_GLYPH_SET: 'Значки кнопок на всех страницах: темы, RIPPS2, «Стандарт» (тёмные кнопки, цветные символы) или «Белые» (сплошь белые).'
  RIPPS2_HINT_ORDER: Порядок подсказок
  HINT_RIPPS2_HINT_ORDER: Расставляет подсказки. «Тема» сохраняет порядок темы; «Ваш порядок» задаётся здесь.
  RIPPS2_HINT_ORDER_FOLLOW: Порядок
  RIPPS2_GRID_LAYOUT: Раскладка сетки
  HINT_RIPPS2_GRID_LAYOUT: Сколько обложек помещается на странице сетки, с отступами RIPPS2. «Тема» сохраняет раскладку темы.
  RIPPS2_LAUNCH_DISC: Диск при запуске
  HINT_RIPPS2_LAUNCH_DISC: Диск игры появляется при запуске. «Всплытие» опускается и гаснет; «Вращение» крутится всё быстрее, пока игра не запустится.
  RIPPS2_TRANSITION: Переход страниц
  HINT_RIPPS2_TRANSITION: 'Как появляется новая страница при переходе в другую категорию: из цвета фона темы или из вспышки. «Тема» сохраняет выбор темы.'
  RIPPS2_CATEGORY_LAYOUT: Расположение категорий
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Где стоят три категории: их названия вверху или значки вдоль боковой панели, у каждой выдвижной список её страниц (Влево в списке ведёт туда). «Тема» сохраняет раскладку темы.'
  RIPPS2_CACHE: Кэш
  HINT_RIPPS2_CACHE: 'Как хранится список игр каждого источника, чтобы его страница открывалась сразу: Fast Cache, список внутреннего HDD и Автообновление.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: Каждый источник хранит свой последний список игр (RIPPS2.LST рядом с папками CD и DVD) и показывает его, как только источник ответит, а затем перечитывает источник в фоне. Выключено читает каждый список сначала с источника, как раньше.
  HINT_RIPPS2_VIGNETTE: Затемняет края всех обложек, кроме выбранной, чтобы она выделялась. «Слабая» вдвое меньше «Полной».
  RIPPS2_GRID_WIDE: Раскладка сетки для широкого экрана
  HINT_RIPPS2_GRID_WIDE: Страница сетки только при картинке 16:9 (Широкий экран, 720p, 1080i), где обложки уже и их помещается больше. «Тема» использует раскладку темы; «Как» следует раскладке сетки.
  RIPPS2_BGBLUR: Размытие фона
  HINT_RIPPS2_BGBLUR: Насколько матовое стекло размывает фоновое изображение игры. «Тема» использует значение темы («Слабая» в RIPGRID и Adapt).
  HINT_RIPPS2_HINT_SLOT: Подсказка на этом месте. Подсказка, стоявшая здесь, переходит на прежнее место выбранной.
  PS1_SAVE_GUIDANCE: Сохранения PS1 зависят от Ember или POPSTARTER; настройки VMC для PS2 к ним не относятся.
  NEUTRINO_SHOW_ARGS: Показывать аргументы запуска
  HINT_NEUTRINO_SHOW_ARGS: Перед каждым запуском через Neutrino показывает все аргументы, которые он получит, и спрашивает, продолжать ли. «Назад» возвращает в меню без запуска.
  NEUTRINO_ARGS_CONFIRM: Neutrino запустится с этими аргументами. Запустить?
  HINT_NARGS_EXTRA: Другие флаги Neutrino через пробел, отправляемые после всего, что выше. RIPPS2 всегда добавляет -bsd и -dvd для накопителя и ISO игры, -mc0 и -mc1 для её VMC, -gsm для её видеорежима и собственные режимы совместимости игры. Флаг, у которого есть своя строка выше (например, -logo), при сохранении переносится в эту строку и всё равно отправляется.
  HINT_RIPPS2_THEME: Внешний вид всех страниц. В списке игр удерживайте SELECT 4,2 секунды, чтобы переключиться на следующую тему; короткое нажатие SELECT по-прежнему обновляет список.
  GAME_TYPE_LABELS: Показывать метки [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Список читов не удалось сохранить в папку Neutrino, поэтому Neutrino не может его использовать. Запустить без читов?
  AUTO_CREATE_VMC: Создавать VMC при первом запуске
  HINT_AUTO_CREATE_VMC: Запуск игры PS2 без VMC в слоте 1 создаёт карту на 8 МБ на накопителе игры, с именем, которое предлагает экран VMC (общая для всех дисков игры), и назначает её. Не для внутреннего HDD под Neutrino.
  AUTO_VMC_CREATING: Создание VMC для этой игры...
  AUTO_VMC_FAILED: Не удалось создать VMC для этой игры. Игра запустится без неё.
  RIPPS2_BIOS_MUSIC: Музыка BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Записывает музыку меню этой консоли (фоновую пьесу её браузера, около 15 МБ в WAV) в выбранную вами папку AUDIO: рядом с RIPPS2 или в папку OPL на запущенном накопителе. Слишком велика для карты памяти. Сначала показывается её размер.'
  SAVE_ICONS: 3D-значки сохранений
  HINT_SAVE_ICONS: Показывает вращающийся значок сохранения выбранной игры там, где у темы есть для него место. Сначала читает VMC игры, затем карты памяти.
  NETBOOT_RESTART_NOW: Сетевой протокол сменится после перезапуска. Сохранить настройки и перезапустить OPL сейчас?
  HINT_NET_PROTOCOL: 'Какой сетевой сервис использует RiptOPL: общий ресурс SMB, UDPFS, UDPBD или HTTP. Уход с уже запущенного требует перезапуска.'
  HINT_UDPFS_ACCESS: Только UDPFS. «Файлы» читает отдельные ISO из папки игр сервера; IMG читает образ диска как накопитель. SMB и HTTP всегда используют «Файлы», UDPBD всегда IMG.
  HINT_SMB_VERSION: Какую версию SMB использовать с общей папкой ПК.
  HINT_NET_ADVANCED: Открывает для правки режим связи Ethernet и порт SMB.
  HINT_ETH_LINK_MODE: Задаёт скорость и дуплекс сетевой связи. Оставьте «Авто», если связь не обрывается постоянно.
  HINT_IP_ADDR_TYPE: «Статический» использует адрес ниже; DHCP спрашивает ваш роутер. UDPFS и UDPBD всегда используют «Статический».
  HINT_PS2_IP: IP-адрес самой PS2. Выберите адрес, который не занят другим устройством, в том же диапазоне, что и у ПК.
  HINT_NETMASK: Маска подсети, обычно 255.255.255.0.
  HINT_GATEWAY: Адрес вашего роутера, обычно те же три первых числа с .1 на конце.
  HINT_DNS: Адрес DNS-сервера. Обычно тот же, что у шлюза.
  HINT_SMB_ADDR_TYPE: Обращаться к ПК по IP-адресу или по имени NetBIOS (имени компьютера).
  HINT_SMB_ADDRESS: 'ПК с вашими играми: его IP-адрес или имя компьютера, если тип адреса NetBIOS.'
  HINT_SMB_PORT: 'Порт SMB. Должен совпадать с ПК: PS2 Servers использует 1111, общие папки Windows и Samba используют 445.'
  HINT_SMB_USER: Имя пользователя SMB. Для большинства общих папок подходит guest.
  HINT_HTTP_SERVER: IP-адрес HTTP-сервера игр.
  HINT_HTTP_PORT: Порт, на котором слушает HTTP-сервер игр.
  HINT_HTTP_BASE: Папка на HTTP-сервере с файлом games.csv. / это корень сервера.
  HINT_HTTP_TEST: Проверяет HTTP-сервер с этими значениями и сообщает, что нашёл.
  HINT_RA_TELEMETRY: Главный выключатель RetroAchievements. Выкл. запускает игры без сетевого стека и снимков, как обычная сборка.
  HINT_RA_BADGES: Отмечает в списке игры с достижениями. Не горит, пока телеметрия выключена.
  HINT_POPS_NET_BUTTON: Правит собственные сетевые файлы POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), нужные играм PS1 по SMB.
  HINT_POPS_IP_TYPE: 'Как PS2 получает адрес, пока игра PS1 работает по SMB: «Статический» или DHCP.'
  HINT_POPS_IP: IP-адрес PS2, пока игра PS1 работает по SMB.
  HINT_POPS_SMB_IP: IP-адрес ПК, где лежат ваши игры PS1.
  HINT_POPS_SMB_SHARE: Имя общей папки на этом ПК, где лежит папка POPS.
  HINT_LASTPLAYED: Открывается на последней запущенной игре.
  HINT_LANGUAGE: Язык меню. Добавьте другие, положив файлы lang_*.lng в папку LNG.
  HINT_GSM_DEFAULTS_BUTTON: Исправления видеорежима, которые получает каждая игра без собственных настроек GSM.
  HINT_DEFDEVICE: Страница, на которой RiptOPL открывается при запуске.
  HINT_MMCE_MODE: Игры на SD2PSX или MemCard PRO2. «Авто» при запуске, «Вручную» при открытии страницы, «Выкл.» скрывает её.
  HINT_MMCE_SETTINGS_BUTTON: Слот, загрузочная карта IGR, GameID и тайминги для MMCE.
  HINT_ENABLE_USB: Загружает драйвер USB-накопителей.
  HINT_ENABLE_MX4SIO: Загружает драйвер адаптера SD-карт MX4SIO.
  HINT_ENABLE_ILINK: Загружает драйвер накопителей iLink (FireWire).
  HINT_NETSTART: 'Запускает сеть: «Авто» при запуске, «Вручную» при открытии её страницы. «Выкл.» не трогает сетевой адаптер.'
  HINT_APPMODE: Страница приложений. «Авто» при запуске, «Вручную» при открытии, «Выкл.» скрывает её.
  HINT_FAVMODE: Страница избранных игр. «Авто» при запуске, «Вручную» при открытии, «Выкл.» скрывает её.
  HINT_BDMA_BUTTON: Какой драйвер exFAT использует POPSTARTER для игр PS1 на USB, MX4SIO, MMCE, HDD или iLink.
  HINT_VCD_LIST_BUTTON: 'Как показываются игры PS1: скрыть ID игр, показать только диск 1, показать разделы PP на HDD.'
  HINT_MMCE_SLOT: В каком слоте карты памяти стоит устройство MMCE. «Авто» находит его.
  HINT_MMCE_GAMEID: Сообщает устройству MMCE, какая игра запускается, чтобы оно переключилось на карту памяти этой игры.
  HINT_MMCE_COMM_BUTTON: Тайминги связи с MMCE. Меняйте их, только если игры зависают или медленно грузятся.
  HINT_MMCE_PATH_BUTTON: Где на карте MMCE лежат папки игр.
  HINT_MMCE_PREFIX: 'Подпапка на карте MMCE с CD, DVD и другими папками OPL. Пусто: корень карты.'
  HINT_GAME_TYPE_LABELS: Ставит [PS1] или [PS2] перед названием каждой игры. Только отображение.
  HINT_MENU_VMODE: Видеовыход меню. Игры используют GSM. Удерживайте «Подтвердить», чтобы оставить новый режим.
  HINT_THEME: Вид меню. Темы читаются из папки THM на каждом устройстве.
  HINT_COVERFLOW_BUTTON: Число, размер, анимация и затемнение обложек для темы Coverflow.
  HINT_ARTWORK_BUTTON: 'Какие изображения грузить: обложки, изображения дисков, фоны и значки сохранений.'
  HINT_COLORS_BUTTON: Цвета текста, выделения, окон и фона.
  HINT_NOTIFICATIONS: Короткие уведомления при загрузке файла настроек, темы или языка.
  HINT_AUTOSORT: Сортирует списки игр от A до Z. «Выкл.» сохраняет порядок, в котором они найдены.
  HINT_AUTOREFRESH: Добавляет игры с только что подключённых устройств без ручного обновления.
  HINT_COVERART: Загружает обложки из папки ART.
  HINT_DISCART: Показывает изображение диска (<ID>_ICO). «Выкл.» скрывает диск, но оставляет обложки и фоны.
  HINT_BGART: Показывает фон игры (<ID>_BG), если тема его использует.
  HINT_ART_TAR: Читает также изображения, упакованные в ART/art.tar.
  HINT_ART_DELAY: 'Сколько курсор стоит на игре, прежде чем загрузятся её изображения. Больше: изображения пропускаются при быстрой прокрутке.'
  HINT_TXTCOLOR: Цвет обычного текста меню.
  HINT_SELCOLOR: Цвет выделенного пункта.
  HINT_UICOLOR: Оттенок фона диалоговых окон.
  HINT_TITLECOLOR: Цвет названий игр в списке.
  HINT_BGCOLOR: Цвет фона меню.
  HINT_PLASCOLOR: Цвет, подмешиваемый в анимированный фон.
  HINT_RESETCOLOR: Восстанавливает встроенные цвета RiptOPL, а не цвета темы.
  HINT_WIDESCREEN: Рисует меню для телевизора 16:9.
  HINT_XOFF: Сдвигает меню на экране влево или вправо.
  HINT_YOFF: Сдвигает меню на экране вверх или вниз.
  HINT_MENU_OVERSCAN: Сжимает меню внутрь, если телевизор обрезает края.
  HINT_APPLYGAMEID: Показывает штрихкод при запуске игры, чтобы устройства Pixel FX, RetroGEM и PS2Digital переключили профиль.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Путь, видеорежим и аргументы Neutrino для всех игр.
  HINT_OSD_DEFAULTS_BUTTON: Язык консоли, формат экрана и видеорежим, передаваемые играм.
  HINT_ENWRITEOP: Разрешает переименовывать и удалять игры и создавать VMC. Никогда не трогает таблицу разделов HDD.
  HINT_DEBUG: 'Помощь разработчикам: цветные экраны при загрузке игры и счётчики загрузки изображений в меню.'
  HINT_BDMPREFIX: 'Подпапка на накопителях USB, MX4SIO, iLink и exFAT с папками игр. Пусто: корень накопителя.'
  HINT_ETHPREFIX: 'Подпапка в общей папке SMB с папками игр. Пусто: корень общей папки.'
  HINT_HDDGAMELISTCACHE: Запоминает список игр на HDD с APA, чтобы ускорить следующие проверки.
  HINT_BDMCACHE: Кэш упреждающего чтения для USB и других накопителей BDM в игре. Больше может сгладить подгрузку, но занимает больше памяти.
  HINT_HDDCACHE: Кэш упреждающего чтения для внутреннего HDD в игре.
  HINT_SMBCACHE: Кэш упреждающего чтения для SMB в игре.
  HINT_CORE_LOADER: Ядро для этой игры, где поддерживаются оба. UDPFS/UDPBD только с Neutrino; SMB/HTTP только с <OPL>. «По умолчанию» следует «Запуску игр».
  HINT_DMA_MODE: Режим передачи внутреннего HDD для этой игры. Снизьте, если игра дёргается или зависает.
  HINT_DNAS_GAMEID: ID диска для сетевых игр DNAS. «Загрузить с диска» читает его с оригинального диска.
  HINT_LOAD_FROM_DISC: Читает ID DNAS с оригинального диска в приводе.
  HINT_ALTSTARTUP: Загружает этот ELF из образа диска вместо указанного в SYSTEM.CNF.
  HINT_VMC_DEFINE: Выбрать, создать или изменить размер виртуальной карты памяти этого слота.
  HINT_VMC_ACTION: «Общая» даёт этому слоту общую карту; «Сброс» убирает выбор.
  HINT_VMC_NAME: Имя файла карты, хранится в папке VMC.
  HINT_VMC_CREATE: Создаёт карту или применяет к ней новый размер.
  HINT_VMC_DELETE: Удаляет этот файл карты.
  HINT_SETTINGS_SOURCE: «Общие» использует общие настройки; «Для игры» хранит их только для этой игры.
  HINT_PADMACRO_TOGGLE: «Пока нажата» замедляет стик, только пока держите кнопку; «Переключение кнопкой» включает и выключает.
  HINT_SFX: Звуковые эффекты меню.
  HINT_BOOT_SND: Играет звук при запуске RiptOPL.
  HINT_BGM: Играет музыку темы или ваш файл музыки темы по умолчанию.
  HINT_SFX_VOLUME: Громкость звуковых эффектов меню.
  HINT_BOOT_SND_VOLUME: Громкость звука запуска.
  HINT_BGM_VOLUME: Громкость фоновой музыки.
  HINT_SCROLL: Как быстро прокручиваются списки, когда вы держите направление.
  HINT_SELECTBUTTON: 'Какая кнопка подтверждает: Крест или Круг.'
  HINT_XSENSITIVITY: Насколько легко левый стик двигает курсор влево и вправо. «Выкл.» его игнорирует.
  HINT_YSENSITIVITY: Насколько легко левый стик двигает курсор вверх и вниз. «Выкл.» его игнорирует.
  HINT_PADEMU_GLOBAL: DualShock 3/4 по USB или Bluetooth и мультитап для всех игр.
  HINT_PADMACRO_GLOBAL: Замедление стика, инверсия осей и турбо для всех игр.
  HINT_COVERFLOW_DIM: Затемняет боковые обложки.
  HINT_OSD_ENABLE: Передаёт игре настройки ниже. «Выкл.» использует настройки консоли.
  HINT_OSD_TVASPECT: Формат телевизора, передаваемый игре.
  HINT_OSD_VMODE: Видеорежим, передаваемый игре.
  DNAS_ID: ID DNAS
  NEUTRINO_PADEMU_WARN: Эмуляция геймпада недоступна с Neutrino. Используйте геймпад PS2 или источник с поддержкой ядра <OPL>.
  RA_MODE: Режим RA
