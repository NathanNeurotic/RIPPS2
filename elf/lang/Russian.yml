  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 не знает, где его папка, поэтому звукам некуда лечь.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 играет музыку меню этой консоли, фоновую пьесу её браузера (%d:%02d), по нотам самого BIOS и записывает её как WAV размером %s в %s; ни на одной карте памяти нет для неё места. Уже лежащий там %s заменяется. Это займёт минуту-другую.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 играет музыку меню этой консоли, фоновую пьесу её браузера (%d:%02d), по нотам самого BIOS и записывает её как WAV размером %s; ни на одной карте памяти нет для неё места. Подтверждение записывает её в %s, рядом с RIPPS2. START записывает её в %s, ресурсы OPL на этом накопителе. Уже лежащий там %s заменяется. Это займёт минуту-другую.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 читает звуки из BIOS этой консоли и записывает их в %s как свои звуки: курсор, подтверждение, отмена, страницы, категория, сообщения, диск, ошибка, сохранение, накопители и случайный выбор, а также музыку запуска и старта игры, сыгранную по нотам самого BIOS. Уже лежащие там файлы с этими именами заменяются.'
