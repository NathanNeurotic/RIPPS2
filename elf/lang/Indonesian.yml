  CAD_EMPTY_LIBRARY: Tidak ada game dengan kemajuan di akun ini.
  CAD_EMPTY_FILTER: Tidak ada pencapaian yang cocok dengan filter ini.
  CAD_LOADING: Memuat pencapaian...
  CAD_PAIR: Masuk ke Caduceus dan pasangkan ART/CADUCEUS.KEY di share SMB-mu.
  CAD_UNKNOWN_GAME: Game ini tidak ada di katalog Caduceus. Segarkan katalog di PC.
  CAD_CONNECTION_ERROR: Tidak bisa menghubungi Caduceus. Periksa koneksi, lalu tekan Select untuk mencoba lagi.
