  RIPPS2_HINT_LAYOUT: Tata Letak Petunjuk
  HINT_RIPPS2_STARSIDE: 'Letak bintang game favorit di daftar. Kiri: kolomnya sendiri di awal setiap baris. Kanan: setelah judul. Tersembunyi: tanpa bintang. Tema: sesuai tema. Ikon baris tema pindah ke ujung lain, jadi keduanya tak pernah bertumpuk.'
  HINT_RIPPS2_HINT_LAYOUT: 'Baris: petunjuk dalam satu garis. Kolom: satu petunjuk per baris, daftar menurun di samping, dimulai di tempat tema menaruh petunjuknya.'
  RIPPS2_HINT_LABELS: Label Petunjuk
  HINT_RIPPS2_HINT_LABELS: Simbol Saja hanya menggambar tombolnya, untuk simbol yang membawa kata-katanya sendiri. Lencana menyatukan simbol dan judul setiap petunjuk dalam satu lencana.
