  PS1_RA_CLEAN_FAILED: Tidak bisa menghapus modul RA yang tak terpakai.
  PS1_RA_CLEAN_CONTINUE: Tetap lanjutkan? Modul RA yang tertinggal bisa menjalankan telemetri usang. Tidak membatalkan peluncuran.
  FAV_REMOVED: Dihapus dari Game Berbintang
  FAV_REMOVE_FAILED: Tidak bisa menghapus dari Game Berbintang
