  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK tidak bisa menulis konfigurasi PS2BBL. Pastikan kartu memori atau drive tidak dilindungi dari penulisan, lalu coba lagi.
