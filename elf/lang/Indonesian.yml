  POPS_UDPFS_ALL_USB_FOLDERS: Semua folder POPS di USB
  POPS_UDPFS_INVALID_SUFFIX: ' (tidak valid)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (tidak lengkap)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS butuh pasangan driver .udpfs terpasang di kartu memori. Pasang manual atau nyalakan BDMA Terapkan saat Peluncuran.
  VMC_REPLACE_REQUIRES_DELETE: Mengubah ukuran VMC akan menghapus game yang tersimpan di dalamnya. Cadangkan VMC yang ada dan pakai Hapus sebelum membuat ukuran baru.
