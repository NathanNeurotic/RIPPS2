  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Kartu memori %d menjalankan %s saat menyala, dan BOOT LOCK hanya bekerja melalui PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 tidak bisa menjalankan RIPPS2 dari tempatnya sekarang (ia menjangkau kartu memori, flashdisk USB, dan MX4SIO). BOOT LOADER > KELOLA bisa menyalin RIPPS2 untuknya ke kartu memori atau flashdisk USB.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
