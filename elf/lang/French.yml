  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE n'a pas pu écrire le programme de démarrage du disque dur (étape %d). %s
  ? 'BIBLE is installed on memory card %d (mc%d:/%s/%s) and BOOT LOCK is on: at power on the console starts RIPPS2 from %s, at once.'
  : 'BIBLE est installé sur la carte mémoire %d (mc%d:/%s/%s) et BOOT LOCK est activé : à l''allumage, la console lance RIPPS2 depuis %s, immédiatement.'
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE est installé sur le disque dur interne et BOOT LOCK est activé : à l''allumage, la console lance RIPPS2 depuis %s%s%s%s, immédiatement. Configuration : %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE est sur la carte mémoire %d, mais sa configuration (%s) n'a pas pu être écrite, il lance donc le navigateur. Libérez de l'espace et relancez GÉRER pour terminer.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE a manqué de mémoire avant de commencer. Rien n'a été modifié.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE a manqué de mémoire. Rien n'a été modifié sur la carte mémoire.
  'BIBLE: binding PS2BBL to the memory card': 'BIBLE : liaison de PS2BBL à la carte mémoire'
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE : copie de RIPPS2 dans %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE : sauvegarde du programme de démarrage du disque dur'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE : remise en place du programme de démarrage du disque dur'
  'BIBLE: restarting the I/O processor with the security module': 'BIBLE : redémarrage du processeur d''E/S avec le module de sécurité'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE : écriture de PS2BBL dans la zone de démarrage du disque dur'
  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK n'a pas pu écrire la configuration PS2BBL. Vérifiez que la carte mémoire ou le périphérique n'est pas protégé en écriture, puis réessayez.
  BOOT LOCK found no PS2BBL config to change.: BOOT LOCK n'a trouvé aucune configuration PS2BBL à modifier.
  BOOT LOCK is off. PS2BBL starts what it started before (%s).: BOOT LOCK est désactivé. PS2BBL lance ce qu'il lançait avant (%s).
  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK est activé. PS2BBL lance maintenant RIPPS2 à l'allumage (%s). Maintenez un raccourci PS2BBL pendant le démarrage de la console pour accéder à autre chose.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK passe par PS2BBL (PlayStation 2 Basic BootLoader), et il n'y en a aucun sur une carte mémoire ici.
  INSTALL BIBLE: INSTALLER BIBLE
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'INSTALLER BIBLE SUR LA CARTE MÉMOIRE %d

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLER BIBLE SUR LE DISQUE DUR INTERNE

    - RIPPS2 est copié dans %s.

    - Le programme de démarrage du disque dur actuellement dans __mbr est lu et conservé dans %s/RIPPS2 (RESTAURER le remet).

    - La version disque dur de PS2BBL 1.2.0 est écrite à sa place, et la console réglée pour la démarrer à l''allumage.

    - Sa configuration (%s) lance d''abord RIPPS2 depuis %s%s%s, BOOT LOCK activé.

    Cela demande une console qui démarre depuis son disque dur (une PS2 fat avec l''adaptateur réseau). Laissez-la allumée jusqu''à la fin.'
  INTERNAL HDD  (its boot area): DISQUE DUR INTERNE  (sa zone de démarrage)
  MEMORY CARD %d  (%s): CARTE MÉMOIRE %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'CARTE MÉMOIRE 0 : %s

    CARTE MÉMOIRE 1 : %s

    %s

    BIBLE est PS2BBL 1.2.0 par El Isra, réglé par RIPPS2 : aucune attente à l''allumage, RIPPS2 d''abord, et un bouton maintenu à l''allumage donne toujours accès au navigateur (TRIANGLE), à un disque (START) et à ce qui s''y trouvait avant (ROND). L''installer ou le réparer sur une carte mémoire ou le disque dur interne ?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: La carte mémoire %d a %d Ko libres, et BIBLE y a besoin de %d Ko. Libérez de l'espace, puis réessayez.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: La carte mémoire %d a %d Ko libres, et la copie de RIPPS2 a besoin de %d Ko. Libérez de l'espace ou choisissez un autre emplacement.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: La carte mémoire %d lance %s à l'allumage, et BOOT LOCK ne fonctionne qu'avec PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 ne peut pas lancer RIPPS2 depuis son emplacement actuel (il atteint les cartes mémoire, les clés USB et MX4SIO). CHARGEUR DE DÉMARRAGE > GÉRER peut copier RIPPS2 sur une carte mémoire ou une clé USB pour lui.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL lance des programmes depuis une carte mémoire, une clé USB ou MX4SIO, et RIPPS2 n'a pas pu se lire lui-même pour s'y copier. Lancez RIPPS2 depuis l'un d'eux, puis réessayez.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'REMETTRE L''ANCIEN PROGRAMME DE DÉMARRAGE DU DISQUE DUR

    Celui que BIBLE a conservé (RIPPS2/MBR-BACKUP.KELF sur le disque dur) retourne dans __mbr, à la place de BIBLE. RIPPS2 et la configuration PS2BBL restent où ils sont.'
  RESTORE: RESTAURER
  RESTORE THE HDD'S OLD BOOT PROGRAM: RESTAURER L'ANCIEN PROGRAMME DE DÉMARRAGE DU DISQUE DUR
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 ne peut pas déterminer la région de cette console d'après sa ROM, il ne sait donc pas quel dossier de mise à jour système elle lit. BIBLE n'a pas été installé.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 n'a pas pu ouvrir la partition __sysconf ou __common du disque dur (erreur %d), BIBLE n'a donc nulle part où y garder RIPPS2 et sa configuration. Rien n'a été modifié.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 n'a pas pu lire le programme de démarrage conservé. Rien n'a été modifié.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 n'a pas pu réécrire le programme de démarrage. Réessayez ; la copie conservée est intacte.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 était occupé à lire un périphérique et n''a pas pu redémarrer le processeur d''E/S. Rien n''a été modifié : réessayez dans un instant.'
  Reading the memory cards: Lecture des cartes mémoire
  The HDD partition BIBLE uses went away. Nothing was changed.: La partition du disque dur qu'utilise BIBLE a disparu. Rien n'a été modifié.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: L'ancien programme de démarrage du disque dur est revenu. BIBLE ne démarre plus depuis le disque dur.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : La console n'a pas voulu lier BIBLE à la carte mémoire %d (l'étape MagicGate a échoué). Rien n'a été modifié sur la carte. Une carte qui n'est pas officielle ou compatible MagicGate ne peut pas contenir de mise à jour système.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Celui qui s''y trouvait est conservé dans RIPPS2/MBR-BACKUP.KELF sur le disque dur : CHARGEUR DE DÉMARRAGE > GÉRER > RESTAURER le remet.'
  The security module would not start on this console. Nothing on the memory card was changed.: Le module de sécurité n'a pas voulu démarrer sur cette console. Rien n'a été modifié sur la carte mémoire.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Il n''y a de carte mémoire PS2 formatée dans aucun emplacement, ni de disque dur interne. BIBLE réside sur une carte mémoire ou le disque dur : insérez une carte, puis réessayez.'
  There is no kept boot program on this HDD. Nothing was changed.: Il n'y a aucun programme de démarrage conservé sur ce disque dur. Rien n'a été modifié.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Ce disque dur n'a pas de partition __sysconf, la configuration de BIBLE doit donc aller sur une carte mémoire (PS2BBL lit d'abord celle d'une carte), et il n'y en a dans aucun emplacement. Insérez-en une, puis réessayez.
