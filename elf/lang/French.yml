  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 joue la musique du menu de cette console, la pièce d'ambiance de son navigateur (%d:%02d), à partir des notes du BIOS lui-même, et l'écrit en WAV de %s dans %s ; aucune carte mémoire n'a la place. Un %s déjà présent est remplacé. Cela prend une minute ou deux.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 joue la musique du menu de cette console, la pièce d'ambiance de son navigateur (%d:%02d), à partir des notes du BIOS lui-même, et l'écrit en WAV de %s ; aucune carte mémoire n'a la place. Valider l'écrit dans %s, à côté de RIPPS2. START l'écrit dans %s, les ressources d'OPL sur ce périphérique. Un %s déjà présent est remplacé. Cela prend une minute ou deux.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 lit les sons du BIOS de cette console et les écrit dans %s comme ses propres sons : curseur, validation, annulation, pages, catégorie, messages, disque, erreur, sauvegarde, périphériques et aléatoire, ainsi que les musiques de démarrage et de lancement de jeu, jouées à partir des notes du BIOS lui-même. Les fichiers de ces noms déjà présents sont remplacés.'
