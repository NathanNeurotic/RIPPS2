  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.

    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 from %s, BOOT LOCK on.

    The I/O processor restarts for this; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL 1.2.0 est lié à cette carte par la console et écrit sous %s/%s.

    - Sa configuration, mc%d:/PS2BBL/CONFIG.INI, lance RIPPS2 depuis %s, BOOT LOCK activé.

    Le processeur d''E/S redémarre pour cela ; la musique et les périphériques reviennent ensuite. Laissez la carte en place et la console allumée jusqu''à la fin.'
