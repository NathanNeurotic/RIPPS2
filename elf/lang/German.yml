  BOOT LOCK could not write the PS2BBL config. Check that the memory card or drive is not write protected, then try again.: BOOT LOCK konnte die PS2BBL-Konfiguration nicht schreiben. Prüfe, dass Speicherkarte oder Laufwerk nicht schreibgeschützt sind, und versuche es erneut.
