  CAD_UDPFS_IMG: 'Der Caduceus-Browser braucht SMB oder UDPFS-Dateien: UDPFS-IMG hat keinen freigegebenen Ordner für seinen Schlüssel.'
  XERA_SET_CLOCK: Noch nicht in deiner RetroAchievements-Bibliothek. Stelle die Uhr der Konsole in den Systemeinstellungen, um seine ganze Liste zu sehen, oder spiele es einmal mit Erfolgen.
  CFG_TITLES: CFG-Titel in Spielelisten zeigen
  HINT_CFG_TITLES: Zeigt statt des Dateinamens den Titel aus der CFG jedes Spiels und sortiert danach. Liest beim Aktualisieren einer Liste jede CFG, also laden Listen langsamer. Nur Anzeige.
  AUTO_VMC_INVALID: Die VMC-Datei dieses Spiels existiert, ist aber keine gültige Speicherkarte, also wurde sie weder benutzt noch ersetzt. Das Spiel startet ohne; prüfe sie im VMC-Menü.
  AUTO_VMC_STILL_RUNNING: Die VMC dieses Spiels wird noch angelegt. Starte das Spiel gleich noch einmal.
  NEUTRINO_DVR_QUICKBOOT: Der DVR-Start braucht den Übergang in den PSX-Modus. Entferne -qb aus den globalen und spielspezifischen Neutrino-Argumenten.
  NEUTRINO_DVR_FILE_MISSING: 'Die DVR-Installation von Neutrino ist unvollständig. Es fehlt die nötige Datei:'
  PARENLOCK_GAME: Jugendschutz
  PARENLOCK_GAME_HINT: Zum Starten dieses Spiels das Jugendschutz-Passwort verlangen.
  PARENLOCK_GAME_NO_PASSWORD: Lege ein Jugendschutz-Passwort fest, sonst wird dieses Spiel nicht gesperrt.
  HINT_ENABLE_PCCF: CompactFlash in der PC CARD früher japanischer PS2. Nur native PS2-Spiele; CF braucht exklusiven PC-CARD-Zugriff. Neu starten, um sie freizugeben.
  PCCF_GAMES: PC-CARD-CF-Spiele
  PCCF_UNAVAILABLE: 'CF nicht verfügbar: braucht eine frühe japanische PS2 mit PC CARD, eine kompatible Karte und keinen aktiven DEV9-, Festplatten- oder Netzwerktreiber.'
  PCCF_UNSUPPORTED_GAME: CF unterstützt derzeit nur native PS2-Spiele. CF-VMC, PS1-Laden und Netzwerkerfolge sind nicht verfügbar.
  HINT_ENABLE_DVR: Experimentelle Suche nach DESR-DVR-ISOs. Braucht die eingeschaltete Festplattenquelle; der Spielstart braucht ein externes DVR-fähiges Neutrino.
