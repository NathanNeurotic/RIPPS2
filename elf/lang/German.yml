  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 weiß nicht, wo sein Ordner ist, also gibt es keinen Platz für die Sounds.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 spielt die Menümusik dieser Konsole, das Ambient-Stück ihres Browsers (%d:%02d), aus den Noten des BIOS selbst und schreibt sie als WAV von %s nach %s; keine Speicherkarte hat Platz dafür. Ein dort schon vorhandenes %s wird ersetzt. Es dauert ein, zwei Minuten.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 spielt die Menümusik dieser Konsole, das Ambient-Stück ihres Browsers (%d:%02d), aus den Noten des BIOS selbst und schreibt sie als WAV von %s; keine Speicherkarte hat Platz dafür. Bestätigen schreibt sie nach %s, neben RIPPS2. START schreibt sie nach %s, OPLs Ressourcen auf diesem Laufwerk. Ein dort schon vorhandenes %s wird ersetzt. Es dauert ein, zwei Minuten.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 liest die Sounds aus dem BIOS dieser Konsole und schreibt sie nach %s als seine Sounds: Cursor, Bestätigen, Abbrechen, Seiten, Kategorie, Meldungen, Disc, Fehler, Speichern, Laufwerke und Zufall, dazu die Musik für Start und Spielstart, gespielt aus den Noten des BIOS selbst. Dort schon vorhandene Dateien mit diesen Namen werden ersetzt.'
