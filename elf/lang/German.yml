  MEMORY CARD %d  (%s): SPEICHERKARTE %d  (%s)
  ? 'MEMORY CARD 0: %s

    MEMORY CARD 1: %s

    %s

    BIBLE is PS2BBL 1.2.0 by El Isra, set up by RIPPS2: no wait at power on, RIPPS2 first, and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Install or repair it on a memory card or the internal HDD?'
  : 'SPEICHERKARTE 0: %s

    SPEICHERKARTE 1: %s

    %s

    BIBLE ist PS2BBL 1.2.0 von El Isra, eingerichtet von RIPPS2: kein Warten beim Einschalten, RIPPS2 zuerst, und eine beim Einschalten gehaltene Taste erreicht weiterhin den Browser (DREIECK), eine Disc (START) und das, was vorher da war (KREIS). Auf einer Speicherkarte oder der internen Festplatte installieren oder reparieren?'
  Memory card %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Speicherkarte %d hat %d KB frei, und BIBLE braucht dort %d KB. Mach Platz frei und versuche es erneut.
  Memory card %d has %d KB free, and the copy of RIPPS2 needs %d KB. Free some space or choose another place.: Speicherkarte %d hat %d KB frei, und die Kopie von RIPPS2 braucht %d KB. Mach Platz frei oder wähle einen anderen Ort.
  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Speicherkarte %d startet beim Einschalten %s, und BOOT LOCK funktioniert nur über PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 kann RIPPS2 nicht von seinem jetzigen Ort starten (es erreicht Speicherkarten, USB-Sticks und MX4SIO). BOOTLOADER > VERWALTEN kann RIPPS2 dafür auf eine Speicherkarte oder einen USB-Stick kopieren.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL startet Programme von einer Speicherkarte, einem USB-Stick oder MX4SIO, und RIPPS2 konnte sich nicht selbst lesen, um sich dorthin zu kopieren. Starte RIPPS2 von einem davon und versuche es erneut.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ALTES BOOTPROGRAMM DER FESTPLATTE ZURÜCKLEGEN

    Das von BIBLE aufbewahrte (RIPPS2/MBR-BACKUP.KELF auf der Festplatte) kommt zurück in __mbr, an BIBLEs Stelle. RIPPS2 und die PS2BBL-Konfiguration bleiben, wo sie sind.'
  RESTORE: WIEDERHERSTELLEN
  RESTORE THE HDD'S OLD BOOT PROGRAM: ALTES BOOTPROGRAMM DER FESTPLATTE WIEDERHERSTELLEN
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 kann die Region dieser Konsole nicht aus ihrem ROM erkennen und weiß daher nicht, welchen Systemupdate-Ordner sie liest. BIBLE wurde nicht installiert.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 konnte die Partition __sysconf oder __common der Festplatte nicht öffnen (Fehler %d), also hat BIBLE dort keinen Platz für RIPPS2 und seine Konfiguration. Es wurde nichts geändert.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 konnte das aufbewahrte Bootprogramm nicht lesen. Es wurde nichts geändert.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 konnte das Bootprogramm nicht zurückschreiben. Versuche es erneut; die aufbewahrte Kopie ist unberührt.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 war mit dem Lesen eines Laufwerks beschäftigt und konnte den E/A-Prozessor nicht neu starten. Es wurde nichts geändert: Versuche es gleich noch einmal.'
  Reading the memory cards: Lese die Speicherkarten
  The HDD partition BIBLE uses went away. Nothing was changed.: Die Festplattenpartition, die BIBLE nutzt, ist verschwunden. Es wurde nichts geändert.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Das alte Bootprogramm der Festplatte ist zurück. BIBLE startet nicht mehr von der Festplatte.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Die Konsole wollte BIBLE nicht an Speicherkarte %d binden (der MagicGate-Schritt schlug fehl). Auf der Karte wurde nichts geändert. Eine Karte, die nicht original oder MagicGate-kompatibel ist, kann kein Systemupdate aufnehmen.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Das vorherige liegt in RIPPS2/MBR-BACKUP.KELF auf der Festplatte: BOOTLOADER > VERWALTEN > WIEDERHERSTELLEN legt es zurück.'
  The security module would not start on this console. Nothing on the memory card was changed.: Das Sicherheitsmodul startete auf dieser Konsole nicht. Auf der Speicherkarte wurde nichts geändert.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'In keinem Steckplatz ist eine formatierte PS2-Speicherkarte, und es gibt keine interne Festplatte. BIBLE lebt auf einer Speicherkarte oder der Festplatte: Stecke eine Karte ein und versuche es erneut.'
  There is no kept boot program on this HDD. Nothing was changed.: Auf dieser Festplatte ist kein aufbewahrtes Bootprogramm. Es wurde nichts geändert.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Diese Festplatte hat keine Partition __sysconf, also muss BIBLEs Konfiguration auf eine Speicherkarte (PS2BBL liest zuerst die einer Karte), und in keinem Steckplatz ist eine. Stecke eine ein und versuche es erneut.
