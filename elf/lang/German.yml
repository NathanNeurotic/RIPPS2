  ? BOOT LOCK is on. PS2BBL now starts RIPPS2 at power on (%s). Hold a PS2BBL hotkey while the console starts to reach anything else.%s
  : BOOT LOCK ist an. PS2BBL startet jetzt beim Einschalten RIPPS2 (%s). Halte beim Start der Konsole eine PS2BBL-Taste, um etwas anderes zu erreichen.%s
  BOOT LOCK works through PS2BBL (PlayStation 2 Basic BootLoader), and there is none on a memory card here.: BOOT LOCK arbeitet über PS2BBL (PlayStation 2 Basic BootLoader), und hier ist keins auf einer Speicherkarte.
  INSTALL BIBLE: BIBLE INSTALLIEREN
  ? 'INSTALL BIBLE ON MEMORY CARD %d

    '
  : 'BIBLE AUF SPEICHERKARTE %d INSTALLIEREN

    '
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'BIBLE AUF DER INTERNEN FESTPLATTE INSTALLIEREN

    - RIPPS2 wird nach %s kopiert.

    - Das Bootprogramm der Festplatte, das jetzt in __mbr liegt, wird ausgelesen und in %s/RIPPS2 aufbewahrt (WIEDERHERSTELLEN legt es zurück).

    - Der Festplatten-Build von PS2BBL 1.2.0 wird an seine Stelle geschrieben und die Konsole so eingestellt, dass sie ihn beim Einschalten startet.

    - Seine Konfiguration (%s) startet RIPPS2 zuerst von %s%s%s, BOOT LOCK an.

    Das braucht eine Konsole, die von ihrer Festplatte bootet (eine Fat-PS2 mit dem Netzwerkadapter). Lass sie an, bis es fertig meldet.'
