  POPS_UDPFS_NOT_READY: POPS-UDPFS braucht passende gültige IPCONFIG.DAT und UDPFSCONFIG.DAT in jedem POPS-Ordner auf USB. Richte sie in den POPS-Netzwerkeinstellungen ein.
