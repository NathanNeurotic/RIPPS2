  : RIPPS2 přehraje hudbu menu této konzole, ambientní skladbu jejího prohlížeče (%d:%02d), z vlastních not BIOSu a zapíše ji jako WAV o velikosti %s do %s; žádná paměťová karta ji nepojme. %s, který tam už je, bude nahrazen. Trvá to minutu nebo dvě.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s; no memory card has room for it. Accept writes it to %s, beside RIPPS2. START writes it to %s, OPL's resources on that drive. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 přehraje hudbu menu této konzole, ambientní skladbu jejího prohlížeče (%d:%02d), z vlastních not BIOSu a zapíše ji jako WAV o velikosti %s; žádná paměťová karta ji nepojme. Potvrdit ji zapíše do %s, vedle RIPPS2. START ji zapíše do %s, do prostředků OPL na tom disku. %s, který tam už je, bude nahrazen. Trvá to minutu nebo dvě.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 přečte zvuky z vlastního BIOSu této konzole a zapíše je do %s jako své zvuky: kurzor, potvrzení, zrušení, stránky, kategorie, zprávy, disk, chyba, uložení, disky a náhodný, plus hudbu startu a spuštění hry, přehranou z vlastních not BIOSu. Soubory s těmito názvy, které tam už jsou, budou nahrazeny.'
