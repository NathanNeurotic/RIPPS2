  Memory card %d starts %s at power on, and BOOT LOCK works only through PS2BBL.: Paměťová karta %d při zapnutí spouští %s a BOOT LOCK funguje jen přes PS2BBL.
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO). BOOT LOADER > MANAGE can copy RIPPS2 to a memory card or a USB drive for it.
  : PS2BBL 1.2.0 nemůže spustit RIPPS2 z místa, kde je teď (dosáhne na paměťové karty, USB disky a MX4SIO). ZAVADĚČ > SPRAVOVAT pro něj může RIPPS2 zkopírovat na paměťovou kartu nebo USB disk.
  ? PS2BBL starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 could not read itself to copy there. Start RIPPS2 from one of those, then try again.
  : PS2BBL spouští programy z paměťové karty, USB disku nebo MX4SIO, a RIPPS2 nedokázalo přečíst samo sebe, aby se tam zkopírovalo. Spusťte RIPPS2 z některého z nich a zkuste to znovu.
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
