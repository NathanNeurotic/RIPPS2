labels:
  HINT_NEUTRINO_AUTO_ELF: Předá zaváděcí ELF hry Neutrinu, aby vyhledalo nastavení pro daný titul. Ve výchozím stavu zapnuto; ručně nastavená volba Boot ELF má přednost.
  HINT_POPSTARTER_PATH: Kde je POPSTARTER.ELF. Když zůstane prázdné, RIPPS2 doplní ten, který najde na disku; přepište, chcete-li jiný, např. usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Argumenty Neutrina přesahují délku, kterou lze uložit. Před uložením některé pole zkraťte.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Spouštěcí argumenty Neutrina přesahují bezpečný limit. Zkraťte globální nebo herní argumenty.
  NEUTRINO_AUTO_ELF: Automatický Boot ELF (-elf)
  HINT_NEUTRINO_PATH: 'Kde je neutrino.elf? <nenastaveno> = zařízení hry -> mc0/mc1. Vlastní úplná cesta se zkouší první. Příklady: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Zobrazení her PS2/PS1
  HINT_GAME_VIEW_MODE: Vše zobrazí hry PS2 a PS1 dohromady a L3 přepíná Vše, PS1, PS2. PS2 nebo PS1 zobrazí jen ten typ a vypne L3. APPS a Oblíbené hry mají vlastní pravidla zobrazení.
  VIEW_MIXED: Zobrazeny hry PS2 + PS1
  VIEW_PS1_ELF: Zobrazeny aplikace PS1 ELF
  APPS_DISPLAY: Zobrazení aplikací
  HINT_APPS_DISPLAY: Vše zobrazí každý ELF v jednom seznamu APPS s vypnutým L3. Aplikace / PS1ELF oddělí tituly s [PS1] na druhou stránku L3; spouštění se nemění.
  VIEW: Zobrazení
  VIEW_PS2: Zobrazeny oblíbené hry PS2
  VIEW_PS1: Zobrazeny oblíbené hry PS1
  VIEW_ELF: Zobrazeny oblíbené ELF
  VIEW_ALL: Zobrazeny všechny oblíbené hry
  VMC_FRAGMENTED_ON_CREATE: VMC byla vytvořena, ale je fragmentovaná. Emulace paměťové karty potřebuje jeden souvislý soubor, takže se tato VMC při spuštění přeskočí a použije se skutečná karta. Uvolněte místo a vytvořte ji znovu, nebo ji zkopírujte z jiného zařízení.
